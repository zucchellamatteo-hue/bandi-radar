# Bandi Radar - servizi di produzione (Fase 0).
# Si avvia con: docker compose up -d --build
# Le variabili ${...} arrivano dal file .env accanto a questo file (vedi deploy/env.example).

name: bandi-radar

services:

  # Database: tutti i dati (bandi, fonti, profili) stanno qui.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Il backup notturno (deploy/bootstrap.sh) usa l'utente "postgres": lascia il default.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD nel file .env}
      POSTGRES_DB: ${POSTGRES_DB:-bandi_radar}
    volumes:
      - pgdata:/var/lib/postgresql/data   # volume persistente: i dati sopravvivono ai riavvii
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bandi_radar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Applicazione Python (FastAPI): per ora /health e una pagina "in costruzione".
  # All'avvio applica le migrazioni del database (app/db/migrazioni), poi parte il server web.
  app:
    build: .
    restart: unless-stopped
    command: sh -c "python -m app.db.migrazioni && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      # Dati di accesso al database passati separati (non in un URL): cosi' la password
      # puo' contenere qualunque carattere, anche / + = che in un URL romperebbero tutto.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-bandi_radar}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?imposta BASIC_AUTH_USER nel file .env}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?imposta BASIC_AUTH_PASSWORD nel file .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Raccolta (Fase 1): ogni ora controlla le fonti in scadenza e salva gli annunci nel database.
  # Stessa immagine dell'app, comando diverso. Log: docker compose logs -f raccolta
  raccolta:
    build:
      context: .
      dockerfile: deploy/Dockerfile.raccolta   # immagine con Chromium per le fonti JavaScript
    restart: unless-stopped
    command: sh -c "python -m app.db.migrazioni && python -m app.raccolta.demone"
    shm_size: 512m                              # Chromium ne ha bisogno
    networks: [default, ipv6]                   # ipv6: per le fonti con richiesta.ipv6 (siti che rifiutano l'IPv4 del server)
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-bandi_radar}
      RACCOLTA_INTERVALLO_SECONDI: ${RACCOLTA_INTERVALLO_SECONDI:-3600}
      TZ: Europe/Rome
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_MATTEO: ${EMAIL_MATTEO:-}
      EMAIL_MITTENTE: ${EMAIL_MITTENTE:-}
    depends_on:
      db:
        condition: service_healthy

  # Caddy: pubblica l'applicazione in HTTPS con certificato automatico Let's Encrypt.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-finanzagevolata.qiaro.it}
      ACME_EMAIL: ${ACME_EMAIL:?imposta ACME_EMAIL nel file .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificati: persistenti, cosi' non si richiedono a ogni riavvio
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

# Rete in piu', solo per la raccolta: esce anche in IPv6 (Docker assegna da solo gli indirizzi interni).
# La rete "default" resta com'era, cosi' database e app non cambiano.
networks:
  default:
  ipv6:
    enable_ipv6: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
