# Bandi Radar - servizi di produzione.
# Si avvia con: docker compose up -d --build
# Le variabili ${...} arrivano dal file .env accanto a questo file (vedi deploy/env.example).

name: bandi-radar

# Log dei container: al massimo 5 file da 20 MB per servizio (02/10: prima crescevano senza limite).
x-log: &log
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # Database: tutti i dati (bandi, fonti, profili) stanno qui.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *log
    environment:
      # Il backup notturno (deploy/bootstrap.sh) usa l'utente "postgres": lascia il default.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD nel file .env}
      POSTGRES_DB: ${POSTGRES_DB:-bandi_radar}
    volumes:
      - pgdata:/var/lib/postgresql/data   # volume persistente: i dati sopravvivono ai riavvii
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bandi_radar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Applicazione Python (FastAPI): la plancia (React), la sua API sotto /api e /health.
  # All'avvio applica le migrazioni del database (app/db/migrazioni), poi parte il server web.
  # Legge (senza poterli modificare) gli allegati scaricati dalla raccolta, per servirli dalla plancia.
  app:
    build: .
    restart: unless-stopped
    logging: *log
    command: sh -c "python -m app.db.migrazioni && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      # Dati di accesso al database passati separati (non in un URL): cosi' la password
      # puo' contenere qualunque carattere, anche / + = che in un URL romperebbero tutto.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-bandi_radar}
      # Dal 05/10 si entra con email e password (tabella utenti). Utente e password del .env servono solo
      # finche' non c'e' nessun amministratore: chi entra con quelli diventa il primo admin (app/utenti).
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      SITO_URL: ${SITO_URL:-https://finanzagevolata.qiaro.it}   # per i link nelle email (invito, nuova password)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_MITTENTE: ${EMAIL_MITTENTE:-}
      EMAIL_CONTATTO: ${EMAIL_CONTATTO:-}
      EMAIL_MATTEO: ${EMAIL_MATTEO:-}
      REGISTRAZIONE_APERTA: ${REGISTRAZIONE_APERTA:-0}             # 1 = le imprese possono registrarsi da sole
      EMAIL_IMPRESE_APPROVAZIONE: ${EMAIL_IMPRESE_APPROVAZIONE:-1} # 1 = le email alle imprese partono dopo l'ok di Matteo
      PAGINA_PUBBLICA: ${PAGINA_PUBBLICA:-0}       # 1 = "/" mostra la presentazione a chi non ha fatto l'accesso
      BLOG_PUBBLICO: ${BLOG_PUBBLICO:-0}           # 1 = apre ai motori solo il blog (/blog, /llms.txt, sitemap), landing chiusa
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}  # codice del meta tag di Google Search Console
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}      # codice del meta tag di Bing Webmaster Tools (msvalidate.01)
      GOOGLE_ADS_ID: ${GOOGLE_ADS_ID:-}            # es. AW-123456789: misurazione delle campagne, solo con il consenso
      ESEMPI_BANDI: ${ESEMPI_BANDI:-}              # schede di esempio nella presentazione (id separati da virgola)
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}  # es. G-XXXXXXX: Google Analytics 4, solo con il consenso
      TITOLARE_SITO: ${TITOLARE_SITO:-}            # nel piede della landing: ragione sociale e P.IVA (Google Ads lo chiede)
      AUTORE_ARTICOLI: ${AUTORE_ARTICOLI:-}        # chi firma gli articoli del blog, es. "Mario Rossi, commercialista"
      PROFILI_SOCIAL: ${PROFILI_SOCIAL:-}          # LinkedIn, Google Business Profile... (https, separati da virgola) per i dati strutturati
      # Abbonamenti (app/abbonamenti): spenti finche' ABBONAMENTI_ATTIVI non e' 1; solo chiavi di prova di Stripe
      # finche' STRIPE_PAGAMENTI_VERI non e' 1 (via di Matteo: termini, privacy, fatturazione elettronica).
      ABBONAMENTI_ATTIVI: ${ABBONAMENTI_ATTIVI:-0}
      PROVA_GIORNI: ${PROVA_GIORNI:-14}
      PREZZI_IVA_INCLUSA: ${PREZZI_IVA_INCLUSA:-0}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PORTALE: ${STRIPE_PORTALE:-}
      STRIPE_PORTALE_ANNUALE: ${STRIPE_PORTALE_ANNUALE:-}
      STRIPE_PAGAMENTI_VERI: ${STRIPE_PAGAMENTI_VERI:-0}
      STRIPE_IVA_22: ${STRIPE_IVA_22:-}                # aliquota IVA 22% in Stripe (prezzi IVA esclusa)
      # Fattura elettronica (app/fatture): spenta finche' FATTURE_ATTIVE non e' 1; chiave vera solo con FATTURE_VERE=1.
      FATTURE_ATTIVE: ${FATTURE_ATTIVE:-0}
      FATTURE_VERE: ${FATTURE_VERE:-0}
      INVOICETRONIC_API_KEY: ${INVOICETRONIC_API_KEY:-}
      INVOICETRONIC_WEBHOOK_SECRET: ${INVOICETRONIC_WEBHOOK_SECRET:-}
      FATTURE_EMITTENTE_DENOMINAZIONE: ${FATTURE_EMITTENTE_DENOMINAZIONE:-}
      FATTURE_EMITTENTE_PARTITA_IVA: ${FATTURE_EMITTENTE_PARTITA_IVA:-}
      FATTURE_EMITTENTE_CODICE_FISCALE: ${FATTURE_EMITTENTE_CODICE_FISCALE:-}
      FATTURE_EMITTENTE_REGIME: ${FATTURE_EMITTENTE_REGIME:-RF01}
      FATTURE_EMITTENTE_INDIRIZZO: ${FATTURE_EMITTENTE_INDIRIZZO:-}
      FATTURE_EMITTENTE_CAP: ${FATTURE_EMITTENTE_CAP:-}
      FATTURE_EMITTENTE_COMUNE: ${FATTURE_EMITTENTE_COMUNE:-}
      FATTURE_EMITTENTE_PROVINCIA: ${FATTURE_EMITTENTE_PROVINCIA:-}
      ALLEGATI_CARTELLA: /srv/allegati
    volumes:
      - allegati:/srv/allegati:ro         # sola lettura: scrive solo la raccolta
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Raccolta (Fase 1): ogni ora controlla le fonti in scadenza e salva gli annunci nel database.
  # Stessa immagine dell'app, comando diverso. Log: docker compose logs -f raccolta
  # Dalla Fase 3 si usa anche per lo smistamento e gli allegati (deploy/MANUALE.md):
  #   docker compose run --rm raccolta python -m app.schede.smista
  #   docker compose run --rm raccolta python -m app.schede.allegati
  raccolta:
    build:
      context: .
      dockerfile: deploy/Dockerfile.raccolta   # immagine con Chromium per le fonti JavaScript
    restart: unless-stopped
    logging: *log
    command: sh -c "python -m app.db.migrazioni && python -m app.raccolta.demone"
    shm_size: 512m                              # Chromium ne ha bisogno
    networks: [default, ipv6]                   # ipv6: per le fonti con richiesta.ipv6 (siti che rifiutano l'IPv4 del server)
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-bandi_radar}
      RACCOLTA_INTERVALLO_SECONDI: ${RACCOLTA_INTERVALLO_SECONDI:-3600}
      TZ: Europe/Rome
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}      # vuota = IA spenta (app/schede/ia.py)
      IA_TETTO_MESE_USD: ${IA_TETTO_MESE_USD:-30}
      IA_SCHEDE_API: ${IA_SCHEDE_API:-0}            # 1 = anche le schede con l'API; 0 = schede nelle sessioni (02/10)
      SCHEDE_NON_PROFIT: ${SCHEDE_NON_PROFIT:-0}    # 1 = con l'API anche le schede dei bandi solo non profit; 0 = solo in sessione (07/10)
      IA_PRELIMINARI_DIRETTI: ${IA_PRELIMINARI_DIRETTI:-0}   # 1 = controlli preliminari con chiamate dirette (doppio prezzo); 0 = a lotti (05/10)
      CATENA_AUTOMATICA: ${CATENA_AUTOMATICA:-1}     # 0 = solo raccolta, senza smistamento/pagine/allegati/IA nel giro orario
      EMAIL_MATTEO: ${EMAIL_MATTEO:-}
      EMAIL_MITTENTE: ${EMAIL_MITTENTE:-}
      EMAIL_CONTATTO: ${EMAIL_CONTATTO:-}
      SITO_URL: ${SITO_URL:-https://finanzagevolata.qiaro.it}      # link nelle email settimanali alle imprese
      EMAIL_IMPRESE_APPROVAZIONE: ${EMAIL_IMPRESE_APPROVAZIONE:-1}
      RAPPORTO_SEO: ${RAPPORTO_SEO:-giornaliero}    # email SEO/GEO a Matteo: giornaliero | settimanale | spento (07/10)
      ALLEGATI_CARTELLA: /srv/allegati
    volumes:
      - allegati:/srv/allegati            # documenti dei bandi (PDF, moduli, FAQ), una cartella per annuncio
    depends_on:
      db:
        condition: service_healthy

  # Caddy: pubblica l'applicazione in HTTPS con certificato automatico Let's Encrypt.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *log
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-finanzagevolata.qiaro.it}
      SITE_ALTRI: ${SITE_ALTRI:-http://alias.invalid}                       # indirizzi da rinviare al principale (es. www, vecchio dominio)
      ACME_EMAIL: ${ACME_EMAIL:?imposta ACME_EMAIL nel file .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificati: persistenti, cosi' non si richiedono a ogni riavvio
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

# Rete in piu', solo per la raccolta: esce anche in IPv6 (Docker assegna da solo gli indirizzi interni).
# La rete "default" resta com'era, cosi' database e app non cambiano.
networks:
  default:
  ipv6:
    enable_ipv6: true

volumes:
  pgdata:
  allegati:      # allegati scaricati (Fase 3): persistenti, sopravvivono ai riavvii e agli aggiornamenti
  caddy_data:
  caddy_config:
