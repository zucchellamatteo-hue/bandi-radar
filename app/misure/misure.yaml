          - ["200.000 euro - comuni ammessi di Abruzzo, Marche, Umbria", "70.000 (52.500)", "50.000 (37.500)", "30.000 (22.500), solo nuova attivita'"]
          - ["1 milione - Campania, Puglia, Calabria, Sicilia", "600.000 (450.000)", "500.000 (375.000)", "400.000 (300.000)"]
          - ["1 milione - Basilicata, Molise, Sardegna", "500.000 (375.000)", "400.000 (300.000)", "300.000 (225.000)"]
          - ["1 milione - comuni ammessi di Abruzzo, Marche, Umbria", "350.000 (262.500)", "250.000 (187.500)", "150.000 (112.500), solo nuova attivita'"]
