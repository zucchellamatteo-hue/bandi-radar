# Misure nazionali "automatiche" o a sportello permanente, separate dai bandi.
# Si cumulano (nei limiti indicati) con i bandi a fondo perduto.
# Ricerca e fonti: docs/ricerche/2026-10-05_misure_nazionali.md
# Regola: dove un dato non e' stato verificato su fonte ufficiale c'e' scritto "da verificare".
# beneficio_stimato: percentuale del costo dell'investimento (o della spesa agevolata) che torna
# all'impresa, stima prudente, prima di eventuali cumuli.
# esempi (06/10/2026, richiesta di Matteo): per ogni misura aperta, un caso pratico per ciascun profilo tipo
# di profili_esempio, con l'interesse (alto, medio, basso, nullo). Numeri indicativi calcolati con le regole
# della misura scritte qui sotto; dove un dettaglio non e' certo c'e' scritto "da verificare".
# aggiunta_il (07/10/2026): quando la misura e' entrata in Bandi Radar. Le misure aperte aggiunte da poco compaiono una
# volta nell'email del lunedi' delle imprese a cui sono adatte (app/notifiche/email_imprese.py).

profili_esempio:
  - id: ufficio_servizi
    nome: "Studio o ufficio di servizi"
    descrizione: >-
      5-15 addetti, una sede (ufficio di 200-300 m2), consumi di energia modesti: riscaldamento,
      condizionamento, computer. Es. agenzia, studio tecnico, societa' di consulenza.
  - id: negozio
    nome: "Negozio, commercio al dettaglio"
    descrizione: >-
      2-8 addetti, uno o due punti vendita di 100-300 m2 con vetrine, illuminazione e climatizzazione;
      spesso in affitto.
  - id: ristorazione_ricettivo
    nome: "Bar, ristorante, hotel"
    descrizione: >-
      10-40 addetti, una struttura con cucina, molta acqua calda e climatizzazione tutto l'anno:
      consumi termici alti.
  - id: artigiano
    nome: "Artigiano, laboratorio"
    descrizione: >-
      3-10 addetti, un laboratorio di 300-600 m2 con macchine e un ambiente da scaldare;
      spesso ditta individuale o snc.
  - id: manifattura
    nome: "Manifattura PMI con capannone"
    descrizione: >-
      50-150 addetti (media impresa), un capannone di 3.000-8.000 m2 da riscaldare e raffrescare,
      linee produttive; societa' di capitali in utile.
  - id: logistica
    nome: "Logistica e trasporti con piu' sedi"
    descrizione: >-
      30-200 addetti, 4-10 magazzini o depositi in province diverse, coperture grandi, luci accese a lungo,
      mezzi di movimentazione e spesso una flotta.
  - id: agricola
    nome: "Azienda agricola o agroalimentare"
    descrizione: >-
      5-20 addetti, terreni, serre o celle frigo, a volte trasformazione (cantina, caseificio, frantoio);
      spesso reddito agrario da catasto, non da bilancio.
  - id: startup
    nome: "Startup innovativa, impresa digitale"
    descrizione: >-
      3-15 addetti, uffici in affitto o coworking, pochi beni materiali, spese soprattutto in persone e
      software; nei primi anni spesso in perdita.

misure:

  - id: conto_termico_3
    nome: "Conto Termico 3.0"
    aggiunta_il: 2026-10-05
    tipo: contributo_conto_capitale
    ente: "GSE (Gestore dei Servizi Energetici), per conto del MASE"
    norma: >-
      DM MASE 7 agosto 2025 (GU 26/09/2025, in vigore dal 25/12/2025), in particolare
      art. 17 (cumulo), Titolo V artt. 24-28 (imprese); Regole Applicative GSE approvate il 19/12/2025.
    url_ufficiale: "https://www.gse.it/servizi-per-te/efficienza-energetica/conto-termico-3-0"
    in_vigore_dal: "2025-12-25"
    in_vigore_fino_al: null
    stato: aperto
    sintesi: >-
      Contributo a fondo perduto del GSE per lavori di efficienza energetica sugli edifici
      (cappotto, infissi, illuminazione LED, building automation, fotovoltaico o colonnine
      solo insieme a una pompa di calore) e per impianti termici a fonti rinnovabili
      (pompe di calore, biomassa, solare termico, scaldacqua a pompa di calore).
      Per le imprese copre dal 25% al 65% della spesa ammessa, pagato dal GSE dopo la fine
      dei lavori, in una rata se fino a 15.000 euro, altrimenti in rate annuali.
    a_chi_si_rivolge: >-
      Imprese di ogni dimensione (anche agricole e ditte individuali) che hanno la disponibilita'
      dell'edificio; Pubbliche amministrazioni ed Enti del Terzo Settore; privati per alcuni interventi.
      Per le imprese: interventi di efficienza (Titolo II) solo su edifici dell'ambito terziario
      (categorie catastali indicate nelle Regole Applicative, es. gruppi B, C esclusi C/6-C/7, D escluso D/9, A/10);
      impianti rinnovabili (Titolo III) anche altrove.
    soggetti_ammessi: [impresa, libero_professionista, ente_terzo_settore, ente_pubblico, persona_fisica]
    dimensioni_ammesse: []
    settori_esclusi: >-
      Nessun settore escluso in quanto tale. Esclusi: imprese in difficolta', imprese con ordine di
      recupero di aiuti illegali pendente, cause di esclusione artt. 94-95 D.Lgs. 36/2023 e art. 67
      D.Lgs. 159/2011. Per imprese ed ETS economici non sono ammessi apparecchi alimentati a
      combustibili fossili, incluso il gas naturale (niente pompe di calore a gas).
    investimenti_ammessi: >-
      Titolo II (efficienza energetica, edifici esistenti): II.A isolamento superfici opache;
      II.B sostituzione infissi; II.C schermature solari; II.D trasformazione in edificio a energia
      quasi zero (nZEB); II.E illuminazione efficiente interna e pertinenze; II.F building automation
      e termoregolazione; II.G colonnine di ricarica insieme a pompa di calore elettrica; II.H
      fotovoltaico e accumulo insieme a pompa di calore elettrica.
      Titolo III (rinnovabili termiche, fino a 2.000 kW): III.A pompe di calore; III.B sistemi ibridi;
      III.C generatori a biomassa (anche serre e calore di processo); III.D solare termico (fino a
      2.500 m2); III.E scaldacqua a pompa di calore; III.F allaccio a teleriscaldamento efficiente;
      III.G microcogenerazione da rinnovabili. Requisito per le imprese: risparmio di almeno il 10%
      di energia rispetto alla situazione prima (20% per i multi-intervento), secondo la pagina GSE.
    categorie_spesa: [energia_efficienza, opere_edili_impianti]
    intensita: >-
      Imprese, Titolo II: base 25% dei costi ammissibili per intervento singolo, 30% per multi-intervento
      (30% massimo per II.D, II.G, II.H); +20 punti piccole imprese, +10 medie; +15 zone assistite
      art. 107.3.a TFUE, +5 zone 107.3.c; +15 se la prestazione energetica migliora di almeno il 40%.
      Tetto: 65% piccole e medie, 60% grandi.
      Imprese, Titolo III: 45% dei costi ammissibili; +20 piccole, +10 medie. Tetto: 65% piccole,
      55% medie, 45% grandi.
      In ogni caso entro i costi massimi unitari (euro/m2, euro/kW) delle Regole Applicative; IVA esclusa.
      Limiti Titolo V: 150 milioni di euro l'anno per tutte le imprese, 30 milioni per impresa e intervento.
      Budget annuo complessivo 900 milioni (500 privati, di cui 150 imprese; 400 PA).
    beneficio_stimato:
      percentuale_min: 25
      percentuale_max: 65
      nota: >-
        Contributo diretto, non fiscale: e' gia' la percentuale della spesa. Grande impresa con un
        solo intervento di efficienza fuori dalle zone assistite = 25%; piccola impresa con
        multi-intervento in zona 107.3.a = tetto 65%. Il valore reale puo' essere piu' basso per i
        costi massimi unitari. Contributo in conto impianti: tassato come ricavo pro quota.
    come_si_ottiene: >-
      1) Imprese: PRIMA dell'avvio dei lavori (primo ordine vincolante o inizio cantiere) inviare sul
      Portaltermico la "richiesta preliminare" (Modello 4), pena l'inammissibilita'.
      2) Realizzare l'intervento con asseverazione del tecnico, diagnosi/APE dove richiesti, pagamenti tracciabili.
      3) Entro 90 giorni dalla fine lavori presentare la richiesta di "accesso diretto" sul Portaltermico
      (le imprese non possono usare la prenotazione, riservata a PA ed ETS).
      4) Firma della scheda-contratto con il GSE dopo l'istruttoria.
    tempi: >-
      Pagamento entro l'ultimo giorno del mese successivo al bimestre in cui il GSE ammette l'istanza.
      Fino a 15.000 euro rata unica; oltre, rate annuali costanti (2 anni per pompe di calore fino a
      35 kW, fino a 5 anni per isolamento e infissi). Trattenuta GSE 1% del contributo, max 250 euro + IVA.
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Art. 17: niente Conto Termico se per lo stesso intervento ci sono altri "incentivi statali"
        (contributi erogati direttamente da un'Amministrazione centrale), salvo fondi di garanzia,
        fondi di rotazione e contributi in conto interessi (quindi si' Fondo di garanzia PMI e
        Nuova Sabatini). Per le imprese, art. 27: cumulabile con altri aiuti di Stato sugli stessi
        costi (es. bandi regionali/camerali) nel limite delle intensita' massime sopra (65%/60%,
        65%/55%/45%). Il GSE (FAQ) considera incentivi statali anche detrazioni fiscali, crediti
        d'imposta, Transizione 5.0 e iperammortamento: quindi NON cumulabile con iperammortamento
        e crediti d'imposta sulle stesse spese (posizione prudente da seguire). Va dichiarato
        ogni altro aiuto (codici COR del Registro Nazionale Aiuti).
      riferimento: "DM 7/8/2025 artt. 17 e 27; Regole Applicative GSE par. 4.5"
    attenzione: >-
      Richiesta preliminare prima dell'avvio dei lavori (anche un ordine firmato o un acconto fanno
      partire i lavori). Domanda entro 90 giorni dalla fine lavori, a pena di inammissibilita'.
      Il portale e' stato sospeso il 3/3/2026 per troppe richieste (circa 1,3 miliardi) e riaperto il
      13/4/2026 solo in accesso diretto: le risorse annuali possono esaurirsi, controllare i contatori GSE.
      Edificio deve essere esistente e accatastato; per Titolo II solo ambito terziario. Prodotti
      a catalogo GSE semplificano. Controlli e sopralluoghi GSE con possibile revoca.
    esempi:
      - profilo: ristorazione_ricettivo
        interesse: alto
        esempio: >-
          Hotel di 40 camere (piccola impresa) che sostituisce la caldaia a gas con pompe di calore da 120 kW
          e aggiunge il solare termico per l'acqua calda: spesa 180.000 euro. Sul Titolo III una piccola impresa
          arriva al 65%, cioe' fino a circa 117.000 euro, ma il valore reale dipende dai costi massimi unitari
          (euro/kW, euro/m2) e puo' essere piu' basso. Richiesta preliminare al GSE prima di firmare l'ordine;
          sopra i 15.000 euro il pagamento e' in rate annuali (quante, per questa taglia: da verificare).
      - profilo: manifattura
        interesse: alto
        esempio: >-
          Capannone di 5.000 m2 al Nord, media impresa: copertura isolata e LED per 450.000 euro (Titolo II,
          multi-intervento: 30% + 10 punti media impresa = 40%, cioe' 180.000 euro; 55% se la prestazione
          energetica migliora di almeno il 40%) e pompe di calore per 150.000 euro (Titolo III, media impresa 55%:
          82.500 euro). In tutto circa 262.500 euro su 600.000, entro i costi massimi unitari. Sulle stesse spese
          niente iperammortamento ne' Ecobonus: bisogna scegliere.
      - profilo: logistica
        interesse: alto
        esempio: >-
          Sei magazzini da 3.000 m2, media impresa: LED in tutti per circa 40.000 euro a sede, 240.000 in tutto.
          Intervento singolo di efficienza (Titolo II): 25% + 10 punti media impresa = 35%, circa 84.000 euro,
          con una pratica per ogni edificio. I magazzini devono essere in una categoria catastale ammessa
          (gruppo D escluso D/9: da verificare sede per sede) e risparmiare almeno il 10%; dove non sono
          riscaldati non ci sono interventi termici da fare.
      - profilo: artigiano
        interesse: alto
        esempio: >-
          Laboratorio di 400 m2 (categoria C/3, micro impresa) che sostituisce la caldaia a gas con una pompa
          di calore da 40 kW (30.000 euro) e isola la copertura (40.000 euro). Pompa di calore al 65% (Titolo III,
          piccola) = 19.500 euro; copertura in multi-intervento al 50% (30% + 20 punti piccola) = 20.000 euro:
          circa 39.500 euro su 70.000, entro i costi massimi unitari. Richiesta preliminare prima dell'ordine.
      - profilo: agricola
        interesse: alto
        esempio: >-
          Azienda con serre (piccola impresa) che installa un generatore a biomassa da 200 kW per scaldarle:
          spesa 120.000 euro. Il Titolo III ammette la biomassa anche per serre e calore di processo: 65% per una
          piccola impresa, fino a circa 78.000 euro entro i costi massimi unitari. Eventuali regole diverse per
          gli aiuti al settore agricolo: da verificare con il GSE.
      - profilo: negozio
        interesse: medio
        esempio: >-
          Negozio di 150 m2 (categoria C/1, micro impresa) che passa a una pompa di calore da 12 kW (12.000 euro)
          e ai LED (6.000 euro). Pompa di calore al 65% = 7.800 euro; LED al 50% (multi-intervento) = 3.000 euro:
          circa 10.800 euro, in una sola rata perche' sotto i 15.000. Per il multi-intervento serve un risparmio
          del 20%; se il locale e' in affitto serve la disponibilita' dell'edificio (assenso del proprietario: da verificare).
      - profilo: ufficio_servizi
        interesse: medio
        esempio: >-
          Ufficio di 250 m2 (categoria A/10, piccola impresa) che sostituisce la caldaia con una pompa di calore
          da 20 kW (18.000 euro) e cambia l'illuminazione (7.000 euro). Pompa al 65% = 11.700 euro, LED al 50% =
          3.500 euro: circa 15.200 euro su 25.000. Cifre modeste perche' i consumi sono bassi: conviene soprattutto
          se l'impianto e' da cambiare comunque.
      - profilo: startup
        interesse: basso
        esempio: >-
          In coworking non c'e' un edificio a disposizione: niente Conto Termico. Con un ufficio in affitto si puo'
          al massimo cambiare la climatizzazione (pompa di calore da 8 kW, 6.000 euro: 65% = 3.900 euro), con
          l'assenso del proprietario. Beneficio piccolo rispetto alle pratiche.
    fonte_verificata_il: "2026-10-05"

  - id: iperammortamento_2026
    nome: "Iperammortamento 2026 (Nuovo Piano Transizione 5.0)"
    aggiunta_il: 2026-10-05
    tipo: maggiorazione_ammortamento
    ente: "MIMIT e MEF, procedura gestita dal GSE; recupero eventuale tramite Agenzia delle Entrate"
    norma: >-
      Legge 30 dicembre 2025 n. 199 (Legge di bilancio 2026), art. 1, commi 427-436, allegati IV e V;
      DL 27 marzo 2026 n. 38, art. 7 (eliminato il vincolo di beni prodotti in UE/SEE);
      DM MIMIT-MEF 7 maggio 2026 (modalita' attuative); DD MIMIT 10 giugno 2026 (termini e modelli).
    url_ufficiale: "https://www.mimit.gov.it/it/incentivi/nuovo-piano-transizione-5-0-iperammortamento"
    in_vigore_dal: "2026-01-01"
    in_vigore_fino_al: "2028-09-30"
    stato: aperto
    sintesi: >-
      Chi compra beni strumentali nuovi 4.0 (macchinari interconnessi, software, sistemi digitali)
      o impianti per produrre energia rinnovabile per autoconsumo puo' dedurre dalle tasse un costo
      piu' alto di quello pagato: +180% fino a 2,5 milioni di investimenti l'anno, +100% fino a 10
      milioni, +50% fino a 20 milioni. Per una societa' in utile vale circa il 43% della spesa,
      recuperato negli anni di ammortamento. Servono comunicazioni al GSE, perizia e certificazione.
    a_chi_si_rivolge: >-
      Tutte le imprese residenti e le stabili organizzazioni in Italia, di ogni forma, settore e
      dimensione, che determinano il reddito d'impresa. Esclusi (fonti secondarie concordi, da
      verificare sul testo di legge): imprese in liquidazione o procedure concorsuali, imprese con
      sanzioni interdittive D.Lgs. 231/2001, lavoratori autonomi, forfettari, imprese agricole a
      reddito catastale. Condizione: rispetto delle norme sulla sicurezza sul lavoro e regolarita' contributiva.
    soggetti_ammessi: [impresa]
    dimensioni_ammesse: []
    settori_esclusi: >-
      Nessun settore escluso in quanto tale. Esclusi i soggetti indicati sopra. Il beneficio serve
      solo a chi ha reddito d'impresa tassabile (in perdita il beneficio si sposta negli anni o si perde).
    investimenti_ammessi: >-
      a) Beni materiali e immateriali nuovi elencati negli allegati IV e V alla L. 199/2025 (sostituiscono
      gli ex allegati A e B dell'Industria 4.0), destinati a strutture produttive in Italia e interconnessi
      al sistema aziendale di gestione della produzione o alla rete di fornitura. Dal DL 38/2026 non serve
      piu' che siano prodotti in UE/SEE.
      b) Beni per autoproduzione di energia rinnovabile destinata all'autoconsumo: gruppi di generazione
      elettrica, trasformatori e misuratori, impianti termici per calore di processo elettrificato,
      servizi ausiliari, accumuli; producibilita' massima 105% del fabbisogno della struttura produttiva;
      costi massimi in euro/kW (allegato 1 al DM); per il fotovoltaico solo moduli iscritti al registro
      ENEA (lettere b e c, cioe' prodotti in UE).
      Nessun requisito di riduzione dei consumi energetici (a differenza della vecchia Transizione 5.0).
    categorie_spesa: [macchinari_attrezzature, software_digitale, energia_efficienza]
    intensita: >-
      Maggiorazione del costo di acquisto (solo ai fini delle imposte sui redditi, deduzione
      extracontabile di quote di ammortamento e canoni di leasing), per scaglioni di investimenti
      completati in ciascun anno: 180% fino a 2,5 milioni; 100% oltre 2,5 e fino a 10 milioni;
      50% oltre 10 e fino a 20 milioni; oltre 20 milioni nessuna maggiorazione.
      Base di calcolo al netto di altre sovvenzioni o contributi ricevuti per gli stessi costi.
      Non e' un credito d'imposta: non si compensa in F24.
    beneficio_stimato:
      percentuale_min: 12
      percentuale_max: 43.2
      nota: >-
        Risparmio = maggiorazione x aliquota IRES 24%. Primo scaglione: 180% x 24% = 43,2% della spesa;
        secondo: 100% x 24% = 24%; terzo: 50% x 24% = 12%. Solo per un'impresa in utile e capiente,
        distribuito sugli anni di ammortamento (o del leasing), quindi il valore attuale e' un po' piu'
        basso. Per ditte individuali e societa' di persone conta l'aliquota IRPEF marginale (puo' essere
        piu' alta, fino al 43% piu' addizionali). Non riduce l'IRAP (da verificare). Se c'e' un contributo
        a fondo perduto sullo stesso bene, la base si riduce (vedi ricerca).
    come_si_ottiene: >-
      Tutto sulla piattaforma GSE (Area Clienti, SPID/CIE), per ogni struttura produttiva:
      1) comunicazione preventiva (piattaforma aperta dal 12/06/2026) con beni, importi, data prevista
      di interconnessione o entrata in funzione;
      2) entro 60 giorni dall'esito positivo del GSE, comunicazione di conferma con pagamento di acconti
      almeno pari al 20% del costo di ogni bene e dati delle fatture (piattaforma dal 21/07/2026;
      per il leasing basta contratto e ordine del concedente);
      3) a investimento completato e interconnesso, e comunque entro il 15/11/2028, comunicazione di
      completamento con attestazione di possesso di perizia e certificazione contabile;
      4) ogni anno, fino a fine fruizione: comunicazione entro il 20 gennaio (investimenti e previsione
      di utilizzo) ed entro il 30 giugno (piano di ammortamento).
      Il GSE risponde entro 10 giorni; integrazioni entro 10 giorni.
    tempi: >-
      La maggiorazione si usa dal periodo d'imposta in cui si invia la comunicazione di completamento,
      se il bene e' entrato in funzione nello stesso periodo e dopo l'esito positivo del GSE; poi
      in dichiarazione dei redditi anno per anno, lungo tutta la durata dell'ammortamento (di solito
      5-10 anni secondo i coefficienti) o del leasing.
    cumulabilita:
      con_fondo_perduto: si
      regola: >-
        Cumulabile con altre agevolazioni nazionali ed europee sugli stessi costi (anche credito ZES
        unica, Nuova Sabatini, bandi regionali FESR, de minimis), a condizione che il sostegno non copra
        le medesime quote di costo e che il totale non superi il costo sostenuto; la base della
        maggiorazione si calcola al netto dei contributi a qualunque titolo ricevuti per gli stessi costi.
        Essendo una misura fiscale generale non e' un aiuto di Stato e non consuma i massimali GBER
        (secondo i commentatori; da verificare in eventuali chiarimenti dell'Agenzia).
        NON cumulabile con il credito d'imposta beni strumentali 4.0/Transizione 5.0 sugli stessi beni
        e, secondo il GSE, con il Conto Termico 3.0 sulle stesse spese.
        Dubbio aperto: se il contributo Sabatini vada sottratto dalla base (prudenza: sottrarlo).
      riferimento: "L. 199/2025 art. 1 comma 431 (come modificato); DM CT 7/8/2025 art. 17"
    attenzione: >-
      Perizia tecnica asseverata (ingegnere o perito industriale iscritto, o ente di certificazione
      accreditato; agronomo per l'agricolo) per ogni bene, senza soglie minime: deve provare
      caratteristiche da allegato IV/V e interconnessione. Certificazione contabile di un revisore
      legale. Interconnessione entro il completamento: senza, niente beneficio. Termini delle
      comunicazioni perentori (mancato invio = beneficio perso). Decadenza se il bene viene venduto o
      spostato all'estero durante la fruizione senza sostituirlo con un bene nuovo analogo, per
      documenti mancanti o dichiarazioni false; controlli GSE nei termini dell'accertamento fiscale,
      recupero con interessi e sanzioni. Beni nuovi, niente usato. Copertura finanziaria e eventuali
      tetti di spesa complessivi: da verificare.
    esempi:
      - profilo: manifattura
        interesse: alto
        esempio: >-
          Linea di produzione interconnessa da 1.200.000 euro piu' fotovoltaico in autoconsumo da 400 kW per
          500.000 euro: 1.700.000 euro, tutto nel primo scaglione (fino a 2,5 milioni, +180%). Maggiorazione
          3.060.000 euro, cioe' circa 734.400 euro di IRES in meno (43,2%), distribuiti sugli anni di ammortamento.
          Comunicazioni al GSE, acconto del 20% entro 60 giorni dall'esito, perizia e certificazione contabile;
          sulle stesse spese niente Conto Termico.
      - profilo: logistica
        interesse: alto
        esempio: >-
          Magazzino automatico con scaffalature robotizzate e software di gestione interconnesso per 800.000 euro
          (presenza negli allegati IV/V da verificare con il perito): circa 345.600 euro di IRES in meno in piu'
          anni. Il fotovoltaico sui tetti dei magazzini e' ammesso per l'autoconsumo entro il 105% del fabbisogno
          di ciascuna struttura, con comunicazioni separate per ogni struttura produttiva. Camion e furgoni non
          sono beni 4.0 (eventuali casi particolari da verificare).
      - profilo: artigiano
        interesse: alto
        esempio: >-
          Centro di lavoro a controllo numerico interconnesso da 150.000 euro. Se il laboratorio e' una srl in
          utile: maggiorazione 270.000 euro, circa 64.800 euro di IRES in meno negli anni. Se e' una ditta
          individuale o una snc conta l'aliquota IRPEF del titolare (con redditi alti il risparmio puo' superare
          il 43%). Perizia e certificazione hanno un costo quasi fisso, che pesa di piu' sugli investimenti piccoli.
      - profilo: ristorazione_ricettivo
        interesse: medio
        esempio: >-
          Hotel (srl in utile) che installa 50 kW di fotovoltaico in autoconsumo per 60.000 euro: circa 25.900 euro
          di IRES in meno in piu' anni, se l'impianto non supera il 105% del fabbisogno. Le attrezzature da cucina
          contano solo se sono negli allegati IV/V e interconnesse: da verificare con il perito. Se il fotovoltaico
          va nel Conto Termico insieme a una pompa di calore, sulle stesse spese bisogna scegliere.
      - profilo: agricola
        interesse: medio
        esempio: >-
          Trattore con guida satellitare e raccolta dati interconnessa da 150.000 euro: per una societa' agricola
          che tassa a bilancio, circa 64.800 euro di imposte in meno (43,2%) negli anni. Le imprese agricole a
          reddito catastale sono escluse (da verificare sul testo di legge): per molte aziende agricole il
          beneficio e' zero. La perizia la puo' firmare un agronomo.
      - profilo: negozio
        interesse: basso
        esempio: >-
          Un negozio compra raramente beni 4.0. L'uso tipico e' il fotovoltaico in autoconsumo, se c'e' un tetto
          disponibile: 20 kW per 25.000 euro, circa 10.800 euro di IRES in meno per una srl in utile. Perizia,
          certificazione e quattro comunicazioni al GSE riducono parecchio il vantaggio netto.
      - profilo: ufficio_servizi
        interesse: basso
        esempio: >-
          Computer e programmi da ufficio comuni non rientrano: servono beni degli allegati IV/V interconnessi.
          Un software gestionale specialistico da 20.000 euro (se e' nell'allegato V: da verificare) darebbe circa
          8.640 euro di IRES in meno negli anni, a fronte dei costi di perizia e certificazione. Gli studi
          professionali senza reddito d'impresa sono esclusi.
      - profilo: startup
        interesse: basso
        esempio: >-
          Server e software 4.0 per 50.000 euro varrebbero circa 21.600 euro di imposte in meno, ma solo quando
          l'impresa avra' utili tassabili: in perdita il beneficio si sposta negli anni (riporto delle perdite: da
          verificare) o si perde. Per una startup in perdita conta di piu' il credito ricerca e sviluppo, che si usa in F24.
    fonte_verificata_il: "2026-10-05"

  - id: credito_rs_2026
    nome: "Credito d'imposta ricerca e sviluppo"
    aggiunta_il: 2026-10-05
    tipo: credito_imposta
    ente: "MIMIT (comunicazioni, certificazione) e Agenzia delle Entrate (utilizzo e controlli)"
    norma: >-
      Legge 27 dicembre 2019 n. 160, art. 1, commi 198-209, e modifiche; DM 26 maggio 2020;
      DL 29 marzo 2024 n. 39, art. 6 (comunicazioni preventive e consuntive).
    url_ufficiale: "https://www.mimit.gov.it/it/incentivi/credito-d-imposta-r-s"
    in_vigore_dal: "2023-01-01"
    in_vigore_fino_al: "2031-12-31"
    stato: aperto
    sintesi: >-
      Le imprese che fanno ricerca e sviluppo (ricerca fondamentale, industriale, sviluppo
      sperimentale) recuperano il 10% delle spese ammissibili (personale, consulenze e contratti di
      ricerca, quote di ammortamento di strumenti, materiali) come credito da usare in F24 per pagare
      tasse e contributi. Massimo 5 milioni l'anno. Non vale per l'acquisto di macchinari di produzione.
    a_chi_si_rivolge: >-
      Tutte le imprese residenti in Italia, a prescindere da forma, settore e dimensione, che svolgono
      attivita' di R&S ammissibili secondo il Manuale di Frascati e il DM 26/5/2020. Escluse le imprese
      in liquidazione o procedure concorsuali e quelle con sanzioni interdittive (da verificare
      l'elenco completo sul testo di legge).
    soggetti_ammessi: [impresa]
    dimensioni_ammesse: []
    settori_esclusi: "Nessun settore escluso in quanto tale (da verificare)."
    investimenti_ammessi: >-
      Spese per attivita' di ricerca fondamentale, ricerca industriale e sviluppo sperimentale:
      personale, quote di ammortamento di beni materiali e software usati nel progetto, contratti di
      ricerca extra-muros, servizi di consulenza, materiali e forniture, privative industriali (con
      limiti percentuali fissati dalla norma, da verificare caso per caso).
    categorie_spesa: [ricerca_sviluppo]
    intensita: >-
      10% della base di calcolo, massimo 5 milioni di euro per periodo d'imposta, per i periodi dal
      2023 al 2031. Base al netto di altre sovvenzioni o contributi ricevuti per le stesse spese.
      Nel 2026 aliquota unica 10% in tutta Italia: le maggiorazioni per il Mezzogiorno e le aree sisma
      (art. 244 DL 34/2020: 25% grandi, 35% medie, 45% piccole) valevano fino al 2025 e non risultano
      prorogate dalla L. 199/2025 (pagina MIMIT senza maggiorazioni per il 2026, fonti secondarie concordi;
      testo della legge non letto per intero).
    beneficio_stimato:
      percentuale_min: 10
      percentuale_max: 10
      nota: >-
        10% delle spese di R&S ammissibili (non dell'intero investimento). Credito d'imposta: vale
        anche se l'impresa e' in perdita, perche' si compensa con contributi e ritenute in F24.
    come_si_ottiene: >-
      1) Comunicazione preventiva al MIMIT (art. 6 DL 39/2024) sulla piattaforma dedicata, prima
      dell'utilizzo; 2) comunicazione consuntiva a fine periodo; 3) certificazione contabile delle
      spese da revisore legale; 4) relazione tecnica sul progetto; facoltativa la certificazione
      tecnica di un certificatore iscritto all'albo MIMIT (protegge da contestazioni sulla
      qualificazione); 5) indicazione in dichiarazione e utilizzo in F24 dal periodo successivo
      (tre quote annuali, da verificare la regola vigente).
    tempi: >-
      Il credito si usa in compensazione dal periodo d'imposta successivo a quello delle spese, dopo
      la certificazione contabile e le comunicazioni al MIMIT (ripartizione in quote annuali: da verificare).
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Base di calcolo al netto delle sovvenzioni ricevute per le stesse spese; cumulabile con altre
        agevolazioni sugli stessi costi se il totale (anche considerando la non tassazione del
        credito) non supera il costo sostenuto. Il riferimento puntuale al comma della L. 160/2019
        e' da verificare. Sui beni strumentali non si sovrappone all'iperammortamento (costi diversi).
      riferimento: "L. 160/2019 art. 1 commi 198-209"
    attenzione: >-
      Rischio principale: contestazione della natura di R&S da parte dell'Agenzia (recupero con
      interessi e sanzioni); conviene la certificazione tecnica. Comunicazioni al MIMIT obbligatorie
      dal 2024: senza, il credito non si usa. Documentazione di progetto, timesheet del personale,
      certificazione contabile. Questa voce copre solo la R&S. Il credito innovazione tecnologica
      (anche 4.0 e green) era al 5% nel 2024-2025 e non e' stato prorogato per il 2026. Il credito
      design e ideazione estetica per il 2026 esiste (L. 199/2025 art. 1 commi 925-926: 10%, max 2
      milioni per impresa, utilizzo in una sola quota annuale, tetto complessivo 60 milioni con
      prenotazione sulla piattaforma MIMIT dal 07/07/2026), ma i 60 milioni sono finiti in 24 ore
      (comunicazione MIMIT dell'08/07/2026): le nuove prenotazioni restano in coda solo per un eventuale
      scorrimento se arrivano altri fondi. Per questo non e' una voce separata "aperta".
    esempi:
      - profilo: startup
        interesse: alto
        esempio: >-
          Cinque sviluppatori che lavorano a un software con una vera incertezza tecnologica (non la semplice
          personalizzazione): 250.000 euro di costo del personale in un anno. Credito del 10% = 25.000 euro,
          da usare in F24 per pagare contributi e ritenute anche se l'impresa e' in perdita. Servono comunicazioni
          al MIMIT, certificazione contabile, relazione tecnica e timesheet; la certificazione tecnica facoltativa
          protegge dalle contestazioni.
      - profilo: manifattura
        interesse: medio
        esempio: >-
          Ufficio tecnico con tre ingegneri dedicati per meta' del tempo a un prodotto nuovo (120.000 euro) piu'
          materiali per i prototipi (30.000 euro): 150.000 euro di spese, credito di 15.000 euro in F24. Non valgono
          i macchinari della produzione ne' le normali migliorie di processo. La base va calcolata al netto di
          eventuali contributi dei bandi sulle stesse spese.
      - profilo: artigiano
        interesse: basso
        esempio: >-
          Solo se sviluppa davvero un prodotto nuovo con incertezza tecnica, per esempio un prototipo con un
          laboratorio universitario per 40.000 euro: credito di 4.000 euro. Relazione tecnica e certificazione
          contabile costano, e sui progetti piccoli il rischio di contestazione pesa: da valutare caso per caso.
      - profilo: logistica
        interesse: basso
        esempio: >-
          Sviluppare con un'universita' un algoritmo nuovo di ottimizzazione dei percorsi (contratto di ricerca da
          80.000 euro) vale 8.000 euro di credito. Comprare o configurare un software di mercato non e' ricerca e sviluppo.
      - profilo: agricola
        interesse: basso
        esempio: >-
          Sperimentazione con un'universita' su nuove varieta' o tecniche di trasformazione (50.000 euro): credito
          di 5.000 euro. L'acquisto di macchine e impianti non conta. Accesso per le imprese agricole a reddito
          catastale: da verificare.
      - profilo: ufficio_servizi
        interesse: basso
        esempio: >-
          Uno studio o un'agenzia di servizi fa raramente ricerca e sviluppo nel senso della norma (nuove
          conoscenze, incertezza tecnica). Se sviluppa una piattaforma propria davvero nuova con due persone dedicate
          (60.000 euro), il credito e' di 6.000 euro, da confrontare con il costo di certificazione e relazione.
      - profilo: negozio
        interesse: nullo
        esempio: >-
          Un negozio non fa ricerca e sviluppo nel senso della norma: allestimenti, gestionali e siti web non contano.
      - profilo: ristorazione_ricettivo
        interesse: nullo
        esempio: >-
          Un bar, un ristorante o un hotel di norma non fa ricerca e sviluppo ammissibile: nuovi menu,
          ristrutturazioni e software di prenotazione non contano.
    fonte_verificata_il: "2026-10-05"

  - id: credito_zes_unica_2026
    nome: "Credito d'imposta ZES unica (investimenti nel Mezzogiorno e in Marche, Umbria, Abruzzo)"
    aggiunta_il: 2026-10-05
    tipo: credito_imposta
    ente: "Agenzia delle Entrate (comunicazioni e utilizzo); Struttura di missione ZES"
    norma: >-
      Legge 30 dicembre 2025 n. 199, art. 1, commi 438-443 (anni 2026-2028); disciplina di base
      art. 16 DL 124/2023; Provvedimento Agenzia delle Entrate 30 gennaio 2026 (modelli).
    url_ufficiale: "https://www.agenziaentrate.gov.it/portale/credito-d-imposta-per-investimenti-nella-zes-unica-zes-2026-/che-cos-"
    in_vigore_dal: "2026-01-01"
    in_vigore_fino_al: "2028-12-31"
    stato: aperto
    sintesi: >-
      Le imprese che investono almeno 200.000 euro in macchinari, impianti, attrezzature e immobili
      strumentali in una struttura produttiva in Basilicata, Calabria, Campania, Molise, Puglia,
      Sardegna, Sicilia, Abruzzo, Marche o Umbria ricevono un credito d'imposta pari all'intensita'
      degli aiuti a finalita' regionale della zona (fino al 60% per una piccola impresa nelle regioni
      meno sviluppate), ridotto in proporzione se le richieste superano le risorse.
      Si chiede ogni anno in una finestra precisa.
    a_chi_si_rivolge: >-
      Imprese di ogni dimensione, gia' operative o che si insediano nella ZES unica, con
      struttura produttiva nelle regioni indicate.
    soggetti_ammessi: [impresa]
    dimensioni_ammesse: []
    settori_esclusi: >-
      Esclusi per la disciplina ZES (da verificare l'elenco aggiornato): siderurgia, carbone e lignite,
      trasporti e relative infrastrutture, produzione/trasporto/distribuzione di energia e relative
      infrastrutture, banda larga, settori creditizio, finanziario e assicurativo; regole specifiche
      per agricoltura, pesca e acquacoltura (modelli e percentuali separati). Escluse imprese in difficolta'.
    investimenti_ammessi: >-
      Acquisto (anche in leasing) di macchinari, impianti e attrezzature nuovi destinati a strutture
      produttive nella ZES; acquisto di terreni e acquisizione, realizzazione o ampliamento di immobili
      strumentali (con limiti percentuali sul progetto, da verificare). Progetto da almeno 200.000 euro,
      massimo 100 milioni per progetto (2026). Spese dal 1/1/2026 al 31/12/2026 per il credito 2026.
    # Regioni della ZES unica: la misura compare solo per bandi e imprese di queste regioni.
    regioni: [ABR, BAS, CAL, CAM, MAR, MOL, PUG, SAR, SIC, UMB]
    categorie_spesa: [macchinari_attrezzature, opere_edili_impianti, software_digitale]
    intensita: >-
      Intensita' massime della Carta degli aiuti a finalita' regionale 2022-2027 per la zona del comune
      (maggiorate per piccole e medie imprese), nel rispetto del Reg. UE 651/2014 (GBER). Il credito
      effettivo e' poi ridotto da una percentuale di riparto fissata dall'Agenzia in base alle risorse
      (2,3 miliardi per il 2026): per il 2025 il credito fruibile e' stato il 60,3811% del richiesto,
      portato al 75% con il contributo aggiuntivo della Legge di bilancio 2026. Percentuale 2026 da verificare.
      Valori per regione e per comune da verificare sulla Carta.
    beneficio_stimato:
      percentuale_min: 5
      percentuale_max: 60
      nota: >-
        Beneficio = intensita' della zona x percentuale di riparto. Massimo teorico 60% (piccola impresa
        in zona 107.3.a) prima del riparto; con un riparto del 75% come nel 2025 diventa 45%. Nelle aree
        107.3.c (parti di Abruzzo, Marche, Umbria) l'intensita' e' molto piu' bassa. Credito d'imposta da
        usare in F24: vale anche per imprese in perdita.
    come_si_ottiene: >-
      1) Comunicazione preventiva all'Agenzia delle Entrate con il software gratuito, nella finestra
      annuale (per il 2026: dal 31/03/2026 al 30/05/2026, gia' chiusa) con spese gia' sostenute e previste;
      2) comunicazione integrativa a investimento realizzato (per il 2026: dal 03/01/2027 al 17/01/2027),
      a pena di decadenza, con certificazione delle spese da revisore legale;
      3) utilizzo in compensazione in F24 dopo il provvedimento con la percentuale di riparto.
    tempi: >-
      Il credito diventa utilizzabile dopo la comunicazione integrativa e il provvedimento dell'Agenzia
      sulla percentuale (indicativamente nel corso dell'anno successivo all'investimento, da verificare).
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        E' un aiuto di Stato a finalita' regionale: cumulabile con aiuti de minimis e altri aiuti di Stato
        sugli stessi costi solo se il totale non supera l'intensita' massima della Carta degli aiuti
        regionali per quella zona e impresa; cumulabile con misure che non sono aiuti di Stato (es.
        iperammortamento, che pero' si calcola sulla base netta). Un bando regionale al 40% su un bene
        in zona con intensita' massima 40-60% lascia poco o nessuno spazio al credito ZES sugli stessi costi.
      riferimento: "L. 199/2025 commi 438-443; Reg. UE 651/2014 art. 14 e art. 8"
    attenzione: >-
      Finestra di comunicazione annuale stretta: chi ha perso quella del 2026 deve aspettare il 2027
      (date da verificare). Il credito reale dipende dal riparto (incertezza fino al provvedimento).
      Vincolo di mantenimento dell'attivita' nella zona per almeno 5 anni dopo il completamento (pena
      revoca, da verificare il dettaglio). Investimento iniziale (nuovo stabilimento, ampliamento,
      diversificazione), non semplice sostituzione. Certificazione contabile obbligatoria.
    esempi:
      - profilo: manifattura
        interesse: alto
        esempio: >-
          Solo se lo stabilimento e' in una regione ZES. Esempio in Puglia: nuovo reparto con macchinari per
          2.000.000 di euro, media impresa. Intensita' per una media impresa circa 50% (40% di base + 10 punti;
          valore della Carta da verificare per il comune), ridotta dal riparto (75% nel 2025): circa 750.000 euro
          di credito in F24. Serve un investimento iniziale (ampliamento o nuova produzione), mantenimento per
          5 anni e la comunicazione nella finestra annuale (quella del 2026 e' chiusa).
      - profilo: ristorazione_ricettivo
        interesse: medio
        esempio: >-
          Hotel in Sicilia (piccola impresa) che amplia la struttura con nuove camere e attrezzature per 600.000 euro:
          intensita' fino al 60%, circa 45% dopo un riparto come quello del 2025, cioe' circa 270.000 euro (limiti
          sulla parte immobiliare: da verificare). Solo nelle regioni ZES, con un progetto da almeno 200.000 euro e
          nella finestra di comunicazione annuale (2027: date da verificare).
      - profilo: artigiano
        interesse: medio
        esempio: >-
          Laboratorio in Campania (micro impresa) che acquista un capannone e nuove macchine per 250.000 euro:
          intensita' fino al 60%, circa 112.500 euro con un riparto del 75% (percentuale del 2026 da verificare).
          Sotto i 200.000 euro di progetto non si accede: per molti artigiani la soglia e' il vero ostacolo.
      - profilo: agricola
        interesse: medio
        esempio: >-
          Cantina o frantoio in Puglia che installa una nuova linea di imbottigliamento da 400.000 euro: con
          l'intensita' massima di una piccola impresa (60%) e un riparto del 75% il credito sarebbe circa
          180.000 euro. Per agricoltura e trasformazione dei prodotti agricoli ci sono modelli e percentuali
          separati: da verificare prima di contarci.
      - profilo: negozio
        interesse: basso
        esempio: >-
          Un negozio arriva raramente a 200.000 euro di investimento in beni strumentali, e rifare gli arredi non e'
          un investimento iniziale. Possibile per l'apertura di un nuovo punto vendita importante in una regione ZES
          (ammissibilita' del commercio: da verificare).
      - profilo: ufficio_servizi
        interesse: basso
        esempio: >-
          Un ufficio di servizi difficilmente arriva a 200.000 euro di macchinari e impianti. Caso possibile: acquisto
          e allestimento di una nuova sede in una regione ZES, ma la parte immobiliare ha limiti percentuali (da verificare).
      - profilo: logistica
        interesse: basso
        esempio: >-
          Trasporti e relative infrastrutture sono esclusi: un'impresa di autotrasporto non accede. Per il solo
          magazzinaggio e la logistica conto terzi l'esclusione e' da verificare sul codice ATECO. Un'impresa di un
          altro settore che costruisce un proprio magazzino al Sud invece puo' accedere.
      - profilo: startup
        interesse: basso
        esempio: >-
          Pochi beni materiali e quasi mai 200.000 euro di macchinari e impianti: di solito la ZES non serve. Il credito
          pero' si usa in F24 anche in perdita, quindi una startup del Sud che attrezza un laboratorio o una produzione
          sopra la soglia dovrebbe considerarlo.
    fonte_verificata_il: "2026-10-05"

  - id: nuova_sabatini
    nome: "Nuova Sabatini (beni strumentali PMI)"
    aggiunta_il: 2026-10-05
    tipo: contributo_conto_interessi
    ente: "MIMIT, tramite banche e intermediari convenzionati (CDP-ABI)"
    norma: >-
      Art. 2 DL 21 giugno 2013 n. 69 e successivi rifinanziamenti (Legge di bilancio 2026: 650 milioni,
      200 per il 2026 e 450 per il 2027); DI 19 gennaio 2024 n. 43 (variante Capitalizzazione).
    url_ufficiale: "https://www.mimit.gov.it/it/incentivi/agevolazioni-per-gli-investimenti-delle-pmi-in-beni-strumentali-nuova-sabatini"
    in_vigore_dal: "2014-03-31"
    in_vigore_fino_al: null
    stato: aperto
    sintesi: >-
      Le PMI che comprano (o prendono in leasing) macchinari, impianti, attrezzature, hardware e
      software nuovi con un finanziamento bancario da 20.000 euro a 4 milioni ricevono dal Ministero
      un contributo pari agli interessi di un finanziamento di 5 anni al 2,75% (3,575% se il bene e'
      4.0 o green; 5% per micro e piccole che si capitalizzano). In pratica circa il 7,7-14% del
      finanziamento. Sportello aperto fino a esaurimento risorse.
    a_chi_si_rivolge: >-
      Micro, piccole e medie imprese con sede o unita' locale in Italia, regolarmente costituite, non in
      liquidazione o procedure concorsuali e non in difficolta'. Variante Capitalizzazione: PMI in
      forma societaria con aumento di capitale.
    soggetti_ammessi: [impresa]
    dimensioni_ammesse: [micro, piccola, media]
    settori_esclusi: "Attivita' finanziarie e assicurative (secondo la classificazione ATECO 2025 indicata dal MIMIT). Ammessi agricoltura e pesca."
    investimenti_ammessi: >-
      Acquisto o leasing di macchinari, attrezzature, impianti, beni strumentali ad uso produttivo,
      hardware, software e tecnologie digitali, nuovi, con autonomia funzionale e correlati
      all'attivita'. Esclusi terreni, fabbricati, beni usati o rigenerati, immobilizzazioni in corso.
    categorie_spesa: [macchinari_attrezzature, software_digitale]
    intensita: >-
      Finanziamento bancario o leasing 20.000 - 4.000.000 euro, durata massima 5 anni (garanzia del
      Fondo PMI fino all'80% possibile). Contributo in conto impianti pari agli interessi convenzionali
      su un piano di 5 anni: 2,75% annuo ordinario; 3,575% per investimenti 4.0 e green; Capitalizzazione
      5% micro e piccole, 3,575% medie. Aiuto in esenzione (GBER), non de minimis.
    beneficio_stimato:
      percentuale_min: 7.7
      percentuale_max: 14.3
      nota: >-
        Calcolo su piano convenzionale a rate semestrali per 5 anni: al 2,75% gli interessi sono circa
        il 7,7% del finanziamento; al 3,575% circa il 10,1%; al 5% circa il 14,3%. La percentuale e' sul
        finanziamento, non sul costo totale se il bene e' finanziato solo in parte. Stima nostra con la
        formula della rata costante: da confrontare con il calcolatore MIMIT.
    come_si_ottiene: >-
      1) Domanda sulla piattaforma benistrumentali.dgiai.gov.it (SPID/CNS/CIE del legale rappresentante)
      e invio alla banca o intermediario aderente, insieme alla richiesta di finanziamento, PRIMA
      dell'investimento; 2) delibera del finanziamento e concessione del Ministero; 3) investimento
      completato entro 12 mesi dal contratto di finanziamento (da verificare); 4) richiesta di
      erogazione del contributo entro 120 giorni dal termine per completare l'investimento.
    tempi: >-
      Contributo erogato in un'unica soluzione per finanziamenti fino a 200.000 euro (dal 2022), altrimenti
      in quote annuali nell'arco di 6 anni dall'ultimazione dell'investimento.
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Cumulabile con altri aiuti di Stato sugli stessi costi se il cumulo non supera l'intensita'
        massima applicabile (FAQ MIMIT: con aiuti in esenzione vale la piu' alta delle intensita' delle
        misure cumulate; con de minimis vale il limite della Sabatini; nel GBER per le PMI di norma 10-20%,
        65% agricoltura, 50% pesca). Cumulabile con misure fiscali generali non aiuti di Stato
        (iperammortamento, a suo tempo crediti 4.0/5.0) entro il costo sostenuto. Cumulabile con il Conto
        Termico (contributo in conto interessi ammesso dall'art. 17 DM 7/8/2025).
      riferimento: "FAQ MIMIT Nuova Sabatini 9.1, 9.2, 9.7, 9.9, 9.10; Reg. UE 651/2014"
    attenzione: >-
      La domanda va fatta prima dell'investimento (ordini/fatture precedenti escludono il bene, da
      verificare il dettaglio nelle FAQ). Sportello fino a esaurimento risorse (al 14/09/2026 disponibili
      circa 1,199 miliardi Sabatini ordinaria e 77 milioni Capitalizzazione). Cumulo con un bando a fondo
      perduto sugli stessi beni spesso limitato dall'intensita' massima. Revoca se i beni vengono venduti
      o distolti entro 3 anni (da verificare). Obbligo assicurazione catastrofale (DM 18/6/2025).
    esempi:
      - profilo: manifattura
        interesse: alto
        esempio: >-
          Linea di produzione 4.0 da 1.200.000 euro in leasing a 5 anni: contributo sugli interessi al 3,575%, circa
          il 10,1% del finanziamento, cioe' circa 121.200 euro, pagato in quote annuali (sopra i 200.000 euro).
          Domanda alla banca o alla societa' di leasing prima dell'ordine. Si somma all'iperammortamento sullo
          stesso bene entro il costo sostenuto (per prudenza, base dell'iperammortamento al netto del contributo).
      - profilo: artigiano
        interesse: alto
        esempio: >-
          Centro di lavoro 4.0 da 150.000 euro in leasing: contributo circa il 10,1% del finanziamento, cioe' circa
          15.150 euro, in un'unica soluzione perche' sotto i 200.000 euro. Se il laboratorio e' una srl micro o piccola
          e fa un aumento di capitale, la variante Capitalizzazione porta il tasso al 5% (circa 14,3%: 21.450 euro).
          Domanda prima dell'acquisto.
      - profilo: agricola
        interesse: alto
        esempio: >-
          Trattore e attrezzature nuove per 120.000 euro finanziati in 5 anni: contributo circa 7,7%, cioe' 9.240 euro
          (circa 12.120 se i beni sono 4.0, al 10,1%), in un'unica soluzione. L'agricoltura e' ammessa e il limite di
          cumulo con altri aiuti e' piu' largo (65% in agricoltura). Domanda prima dell'acquisto.
      - profilo: logistica
        interesse: alto
        esempio: >-
          Carrelli elevatori elettrici, scaffalature e sistema di magazzino per 800.000 euro in leasing: se sono beni 4.0
          contributo circa 10,1%, cioe' 80.800 euro in quote annuali; si puo' fare una domanda per ogni investimento
          delle diverse sedi. Camion e furgoni per il trasporto conto terzi: ammissibilita' da verificare nelle FAQ MIMIT.
      - profilo: ristorazione_ricettivo
        interesse: medio
        esempio: >-
          Cucina professionale nuova per 120.000 euro in leasing a 5 anni: contributo circa 7,7%, cioe' 9.240 euro,
          in un'unica soluzione. Esclusi lavori murari e opere sull'immobile; arredi delle camere: da verificare.
      - profilo: negozio
        interesse: medio
        esempio: >-
          Banchi frigo, casse e attrezzature per 50.000 euro con un finanziamento di 5 anni: contributo circa 7,7%,
          cioe' circa 3.850 euro. Finanziamento minimo 20.000 euro; utile se l'attrezzatura si rinnova comunque a rate.
      - profilo: ufficio_servizi
        interesse: medio
        esempio: >-
          Computer, server e software per 40.000 euro in leasing: contributo circa 7,7%, cioe' circa 3.080 euro (circa
          4.040 se i beni sono 4.0). Pratica semplice tramite la banca; non vale per comprare o ristrutturare l'ufficio.
      - profilo: startup
        interesse: basso
        esempio: >-
          Hardware per 30.000 euro finanziati: contributo circa 2.310 euro; con un aumento di capitale (variante
          Capitalizzazione, 5%) circa 4.290 euro. Serve che una banca conceda il finanziamento, non scontato per una
          startup in perdita (aiuta la garanzia del Fondo PMI).
    fonte_verificata_il: "2026-10-05"

  - id: ecobonus_imprese_2026
    nome: "Ecobonus (detrazione per la riqualificazione energetica degli edifici)"
    aggiunta_il: 2026-10-06
    tipo: detrazione_fiscale
    ente: "Agenzia delle Entrate (detrazione in dichiarazione); ENEA (comunicazione dei dati tecnici)"
    norma: >-
      Art. 14 DL 4 giugno 2013 n. 63 (e art. 1 commi 344-347 L. 296/2006); aliquote 2025-2027 riscritte
      dalla L. 30 dicembre 2024 n. 207, art. 1 comma 55; per il 2026 confermate al 36% (50% abitazione
      principale) dalla L. 30 dicembre 2025 n. 199, art. 1 comma 22 (numero del comma da fonti secondarie);
      requisiti tecnici DM MISE 6 agosto 2020; per lavori iniziati dal 4/2/2026 anche D.Lgs. 9 gennaio 2026 n. 5
      e DM 26/10/2025 (requisiti minimi).
    url_ufficiale: "https://www.agenziaentrate.gov.it/portale/schede/agevolazioni/detrazione-riqualificazione-energetica-55-2016/cosa-riqualificazione-55-2016"
    in_vigore_dal: "2025-01-01"
    in_vigore_fino_al: "2027-12-31"
    stato: aperto
    sintesi: >-
      Chi fa lavori di risparmio energetico su un edificio esistente (cappotto, infissi, schermature,
      pompe di calore, caldaie a condensazione, solare termico, building automation) puo' togliere dalle
      tasse (IRES o IRPEF) il 36% della spesa sostenuta nel 2026, in 10 rate annuali uguali.
      Per le imprese vale su tutti gli immobili posseduti o detenuti: strumentali, beni merce o patrimonio.
      Il 50% spetta solo per l'abitazione principale delle persone fisiche. Nel 2027 scende al 30%.
      Niente piu' cessione del credito ne' sconto in fattura: serve avere imposte da pagare.
    a_chi_si_rivolge: >-
      Tutti i contribuenti IRPEF e IRES che sostengono la spesa e possiedono o detengono l'immobile:
      societa' di capitali e di persone, ditte individuali, enti commerciali, professionisti, privati.
      Per i titolari di reddito d'impresa la detrazione spetta a prescindere dalla destinazione
      dell'immobile ("strumentali", "beni merce" o "patrimoniali"), secondo l'Agenzia delle Entrate.
    soggetti_ammessi: [impresa, libero_professionista]
    dimensioni_ammesse: []
    settori_esclusi: >-
      Nessun settore escluso. Esclusi dal 2025 gli interventi di sostituzione dell'impianto di
      riscaldamento con caldaie uniche alimentate a combustibili fossili (anche a gas).
      Serve capienza d'imposta: chi e' in perdita o forfettario ne trae poco o nulla.
    investimenti_ammessi: >-
      Su edifici esistenti (accatastati o con accatastamento in corso) e dotati di impianto di
      riscaldamento. Limiti di DETRAZIONE per unita' immobiliare (DM 6/8/2020, all. B): riqualificazione
      energetica globale 100.000 euro; coibentazione di pareti, coperture e pavimenti 60.000; infissi
      60.000 (involucro + infissi insieme 60.000); schermature solari 60.000; collettori solari termici
      60.000; impianti di climatizzazione invernale (caldaie a condensazione, pompe di calore, sistemi
      ibridi, generatori a biomassa, scaldacqua a pompa di calore) 30.000 complessivi; microcogeneratori
      100.000; building automation 15.000. In piu' costi massimi unitari (euro/m2, euro/kW, all. I DM).
      Ammesse anche spese professionali (APE, asseverazione, direzione lavori).
    categorie_spesa: [energia_efficienza, opere_edili_impianti]
    intensita: >-
      Spese 2025 e 2026: 36% (50% solo se il titolare di proprieta' o diritto reale la sostiene
      sull'abitazione principale). Spese 2027: 30% (36% abitazione principale). Aliquota unica per tutti
      gli interventi (sono spariti il 65% e le maggiorazioni condominiali). Detrazione ripartita in 10 quote
      annuali di pari importo, entro i limiti di detrazione per intervento indicati sopra.
    beneficio_stimato:
      percentuale_min: 36
      percentuale_max: 36
      nota: >-
        Per un'impresa e' sempre 36% della spesa ammessa (sostenuta nel 2026), recuperato in 10 anni in
        dichiarazione: valore attuale piu' basso. Solo se l'impresa ha imposte da pagare ogni anno: la quota
        che non trova capienza si perde per l'IRPEF (per l'IRES da verificare se riportabile). Nel 2027 30%.
    come_si_ottiene: >-
      1) Tecnico abilitato: verifica dei requisiti (trasmittanze, efficienze; per lavori iniziati dal
      4/2/2026 i nuovi requisiti del D.Lgs. 5/2026), APE dove richiesto, asseverazione con computo metrico
      e congruita' delle spese. 2) Pagamenti: per le imprese non e' obbligatorio il bonifico "parlante"
      (da verificare caso per caso; per persone fisiche e professionisti si'). 3) Entro 90 giorni dalla
      fine lavori, invio della scheda descrittiva all'ENEA sul portale bonusfiscali.enea.it (sezione
      dell'anno di fine lavori). 4) Detrazione in dichiarazione dei redditi dal periodo della spesa, per 10 anni.
    tempi: >-
      Nessuna domanda preventiva e nessuna graduatoria: la detrazione spetta per legge se ci sono i
      requisiti. Il beneficio arriva in 10 quote annuali a partire dalla dichiarazione dell'anno della spesa.
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Con un contributo a fondo perduto regionale, camerale o locale sugli stessi lavori: la detrazione
        si calcola solo sulla parte di spesa rimasta a carico (spesa meno contributo), e il totale non puo'
        superare il 100% della spesa; serve che il bando non vieti il cumulo. NON si somma con il Conto
        Termico 3.0 sugli stessi interventi (il DM 7/8/2025 art. 17 esclude chi ha altri incentivi statali,
        e il GSE ci comprende le detrazioni): bisogna scegliere uno dei due (per un'impresa il Conto Termico,
        25-65% subito, rende quasi sempre di piu'). Non si somma con altre detrazioni fiscali per gli
        stessi lavori (es. bonus ristrutturazioni o sismabonus sulla stessa spesa).
      riferimento: "Prassi Agenzia Entrate e ENEA (calcolo al netto dei contributi, fonti secondarie concordi; riferimento puntuale da verificare); DM MASE 7/8/2025 art. 17"
    attenzione: >-
      Scheda ENEA entro 90 giorni dalla fine lavori. Requisiti tecnici cambiati per i lavori iniziati
      dal 4/2/2026 (D.Lgs. 5/2026: SCOP minimi per le pompe di calore, regole piu' strette per ibridi e
      biomasse; vademecum ENEA aggiornati al 23/09/2026). Cessione del credito e sconto in fattura vietati
      dal 17/2/2023 salvo casi transitori ormai residuali: la detrazione si usa solo contro le proprie
      imposte. Edificio esistente, non nuova costruzione ne' ampliamento. Controlli ENEA e Agenzia con
      recupero della detrazione. Con le caldaie solo a combustibili fossili niente detrazione.
    esempi:
      - profilo: ristorazione_ricettivo
        interesse: medio
        esempio: >-
          Hotel di proprieta' (srl in utile) che cambia gli infissi per 80.000 euro: detrazione 36% = 28.800 euro in
          10 anni (2.880 euro l'anno), entro il limite di 60.000 euro di detrazione per unita' immobiliare. Con il
          Conto Termico lo stesso lavoro varrebbe il 45% per una piccola impresa: l'Ecobonus serve quando il Conto
          Termico non e' possibile (lavori gia' partiti senza richiesta preliminare, fondi GSE esauriti). Non si sommano.
      - profilo: manifattura
        interesse: basso
        esempio: >-
          Capannone riscaldato di proprieta': isolamento della copertura per 450.000 euro. Il limite di 60.000 euro di
          detrazione per unita' immobiliare porta il beneficio a circa il 13% della spesa, in 10 anni. Il Conto Termico
          (40% o piu' per una media impresa) e' quasi sempre meglio; l'edificio deve avere un impianto di riscaldamento.
      - profilo: artigiano
        interesse: basso
        esempio: >-
          Laboratorio di proprieta': pompa di calore da 30.000 euro, detrazione 36% = 10.800 euro in 10 anni, solo con
          imposte capienti. Con il Conto Termico la stessa pompa di calore vale fino al 65%: l'Ecobonus e' un ripiego.
      - profilo: ufficio_servizi
        interesse: basso
        esempio: >-
          Ufficio di proprieta' con infissi da cambiare per 30.000 euro: detrazione 10.800 euro, 1.080 euro l'anno per
          10 anni. Rende di piu' il Conto Termico (45% per una piccola impresa); l'Ecobonus resta utile se i lavori sono
          gia' partiti senza la richiesta al GSE.
      - profilo: negozio
        interesse: basso
        esempio: >-
          Negozio con climatizzazione nuova in pompa di calore da 12.000 euro: detrazione 4.320 euro in 10 anni, con
          imposte capienti. Se il locale e' in affitto la detrazione spetta anche al conduttore che paga i lavori
          (consenso del proprietario: da verificare). Il Conto Termico al 65% rende di piu'.
      - profilo: logistica
        interesse: basso
        esempio: >-
          Molti magazzini non hanno un impianto di riscaldamento, che e' una condizione richiesta: li' niente Ecobonus.
          Si applica agli uffici delle sedi (es. infissi per 20.000 euro: 7.200 euro in 10 anni). Per l'illuminazione
          dei magazzini non c'e' Ecobonus; c'e' il Conto Termico.
      - profilo: agricola
        interesse: basso
        esempio: >-
          Con il reddito agrario catastale le imposte sono basse e la detrazione rischia di non trovare capienza. Caso
          tipico: infissi o cappotto degli uffici aziendali (30.000 euro: 10.800 euro in 10 anni). Le serre di solito
          non rientrano (edificio esistente con impianto di riscaldamento: da verificare).
      - profilo: startup
        interesse: nullo
        esempio: >-
          In perdita e quasi sempre in affitto: una detrazione in 10 anni non serve. La parte che non trova imposte da
          pagare si perde (per l'IRES riporto da verificare).
    fonte_verificata_il: "2026-10-06"

  - id: sismabonus_imprese_2026
    nome: "Sismabonus (detrazione per interventi antisismici, anche su immobili produttivi)"
    aggiunta_il: 2026-10-06
    tipo: detrazione_fiscale
    ente: "Agenzia delle Entrate"
    norma: >-
      Art. 16 commi 1-bis - 1-septies.1 DL 4 giugno 2013 n. 63; aliquote 2025-2027 dalla L. 207/2024
      art. 1 comma 55 lett. b) n. 2 (nuovo comma 1-septies.1); per il 2026 portate al 36% (50% abitazione
      principale) dalla L. 199/2025; 10 quote annuali dall'art. 4-bis comma 4 DL 39/2024.
    url_ufficiale: "https://www.agenziaentrate.gov.it/portale/aree-tematiche/casa/agevolazioni/sisma-bonus"
    in_vigore_dal: "2025-01-01"
    in_vigore_fino_al: "2027-12-31"
    stato: aperto
    sintesi: >-
      Chi fa lavori di adeguamento o miglioramento antisismico su edifici abitativi o adibiti ad
      attivita' produttive nelle zone sismiche 1, 2 e 3 puo' togliere dalle tasse (IRES o IRPEF) il 36%
      della spesa sostenuta nel 2026, fino a 96.000 euro di spesa per unita' immobiliare e per anno,
      in 10 rate annuali. Vale anche per le societa'. Nel 2027 scende al 30%.
    a_chi_si_rivolge: >-
      Contribuenti IRPEF e IRES, comprese le imprese, che possiedono o detengono edifici residenziali o
      adibiti ad attivita' produttive (agricole, professionali, produttive di beni e servizi, commerciali)
      in zona sismica 1, 2 o 3.
    soggetti_ammessi: [impresa, libero_professionista]
    dimensioni_ammesse: []
    settori_esclusi: "Nessun settore escluso. Escluse le zone sismiche 4. Serve capienza d'imposta."
    investimenti_ammessi: >-
      Interventi antisismici e di messa in sicurezza statica (art. 16-bis comma 1 lett. i TUIR) sulle parti
      strutturali, comprese le spese per classificazione e verifica sismica. Limite di spesa 96.000 euro per
      unita' immobiliare per anno (se prosecuzione di lavori iniziati prima, si contano anche le spese gia'
      detratte negli anni precedenti). Dal 2025 la percentuale e' fissa: il miglioramento di una o due
      classi di rischio non da' piu' aliquote maggiori.
    categorie_spesa: [opere_edili_impianti]
    intensita: >-
      Spese 2026: 36% (50% solo per l'abitazione principale delle persone fisiche). Spese 2027: 30% (36%).
      Massimale 96.000 euro di spesa per unita' immobiliare per anno. 10 quote annuali.
    beneficio_stimato:
      percentuale_min: 36
      percentuale_max: 36
      nota: >-
        Per un'impresa 36% della spesa fino a 96.000 euro per unita' immobiliare (massimo 34.560 euro di
        detrazione), in 10 anni e solo con imposte capienti. Oltre il massimale la spesa non da' beneficio.
    come_si_ottiene: >-
      1) Progettista: asseverazione della classe di rischio prima e dopo e dell'efficacia degli interventi
      (DM MIT 58/2017 e successive modifiche), da presentare con la richiesta del titolo edilizio
      (dettaglio da verificare sulla guida dell'Agenzia). 2) Direttore lavori e collaudatore: attestazione
      di conformita' a fine lavori. 3) Detrazione in dichiarazione per 10 anni. Nessuna domanda ad enti.
    tempi: "Nessuna domanda: beneficio in 10 quote annuali dalla dichiarazione dell'anno della spesa."
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Come l'ecobonus: con un contributo a fondo perduto (regionale o locale) la detrazione spetta solo
        sulla spesa rimasta a carico, se il bando lo consente (da verificare caso per caso). Non si somma
        con altre detrazioni per la stessa spesa (ecobonus, bonus ristrutturazioni).
      riferimento: "Art. 16 DL 63/2013; prassi Agenzia Entrate (da verificare il riferimento puntuale)"
    attenzione: >-
      Solo zone sismiche 1, 2, 3 (verificare la classificazione del comune). Asseverazione del rischio
      sismico nei tempi giusti, altrimenti la detrazione si perde. Niente cessione del credito ne' sconto
      in fattura. Massimale per unita' immobiliare: su capannoni grandi il beneficio in percentuale e'
      molto piu' basso del 36%. Verificare con il tecnico se il lavoro rientra anche in un bando regionale
      per la sicurezza sismica delle imprese.
    esempi:
      - profilo: manifattura
        interesse: medio
        esempio: >-
          Capannone prefabbricato in zona sismica 2 (es. Emilia): adeguamento dei collegamenti tra travi e pilastri e
          della copertura per 400.000 euro. Detrazione 36% solo su 96.000 euro per unita' immobiliare: massimo 34.560 euro
          in 10 anni, circa il 9% della spesa. Spesso rende di piu' un bando regionale per la sicurezza sismica, se c'e'.
      - profilo: logistica
        interesse: medio
        esempio: >-
          Tre magazzini su sei in zona sismica 2 o 3, ciascuno una unita' immobiliare: messa in sicurezza per 150.000 euro
          l'uno. Detrazione massima 34.560 euro per magazzino, 103.680 euro in tutto, in 10 anni. Le sedi in zona 4 restano
          fuori: verificare la classificazione di ogni comune.
      - profilo: ristorazione_ricettivo
        interesse: medio
        esempio: >-
          Hotel in un edificio storico in zona sismica 2: miglioramento sismico per 300.000 euro. Detrazione massima
          34.560 euro per unita' immobiliare (circa 11,5%), in 10 anni; se i lavori proseguono su piu' anni il massimale
          conta anche le spese gia' detratte. Serve l'asseverazione del rischio sismico prima dei lavori.
      - profilo: artigiano
        interesse: basso
        esempio: >-
          Laboratorio di proprieta' in zona sismica 3: rinforzo strutturale per 60.000 euro, detrazione 21.600 euro in
          10 anni con imposte capienti. Utile solo se i lavori sono comunque necessari.
      - profilo: ufficio_servizi
        interesse: basso
        esempio: >-
          Ufficio in condominio: la quota dei lavori antisismici condominiali (es. 20.000 euro) da' 7.200 euro di
          detrazione in 10 anni. Solo per chi possiede o detiene l'immobile e ha imposte da pagare.
      - profilo: negozio
        interesse: basso
        esempio: >-
          Negozio al piano terra di un edificio in zona sismica 1-3: quota dei lavori condominiali di 15.000 euro,
          detrazione di 5.400 euro in 10 anni. Niente in zona 4.
      - profilo: agricola
        interesse: basso
        esempio: >-
          Fienili, stalle o cantine in zona sismica 1-3 possono rientrare (edifici per attivita' agricole): 80.000 euro
          di rinforzo = 28.800 euro in 10 anni. Con il reddito agrario catastale il limite e' spesso la capienza d'imposta.
      - profilo: startup
        interesse: nullo
        esempio: >-
          Sede in affitto o in coworking e spesso in perdita: non ci sono lavori strutturali da fare ne' imposte da ridurre.
    fonte_verificata_il: "2026-10-06"

  - id: art_bonus
    nome: "Art Bonus (credito d'imposta per le donazioni alla cultura)"
    aggiunta_il: 2026-10-06
    tipo: credito_imposta
    ente: "Ministero della Cultura (portale artbonus.gov.it); Agenzia delle Entrate (utilizzo in F24)"
    norma: >-
      Art. 1 DL 31 maggio 2014 n. 83 (convertito dalla L. 106/2014), reso permanente dalla L. 28 dicembre
      2015 n. 208 (Legge di stabilita' 2016), con successive modifiche.
    url_ufficiale: "https://artbonus.gov.it/beneficio-fiscale.html"
    in_vigore_dal: "2014-06-01"
    in_vigore_fino_al: null
    stato: aperto
    sintesi: >-
      Chi dona denaro a musei, biblioteche, archivi, monumenti e altri beni culturali pubblici, fondazioni
      lirico-sinfoniche, teatri e altri enti dello spettacolo ammessi recupera il 65% della donazione come
      credito d'imposta, in tre quote annuali uguali. Per le imprese il credito massimo e' il 5 per mille
      dei ricavi annui; si usa in F24 (codice tributo 6842). Non e' un investimento dell'impresa: e' una
      donazione, quindi non si abbina ai bandi.
    a_chi_si_rivolge: >-
      Persone fisiche, enti non commerciali e titolari di reddito d'impresa (qualunque forma e dimensione)
      che fanno erogazioni liberali in denaro ai beneficiari ammessi.
    soggetti_ammessi: [impresa, libero_professionista, persona_fisica, ente_terzo_settore]
    dimensioni_ammesse: []
    settori_esclusi: "Nessuno."
    investimenti_ammessi: >-
      Nessun investimento: erogazioni liberali in denaro (bonifico, carta, assegno; niente contanti) per
      a) manutenzione, protezione e restauro di beni culturali pubblici; b) sostegno di istituti e luoghi
      della cultura di appartenenza pubblica, fondazioni lirico-sinfoniche, teatri di tradizione, teatri
      nazionali e di rilevante interesse culturale, festival, imprese ed enti di produzione teatrale e di
      danza, circuiti di distribuzione, complessi strumentali, societa' concertistiche e corali, circhi e
      spettacoli viaggianti (secondo le condizioni di legge); c) realizzazione di nuove strutture, restauro
      e potenziamento di quelle esistenti di enti o istituzioni pubbliche dello spettacolo. Il beneficiario
      deve essere registrato sul portale artbonus.gov.it. Enti ecclesiastici e privati: solo in casi
      particolari (FAQ del portale, da verificare caso per caso). Una proposta di legge (2026) per estenderlo a
      musei privati del Sistema museale nazionale, ETS e enti ecclesiastici non e' ancora legge.
    # Nessuna categoria di spesa: e' una donazione, non una spesa di investimento. Cosi' non compare mai
    # tra le misure "da sommare" ai bandi (cumulabili() richiede categorie in comune).
    categorie_spesa: []
    intensita: >-
      Credito d'imposta del 65% delle erogazioni. Limite: per le imprese 5 per mille dei ricavi annui; per
      persone fisiche ed enti non commerciali 15% del reddito imponibile. Ripartito in tre quote annuali di
      pari importo; la quota non usata si riporta negli anni successivi senza limiti di tempo. Il credito
      non concorre alla base IRAP.
    beneficio_stimato:
      percentuale_min: 65
      percentuale_max: 65
      nota: >-
        65% della donazione (non di un investimento), nel limite del 5 per mille dei ricavi: es. ricavi di
        2 milioni, credito massimo 10.000 euro l'anno, cioe' donazioni utili fino a circa 15.385 euro.
    come_si_ottiene: >-
      1) Scegliere un beneficiario e un progetto registrati su artbonus.gov.it. 2) Donare con mezzi
      tracciabili indicando la causale Art Bonus. 3) Conservare la ricevuta. 4) Indicare il credito in
      dichiarazione e usarlo in F24 (codice tributo 6842), un terzo all'anno, dal periodo successivo
      alla donazione (decorrenza da verificare sulle istruzioni F24).
    tempi: "Nessuna domanda: credito in tre quote annuali, a partire dall'anno dopo la donazione (da verificare)."
    cumulabilita:
      con_fondo_perduto: si
      regola: >-
        Non riguarda le spese dei bandi: e' una donazione, non tocca i costi di un progetto agevolato.
        Sulla stessa donazione non si sommano altre agevolazioni fiscali (es. deduzione come erogazione
        liberale): da verificare nelle FAQ del portale. La donazione non deve avere un ritorno per l'impresa
        (altrimenti e' una sponsorizzazione, con un trattamento fiscale diverso).
      riferimento: "Art. 1 DL 83/2014; artbonus.gov.it, pagina Benefici fiscali e FAQ"
    attenzione: >-
      Solo donazioni in denaro e tracciabili; beneficiario e intervento devono essere tra quelli ammessi
      dalla legge e pubblicati sul portale. Limite del 5 per mille dei ricavi: oltre, la parte di donazione
      non da' credito. I beneficiari devono comunicare ogni mese al Ministero le donazioni ricevute e
      pubblicarne l'uso. Utile per clienti che fanno gia' mecenatismo; non e' un incentivo agli investimenti.
    esempi:
      - profilo: manifattura
        interesse: medio
        esempio: >-
          Ricavi di 20 milioni: credito massimo 100.000 euro l'anno (5 per mille), cioe' donazioni utili fino a circa
          153.800 euro. Donando 30.000 euro al restauro di un monumento del territorio il credito e' 19.500 euro in tre
          anni: costo reale 10.500 euro. Ha senso se l'impresa fa gia' mecenatismo; non deve esserci un ritorno pubblicitario.
      - profilo: logistica
        interesse: medio
        esempio: >-
          Ricavi di 30 milioni: tetto di 150.000 euro di credito l'anno. Una donazione di 20.000 euro al teatro della
          citta' della sede principale vale 13.000 euro di credito in tre quote, da usare in F24. Non si abbina ai bandi:
          e' una scelta di legame con il territorio.
      - profilo: ristorazione_ricettivo
        interesse: basso
        esempio: >-
          Hotel con ricavi di 2 milioni: credito massimo 10.000 euro l'anno, donazioni utili fino a circa 15.400 euro.
          Es. 5.000 euro al museo cittadino: credito di 3.250 euro in tre anni. Senza ritorno pubblicitario diretto
          (altrimenti e' una sponsorizzazione).
      - profilo: ufficio_servizi
        interesse: basso
        esempio: >-
          Ricavi di 1 milione: credito massimo 5.000 euro l'anno, donazioni utili fino a circa 7.700 euro. Es. 3.000 euro
          a una biblioteca pubblica: credito di 1.950 euro in tre anni.
      - profilo: negozio
        interesse: basso
        esempio: >-
          Ricavi di 600.000 euro: credito massimo 3.000 euro l'anno, donazioni utili fino a circa 4.600 euro (es. 2.000 euro
          donati, 1.300 euro di credito in tre anni). Scelta personale, non un incentivo.
      - profilo: artigiano
        interesse: basso
        esempio: >-
          Ricavi di 500.000 euro: credito massimo 2.500 euro l'anno, donazioni utili fino a circa 3.850 euro. Utile solo
          se il titolare vuole sostenere un bene culturale del posto.
      - profilo: agricola
        interesse: basso
        esempio: >-
          Una societa' agricola con ricavi di 1,5 milioni puo' recuperare fino a 7.500 euro di credito l'anno. Per le
          imprese agricole a reddito catastale l'accesso come titolari di reddito d'impresa e' da verificare (come persona
          fisica vale il limite del 15% del reddito imponibile).
      - profilo: startup
        interesse: basso
        esempio: >-
          Con ricavi di 200.000 euro il tetto e' 1.000 euro di credito l'anno: di fatto irrilevante. Il credito si usa in
          F24 anche in perdita, ma gli importi restano piccoli.
    fonte_verificata_il: "2026-10-06"

  - id: incentivi_assunzione_2026
    nome: "Incentivi all'assunzione 2026 (Bonus Giovani, Bonus Donne, Bonus ZES)"
    aggiunta_il: 2026-10-06
    tipo: decontribuzione
    ente: "INPS (domanda e controllo delle risorse), per conto del Ministero del Lavoro"
    norma: >-
      DL 30 aprile 2026 n. 62 ("decreto Lavoro 2026"), art. 1 (Bonus Donne), art. 2 (Bonus Giovani),
      art. 3 (Bonus ZES), art. 7 (trattamento economico minimo); convertito in legge a giugno 2026
      (estremi della legge di conversione ed eventuali modifiche: da verificare). Istruzioni INPS: circolari
      n. 55 (Giovani), n. 56 (ZES) e n. 57 (Donne) del 14/05/2026; domande aperte con i messaggi n. 1966,
      1968 e 1970 dell'11/06/2026. Aiuti in esenzione: Reg. UE 651/2014 (GBER), artt. 32 e seguenti.
    url_ufficiale: "https://www.inps.it/it/it/inps-comunica/notizie/dettaglio-news-page.news.2026.06.bonus-inps-2026-al-via-le-domande-per-giovani-donne-e-zes.html"
    in_vigore_dal: "2026-01-01"
    in_vigore_fino_al: "2026-12-31"
    stato: aperto
    sintesi: >-
      Chi assume a tempo indeterminato nel 2026 (dal 1/1 al 31/12) un giovane under 35, una donna o, al Sud,
      un disoccupato di lungo periodo, non paga i contributi INPS a suo carico (esonero del 100%, premi INAIL
      esclusi) fino a un tetto mensile per lavoratore: Giovani 500 euro (650 nelle regioni ZES), Donne 650 euro
      (800 se la lavoratrice risiede nella ZES), ZES 650 euro. Dura 12 o 24 mesi secondo lo svantaggio del
      lavoratore. Si chiede all'INPS online, anche prima di assumere; vale fino a esaurimento dei fondi annuali.
    a_chi_si_rivolge: >-
      Datori di lavoro privati (studi professionali e altri datori non imprenditori: da verificare nelle circolari)
      che assumono a tempo indeterminato, anche part-time (tetto ridotto in proporzione) e soci lavoratori di
      cooperative. Esclusi: lavoro domestico, apprendistato, lavoro intermittente.
      Bonus Giovani: lavoratori che non hanno compiuto 35 anni e sono "svantaggiati" (es. senza un impiego
      regolarmente retribuito da almeno 6 mesi, oppure tra 15 e 24 anni, oppure senza diploma) o "molto
      svantaggiati" (senza impiego da 24 mesi, o da 12 mesi piu' un'altra condizione di svantaggio).
      Bonus Donne: donne di qualsiasi eta' senza impiego regolarmente retribuito da 24 mesi, o da 12 mesi (6 in
      alcuni casi) con un'altra condizione di svantaggio (eta' 15-24, niente diploma, oltre 50 anni, settori o
      professioni con forte disparita' di genere...).
      Bonus ZES: solo datori con al massimo 10 dipendenti nel mese dell'assunzione, sede o unita' produttiva
      in Abruzzo, Basilicata, Calabria, Campania, Marche, Molise, Puglia, Sicilia, Sardegna o Umbria; lavoratori
      di almeno 35 anni disoccupati da almeno 24 mesi; personale non dirigente.
    soggetti_ammessi: [impresa, libero_professionista, ente_terzo_settore]
    dimensioni_ammesse: []
    settori_esclusi: >-
      Nessun settore escluso in quanto tale; esclusi pubblica amministrazione, lavoro domestico, apprendistato.
      Non spetta per lavoratori occupati in Paesi extra UE non convenzionati. In agricoltura ed edilizia l'esonero
      sostituisce (non si somma a) le riduzioni contributive di settore: va fatto il conto di cosa conviene.
    investimenti_ammessi: >-
      Nessun investimento: si agevola il costo dei contributi previdenziali a carico del datore di lavoro per le
      nuove assunzioni a tempo indeterminato fatte nel 2026. Non valgono le trasformazioni di contratti a termine
      (per i giovani c'e' una misura a parte, art. 4 DL 62/2026, per le trasformazioni dal 1/8 al 31/12/2026).
      Condizioni comuni: incremento occupazionale netto
      rispetto alla media dei 12 mesi precedenti (salvo posti liberati da dimissioni, pensionamento, licenziamento
      per giusta causa...), DURC regolare, rispetto dei contratti collettivi, nessun licenziamento collettivo o
      per giustificato motivo oggettivo nella stessa unita' produttiva nei 6 mesi prima (Bonus ZES: anche nei 6
      mesi dopo), trattamento economico non inferiore a quello dei contratti collettivi indicati dall'art. 7.
    categorie_spesa: [personale]
    intensita: >-
      Esonero del 100% dei contributi previdenziali a carico del datore di lavoro (esclusi premi INAIL), con tetto
      mensile per lavoratore: Bonus Giovani 500 euro (650 in sede o unita' produttiva della ZES unica), 24 mesi
      per i molto svantaggiati e 12 mesi per gli altri svantaggiati; Bonus Donne 650 euro (800 per le residenti
      nella ZES unica), fino a 24 mesi (12 per alcune categorie); Bonus ZES 650 euro per 24 mesi. Limiti di spesa:
      Giovani 109,7 milioni nel 2026 (252,4 nel 2027, 135,4 nel 2028); Donne 26,5 milioni nel 2026; ZES 26 milioni
      nel 2026. Quando i fondi finiscono l'INPS non accoglie piu' domande.
    beneficio_stimato:
      percentuale_min: 13
      percentuale_max: 23
      nota: >-
        Percentuale del costo aziendale del lavoratore assunto (stipendio lordo + contributi + TFR) nei mesi
        agevolati. Esempio: stipendio lordo di 22.000 euro l'anno, contributi a carico dell'impresa circa 30%
        (6.600 euro, cioe' 550 al mese): con il Bonus Giovani (tetto 500) l'impresa risparmia 6.000 euro l'anno,
        circa il 20% del costo; con stipendi piu' alti il tetto pesa di piu' (28.000 euro lordi: circa 16%).
        Al Sud o con il Bonus Donne (650-800) si arriva a coprire quasi tutti i contributi (circa 22-23%).
        Aliquote contributive reali secondo il contratto e il settore: da verificare caso per caso.
    come_si_ottiene: >-
      1) Verificare che il lavoratore rientri nelle categorie (stato di disoccupazione, eta', residenza) e che
      l'impresa abbia l'incremento occupazionale netto. 2) Domanda all'INPS sul "Portale delle Agevolazioni (ex
      DiResCo)", modulo Bonus giovani 2026, Bonus donne 2026 o Bonus ZES 2026 (aperti dall'11/06/2026), con dati
      del lavoratore, retribuzione e aliquota contributiva. 3) Se la domanda e' fatta prima di assumere, l'INPS
      accantona le risorse e l'impresa deve assumere e inviare la comunicazione obbligatoria (Unilav) entro 10
      giorni, pena la perdita della prenotazione. 4) Dopo l'accoglimento l'esonero si applica nelle denunce
      contributive mensili (Uniemens), recuperando anche i mesi gia' passati.
    tempi: >-
      Risposta dell'INPS nel modulo online (assunzione gia' fatta) o via PEC (assunzione da fare). Il risparmio
      arriva subito, mese per mese, sui contributi da versare, per 12 o 24 mesi. Termine finale per le domande
      relative alle assunzioni 2026: da verificare (per i bonus 2024-2025 del decreto Coesione l'INPS ha chiuso
      le domande il 30/09/2026).
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Non si somma con altri esoneri o riduzioni dei contributi a carico del datore di lavoro (es. Decontribuzione
        Sud, incentivo per l'assunzione di disabili, incentivo NASpI, riduzioni per agricoltura in zone montane ed
        edilizia). Si somma senza riduzioni con la maxi-deduzione del costo dei nuovi assunti (L. 207/2024 commi
        399-400) e con l'esonero dell'1% per la certificazione della parita' di genere. Essendo un aiuto in esenzione
        (GBER), con un bando regionale che paga gli stessi costi del personale il totale non puo' superare l'intensita'
        massima del regolamento (di solito 50% del costo salariale per 12 o 24 mesi): da verificare con il bando.
      riferimento: "DL 62/2026 art. 2 c. 10 e art. 3 c. 9; circolari INPS 55, 56 e 57 del 14/05/2026, par. 9"
    attenzione: >-
      Solo tempo indeterminato e solo assunzioni dal 1/1 al 31/12/2026. Fondi annuali limitati (Bonus ZES e Donne
      circa 26 milioni ciascuno nel 2026): fare domanda presto, anche prima dell'assunzione. Senza incremento
      occupazionale netto (contato in ULA sui 12 mesi precedenti) l'esonero non spetta. Diritti di precedenza di
      altri lavoratori, licenziamenti nei 6 mesi precedenti o violazioni contributive fanno perdere il bonus.
      Iscrizione delle offerte sulla piattaforma SIISL per i datori che ricevono incentivi pubblici (DL 159/2025
      art. 14): verificare l'obbligo. Collegate ma distinte: esonero per le madri di almeno tre figli (L. 199/2025
      commi 210-213, circolare INPS 82 del 29/07/2026, fino a 8.000 euro l'anno) e incentivo per le
      trasformazioni a tempo indeterminato di giovani (art. 4 DL 62/2026, circolare 72/2026, messaggio 2518/2026).
    esempi:
      - profilo: ristorazione_ricettivo
        interesse: alto
        esempio: >-
          Hotel che assume a tempo indeterminato un cuoco di 28 anni senza lavoro da 8 mesi (svantaggiato) con 24.000
          euro lordi l'anno: contributi a carico circa 7.200 euro l'anno, esonero fino a 500 euro al mese per 12 mesi,
          circa 6.000 euro (7.200 se l'hotel e' in Puglia, tetto 650). Non vale per i contratti stagionali a termine.
      - profilo: manifattura
        interesse: alto
        esempio: >-
          Media impresa che aumenta l'organico di 4 operai: due donne senza impiego da oltre 24 mesi (Bonus Donne, fino
          a 650 euro al mese per 24 mesi: circa 15.600 euro ciascuna) e due under 35 svantaggiati (circa 6.000 euro
          ciascuno per 12 mesi): totale circa 43.000 euro. Serve l'incremento netto dell'organico; si somma alla
          maxi-deduzione del costo dei nuovi assunti.
      - profilo: logistica
        interesse: alto
        esempio: >-
          Operatore logistico che assume 10 magazzinieri a tempo indeterminato: per ogni under 35 svantaggiato circa
          6.000 euro (12 mesi), per i molto svantaggiati fino a 12.000 euro (24 mesi), di piu' nei magazzini del Sud.
          L'incremento netto si calcola sull'intera impresa: se nello stesso periodo chiude un deposito e licenzia,
          il bonus puo' saltare.
      - profilo: negozio
        interesse: medio
        esempio: >-
          Negozio di Bari con 4 dipendenti che assume una commessa di 40 anni disoccupata da 2 anni: Bonus ZES (ha
          meno di 10 dipendenti) o Bonus Donne, fino a 650 euro al mese per 24 mesi; con 20.000 euro lordi l'anno i
          contributi sono circa 500 euro al mese, quindi risparmio di circa 12.000 euro in due anni.
      - profilo: ufficio_servizi
        interesse: medio
        esempio: >-
          Studio tecnico che assume un geometra di 23 anni al primo impiego (svantaggiato perche' sotto i 25 anni):
          esonero fino a 500 euro al mese per 12 mesi, circa 6.000 euro. Per gli studi professionali (datori di
          lavoro non imprenditori) l'accesso e' da verificare. L'apprendistato e' escluso.
      - profilo: startup
        interesse: medio
        esempio: >-
          Startup che assume a tempo indeterminato uno sviluppatore di 26 anni senza un impiego regolare da 6 mesi:
          circa 6.000 euro in 12 mesi (stipendio da 32.000 euro: contributi circa 800 euro al mese, tetto 500). Utile
          anche in perdita, perche' riduce i contributi da versare e non le tasse.
      - profilo: artigiano
        interesse: medio
        esempio: >-
          Laboratorio artigiano che assume un operaio di 30 anni disoccupato da 2 anni (molto svantaggiato): fino a
          500 euro al mese per 24 mesi, circa 12.000 euro. Molti artigiani assumono giovani in apprendistato, che
          pero' e' escluso: va confrontato con le aliquote ridotte dell'apprendistato.
      - profilo: agricola
        interesse: basso
        esempio: >-
          Azienda agricola che assume a tempo indeterminato un trattorista di 33 anni disoccupato da 8 mesi: circa
          6.000 euro in 12 mesi, ma l'esonero non si somma alle riduzioni contributive per le zone montane o
          svantaggiate: conviene solo se supera la riduzione gia' goduta. La maggior parte degli operai agricoli e'
          a tempo determinato (OTD), esclusi.
    fonte_verificata_il: "2026-10-06"

  - id: fondo_garanzia_pmi
    nome: "Fondo di Garanzia per le PMI"
    aggiunta_il: 2026-10-06
    tipo: garanzia
    ente: "MIMIT; gestore Mediocredito Centrale - Banca del Mezzogiorno (fondidigaranzia.it)"
    norma: >-
      L. 23 dicembre 1996 n. 662, art. 2 comma 100 lett. a); riforma dell'art. 15-bis DL 145/2023 ("DL Anticipi")
      in vigore dal 1/1/2024, modificata dalla L. 207/2024; regole 2025 prorogate per tutto il 2026 dall'art. 14
      comma 1 DL 31 dicembre 2025 n. 200 (Milleproroghe); Disposizioni operative del Fondo e circolari MCC n. 21/2023
      e n. 20/2024.
    url_ufficiale: "https://www.fondidigaranzia.it/prorogate-per-il-2026-le-modalita-di-funzionamento-del-fondo-di-garanzia/"
    in_vigore_dal: "2000-01-01"
    in_vigore_fino_al: null
    stato: aperto
    sintesi: >-
      Garanzia dello Stato sui finanziamenti bancari e sul leasing di PMI e professionisti: se l'impresa non paga,
      il Fondo rimborsa alla banca una parte del debito. Nel 2026 copre l'80% dei finanziamenti per investimenti
      (e quelli di startup, PMI innovative, microcredito, Nuova Sabatini, importo ridotto) e il 50% di quelli per
      liquidita'. Non e' un contributo: aiuta ad avere il prestito, a un tasso piu' basso e senza dare altre
      garanzie sulla parte coperta. Si chiede tramite la banca o un confidi.
    a_chi_si_rivolge: >-
      Micro, piccole e medie imprese iscritte al Registro delle imprese e professionisti iscritti agli ordini o alle
      associazioni riconosciute; dalla riforma anche enti del terzo settore e, con percentuali piu' basse, le
      small mid-cap (fino a 499 addetti). L'impresa deve essere valutata dal modello di rating del Fondo: la fascia
      peggiore (5) non e' ammessa.
    soggetti_ammessi: [impresa, libero_professionista, ente_terzo_settore]
    dimensioni_ammesse: [micro, piccola, media]
    settori_esclusi: >-
      Attivita' finanziarie e assicurative (con poche eccezioni). Agricoltura: ammissione e regole da verificare
      (per le imprese agricole si usa spesso la garanzia ISMEA). Imprese in difficolta' o con sofferenze: escluse
      o con limiti secondo il rating.
    investimenti_ammessi: >-
      Qualsiasi finanziamento legato all'attivita' d'impresa, a breve o medio-lungo termine: investimenti
      (macchinari, impianti, immobili strumentali, veicoli, software, opere), liquidita' e scorte, consolidamento
      di debiti (con nuova finanza, regole da verificare), leasing, operazioni sul capitale di rischio. Importo
      massimo garantito per impresa: 5 milioni di euro (2,5 milioni per il capitale di rischio).
    categorie_spesa: [macchinari_attrezzature, software_digitale, opere_edili_impianti, immobili, veicoli, scorte_circolante]
    intensita: >-
      Garanzia diretta (o riassicurazione dei confidi) nel 2026: 80% per investimenti, importo ridotto, microcredito,
      Nuova Sabatini, startup, startup e PMI innovative, incubatori certificati, enti del terzo settore; 50% per la
      liquidita'. Percentuali piu' basse per le small mid-cap (es. 40% investimenti, 30% liquidita', secondo la
      riforma 2024; da verificare per il 2026). Massimo 5 milioni garantiti per impresa. Commissione una tantum sulla
      parte garantita secondo la riforma 2024: micro esenti, piccole 0,5%, medie 1%, small mid-cap 1,25% (da
      verificare per il 2026). Sulla parte garantita la banca non puo' chiedere altre garanzie reali, assicurative
      o bancarie. L'aiuto (equivalente sovvenzione lordo) va nel de minimis o nel GBER e nel Registro Nazionale Aiuti.
    beneficio_stimato:
      percentuale_min: null
      percentuale_max: null
      nota: >-
        Non e' un contributo sulla spesa: il beneficio e' poter ottenere il finanziamento, con un tasso di solito piu'
        basso e meno garanzie personali. Il valore come aiuto di Stato (equivalente sovvenzione lordo) lo calcola il
        Fondo per ogni operazione ed e' di solito pochi punti percentuali del finanziamento (da verificare caso per
        caso sulla delibera). Per questo non lo esprimiamo in percentuale della spesa.
    come_si_ottiene: >-
      1) L'impresa chiede il finanziamento a una banca, societa' di leasing o intermediario e, insieme, la garanzia
      del Fondo (garanzia diretta); oppure si rivolge a un confidi, che garantisce e chiede la riassicurazione al
      Fondo. Non si presenta domanda direttamente al Fondo. 2) La banca carica la richiesta con i dati di bilancio
      per il modello di rating. 3) Il Fondo delibera (Consiglio di gestione due volte a settimana) e la banca eroga.
    tempi: >-
      Istruttoria rapida dopo l'invio della banca (di solito poche settimane, da verificare). Strumento permanente;
      le percentuali di copertura attuali valgono fino al 31/12/2026, poi dipendono dalla prossima proroga.
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Si usa spesso insieme ai bandi a fondo perduto (per finanziare la quota non coperta), alla Nuova Sabatini e
        all'iperammortamento. L'aiuto implicito della garanzia conta come aiuto di Stato: sugli stessi costi il totale
        degli aiuti non deve superare l'intensita' massima del regolamento usato (GBER) o il massimale de minimis
        dell'impresa. Il Conto Termico 3.0 ammette espressamente i fondi di garanzia (DM 7/8/2025 art. 17).
      riferimento: "Disposizioni operative del Fondo; DM MASE 7/8/2025 art. 17; Reg. UE 651/2014 e 2831/2023"
    attenzione: >-
      Le percentuali del 2026 sono una proroga di un anno (DL 200/2025): dal 2027 possono cambiare. Rating del Fondo:
      con bilanci deboli la garanzia puo' essere negata. Per la liquidita' la copertura e' solo il 50%. L'aiuto
      consuma il massimale de minimis se la garanzia e' concessa in quel regime: tenerne conto prima di chiedere
      altri aiuti de minimis. La banca resta libera di non concedere il prestito anche con la garanzia.
    esempi:
      - profilo: startup
        interesse: alto
        esempio: >-
          Startup innovativa che chiede 150.000 euro alla banca per sviluppo prodotto e capitale circolante: copertura
          80% (120.000 euro garantiti) anche per la liquidita', senza commissione se e' una microimpresa. Spesso e'
          l'unico modo per avere credito nei primi anni, quando i bilanci sono in perdita.
      - profilo: artigiano
        interesse: alto
        esempio: >-
          Laboratorio che finanzia un macchinario da 60.000 euro: garanzia 80% (48.000 euro), microimpresa senza
          commissione; con la Nuova Sabatini sullo stesso finanziamento il tasso effettivo si abbassa ancora. Per
          importi fino a 40.000 euro c'e' la procedura semplificata "importo ridotto".
      - profilo: negozio
        interesse: alto
        esempio: >-
          Negozio che rinnova arredi e vetrine con un finanziamento di 50.000 euro: garanzia 80% (40.000 euro); per un
          fido o un prestito di liquidita' per le scorte da 30.000 euro la copertura e' il 50%. Micro: nessuna
          commissione.
      - profilo: ristorazione_ricettivo
        interesse: alto
        esempio: >-
          Hotel che ristruttura le camere con un mutuo di 800.000 euro: garanzia 80% (640.000 euro), commissione una
          tantum circa 0,5% del garantito se piccola impresa (circa 3.200 euro); la banca non puo' chiedere altre
          garanzie sulla parte coperta. Utile per finanziare la quota non coperta da un bando regionale sul turismo.
      - profilo: manifattura
        interesse: medio
        esempio: >-
          Media impresa che finanzia un nuovo capannone e una linea per 3 milioni: garanzia 80% (2,4 milioni, entro il
          tetto di 5 milioni per impresa), commissione circa 1% del garantito (circa 24.000 euro). Se il rating e'
          buono la banca puo' dare il prestito anche senza: conviene confrontare il tasso con e senza garanzia.
      - profilo: logistica
        interesse: medio
        esempio: >-
          Operatore logistico che finanzia carrelli, scaffalature e furgoni per 1,2 milioni: garanzia 80%. Se supera
          i 250 addetti diventa small mid-cap con copertura piu' bassa (40% per gli investimenti, da verificare).
      - profilo: ufficio_servizi
        interesse: medio
        esempio: >-
          Societa' di consulenza che chiede 100.000 euro di liquidita' per sostenere la crescita: garanzia 50%. Vale
          anche per i professionisti iscritti agli ordini. Utile soprattutto se la banca chiede garanzie personali ai soci.
      - profilo: agricola
        interesse: basso
        esempio: >-
          Azienda agricola che finanzia una cella frigo da 100.000 euro: accesso al Fondo PMI da verificare; per le
          imprese agricole lo strumento abituale e' la garanzia ISMEA, che funziona in modo simile. La parte di
          trasformazione (cantina, caseificio) organizzata come impresa a se' puo' usare il Fondo PMI.
    fonte_verificata_il: "2026-10-06"

  - id: maxi_deduzione_assunzioni
    nome: "Maxi-deduzione del costo dei nuovi assunti (120% - 130%)"
    aggiunta_il: 2026-10-06
    tipo: deduzione_maggiorata
    ente: "Agenzia delle Entrate (in dichiarazione dei redditi)"
    norma: >-
      Art. 4 D.Lgs. 30 dicembre 2023 n. 216; decreto attuativo MEF 25 giugno 2024; prorogata per i periodi
      d'imposta 2025, 2026 e 2027 dalla L. 30 dicembre 2024 n. 207, art. 1, commi 399 e 400. Chiarimenti:
      Agenzia delle Entrate, circolare n. 1/E del 20/01/2025.
    url_ufficiale: "https://www.agenziaentrate.gov.it/portale/-/comunicato-stampa-del-20-gennaio-2025-nuove-assunzioni"
    in_vigore_dal: "2024-01-01"
    in_vigore_fino_al: "2027-12-31"
    stato: aperto
    sintesi: >-
      Chi aumenta i dipendenti a tempo indeterminato puo' dedurre dalle tasse (IRES o IRPEF) il costo dei nuovi
      assunti maggiorato del 20%, cioe' il 120%; il 130% per alcune categorie (lavoratori molto svantaggiati,
      disabili, donne con almeno due figli minori, giovani ammessi agli incentivi per l'occupazione giovanile...).
      Vale anche per il 2026 (proroga fino al 2027). Nessuna domanda: si applica in dichiarazione. Per una societa'
      in utile vale circa il 4,8% del costo dei nuovi assunti (7,2% per le categorie al 130%).
    a_chi_si_rivolge: >-
      Imprese (societa' di capitali, di persone, ditte individuali, enti commerciali e stabili organizzazioni) e
      professionisti, con reddito determinato in modo analitico, che hanno esercitato l'attivita' per almeno 365
      giorni prima del periodo agevolato. Esclusi: imprese in liquidazione ordinaria, liquidazione giudiziale o altre
      procedure liquidatorie, forfettari. Enti non commerciali solo per i dipendenti dell'attivita' commerciale.
    soggetti_ammessi: [impresa, libero_professionista]
    dimensioni_ammesse: []
    settori_esclusi: >-
      Nessun settore escluso. Non serve a chi non ha reddito d'impresa o di lavoro autonomo determinato
      analiticamente (es. forfettari, imprese agricole con solo reddito agrario catastale), e rende poco a chi e' in perdita.
    investimenti_ammessi: >-
      Nessun investimento: il costo del personale a tempo indeterminato assunto in piu' (voci B9 del conto
      economico: salari, oneri sociali, TFR, quiescenza, altri costi; esclusi buoni pasto, formazione, trasferte).
      Condizioni a fine periodo d'imposta: aumento del numero medio dei dipendenti a tempo indeterminato rispetto
      al periodo precedente e aumento anche del numero complessivo dei dipendenti (compresi i tempi determinati).
    categorie_spesa: [personale]
    intensita: >-
      Maggiorazione del 20% (30% per le categorie dell'allegato 1 al D.Lgs. 216/2023) del minore tra il costo dei
      nuovi assunti a tempo indeterminato e l'aumento del costo complessivo del personale rispetto al periodo
      precedente. Solo imposte sui redditi, non IRAP. Negli acconti non si tiene conto della maggiorazione.
    beneficio_stimato:
      percentuale_min: 4.8
      percentuale_max: 12.9
      nota: >-
        Risparmio = maggiorazione x aliquota. Societa' di capitali (IRES 24%): 20% x 24% = 4,8% del costo dei nuovi
        assunti, 30% x 24% = 7,2%. Ditte individuali e societa' di persone (IRPEF marginale 35-43%): dal 7% al 12,9%.
        Solo con un reddito imponibile capiente; in perdita aumenta la perdita riportabile.
    come_si_ottiene: >-
      Nessuna domanda. A fine anno il commercialista verifica l'incremento dei dipendenti a tempo indeterminato e
      complessivo (medie in ULA, rispetto al periodo precedente), calcola il costo dei nuovi assunti e l'aumento del
      costo del personale, applica il 20% o 30% e deduce la maggiorazione come variazione in diminuzione nella
      dichiarazione dei redditi. Conservare la documentazione sulle categorie di lavoratori al 130%.
    tempi: "Beneficio nella dichiarazione dei redditi del periodo d'imposta dell'assunzione (2026: dichiarazione del 2027)."
    cumulabilita:
      con_fondo_perduto: si
      regola: >-
        Misura fiscale generale (non aiuto di Stato secondo l'impostazione corrente; da verificare per casi
        particolari). Si somma espressamente, senza riduzioni, con i Bonus Giovani, Donne e ZES 2026 (DL 62/2026,
        richiamato nelle circolari INPS). Con un contributo a fondo perduto sui costi del personale: il contributo e'
        un ricavo tassato, la maggiorazione resta sul costo; eventuali divieti di cumulo del bando vanno controllati.
      riferimento: "D.Lgs. 216/2023 art. 4; L. 207/2024 art. 1 c. 399-400; circolare AE 1/E 2025; circolari INPS 55-57/2026"
    attenzione: >-
      Serve un aumento netto sia dei tempi indeterminati sia del totale dei dipendenti: se si assume a tempo
      indeterminato ma scadono contratti a termine non rinnovati, il beneficio puo' sparire. Nei gruppi si guarda
      all'incremento di gruppo. Le trasformazioni da tempo determinato contano solo se aumentano il numero dei
      tempi indeterminati (dettaglio nella circolare 1/E). Attivita' da almeno 365 giorni. Categorie al 130% da
      documentare. Apprendisti: conteggio da verificare.
    esempi:
      - profilo: manifattura
        interesse: alto
        esempio: >-
          Srl in utile che passa da 80 a 85 dipendenti a tempo indeterminato, con 200.000 euro di costo per i 5 nuovi
          assunti (e un aumento del costo del personale almeno pari): maggiorazione 40.000 euro, risparmio IRES circa
          9.600 euro; se 2 dei 5 sono molto svantaggiati la maggiorazione sale al 30% per quei due. Si somma ai bonus
          contributivi INPS per gli stessi lavoratori.
      - profilo: logistica
        interesse: alto
        esempio: >-
          Operatore logistico che apre un nuovo magazzino e assume 15 persone a tempo indeterminato per 540.000 euro
          di costo: maggiorazione 108.000 euro, risparmio IRES circa 25.900 euro. Attenzione ai contratti a termine
          e ai somministrati non rinnovati negli altri depositi: conta il totale dei dipendenti.
      - profilo: ristorazione_ricettivo
        interesse: medio
        esempio: >-
          Srl che gestisce un ristorante e assume 2 camerieri a tempo indeterminato (64.000 euro di costo):
          maggiorazione 12.800 euro, risparmio IRES circa 3.070 euro. Se nello stesso anno riduce gli stagionali
          a termine, il totale dei dipendenti non cresce e il beneficio si perde.
      - profilo: artigiano
        interesse: medio
        esempio: >-
          Ditta individuale artigiana che assume il primo operaio a tempo indeterminato (30.000 euro di costo):
          maggiorazione 6.000 euro, risparmio IRPEF circa 2.100-2.580 euro con aliquota del 35-43%. Serve l'attivita'
          da almeno un anno e un reddito capiente; il conteggio degli apprendisti e' da verificare.
      - profilo: ufficio_servizi
        interesse: medio
        esempio: >-
          Societa' di consulenza in utile che assume un consulente junior per 40.000 euro di costo annuo: maggiorazione
          8.000 euro, risparmio IRES circa 1.920 euro; se il giovane era ammesso agli incentivi per l'occupazione
          giovanile, 30% e circa 2.880 euro. Vale anche per gli studi professionali in contabilita' analitica.
      - profilo: negozio
        interesse: basso
        esempio: >-
          Snc con un negozio che assume una commessa a tempo indeterminato (28.000 euro di costo): maggiorazione 5.600
          euro, risparmio IRPEF dei soci circa 1.960-2.400 euro. Non spetta se l'impresa e' nel forfettario.
      - profilo: startup
        interesse: basso
        esempio: >-
          Startup in perdita che assume 3 sviluppatori (120.000 euro di costo): la maggiorazione di 24.000 euro aumenta
          la perdita riportabile, quindi il risparmio arriva solo quando ci saranno utili. Serve anche l'attivita' da
          almeno 365 giorni. Meglio puntare sui bonus contributivi, che valgono subito.
      - profilo: agricola
        interesse: nullo
        esempio: >-
          Azienda agricola che dichiara solo il reddito agrario catastale: la maggiorazione non serve, perche' il
          reddito non si calcola sui costi. Puo' interessare solo se c'e' una societa' di trasformazione (cantina,
          caseificio) con reddito d'impresa e bilancio.
    fonte_verificata_il: "2026-10-06"

