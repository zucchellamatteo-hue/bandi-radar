          ed e' pieno solo se ogni anno c'e' abbastanza reddito tassabile. La colonna IRPEF 43% vale se il reddito
          resta sopra 50.000 euro anche dopo la deduzione. Se sugli stessi beni c'e' un contributo (Sabatini,
          credito ZES, bando regionale), la base si riduce di quell'importo.
      - titolo: "Cosa rientra: distinzioni per tipo di bene"
        colonne: ["Tipo di bene", "Riferimento (2026 / dal 2027)", "Condizioni principali", "In pratica"]
        righe:
          - ["Macchine e impianti a controllo computerizzato (macchine utensili, robot, magazzini automatici, AGV)", "Allegato IV gruppo I / allegato E", "Tutte e 5 le caratteristiche obbligatorie e 2 delle 3 ulteriori; interconnessione", "Il caso tipico della manifattura; serve la perizia su ogni bene"]
          - ["Sistemi di qualita' e sostenibilita' (misura, controllo, tracciabilita', monitoraggio consumi, filtri)", "Allegato IV gruppo II / allegato E", "Interconnessione", "Anche i sistemi di monitoraggio energetico rientrano qui"]
          - ["Interazione uomo-macchina ed ergonomia (esoscheletri, banchi adattivi, self-checkout, totem, vetrine interconnesse)", "Allegato IV gruppo III / allegato E", "Interconnessione al gestionale", "Apre la misura a negozi e grande distribuzione"]
          - ["Hardware e infrastruttura dati (server GPU, edge, storage, 5G privato, firewall industriali, backup)", "Allegato IV gruppo IV / allegato E", "Solo se al servizio dei processi produttivi o dei beni 4.0", "Pc, notebook, tablet, stampanti e server d'ufficio esclusi"]
          - ["Software (MES, SCADA, CAD/CAM, PLM, CMMS, supply chain, IA, cybersecurity, EMS)", "Allegato V / allegato F", "Licenza acquistata e ammortizzabile, interconnessa; ERP solo moduli di produzione/logistica", "Recupero rapido (ammortamento in 2 anni); abbonamenti SaaS esclusi"]
          - ["Fotovoltaico in autoconsumo", "Art. 8 DM e allegato 1", "Moduli registro ENEA lettere b o c; producibilita' max 105% del fabbisogno; costo max per kWp: lettera b 1.420 euro fino a 20 kW, 1.120 fino a 200, 1.020 fino a 600, 910 fino a 1.000, 840 oltre; lettera c 1.500 / 1.200 / 1.100 / 1.000 / 940", "La parte di costo sopra il massimo non ha maggiorazione"]
          - ["Eolico, idroelettrico, geotermico, biomassa", "Art. 8 DM e allegato 1", "Costi massimi per kW per fonte e taglia (es. eolico 2.640 euro/kW fino a 20 kW)", "Stesso limite del 105% del fabbisogno"]
          - ["Accumuli (batterie)", "Art. 8 DM, allegato 1 tabella 2b", "Valore max = coefficiente x valore dell'impianto (fotovoltaico: 2 fino a 20 kW, 1,5 fino a 600 kW, 1,2 fino a 1.000, 1 oltre)", "Solo se asserviti all'impianto rinnovabile"]
          - ["Impianti termici rinnovabili per calore di processo (pompe di calore, solare termico, biomassa)", "Art. 8 DM, allegato 1 tabelle 2c-2d", "Solo calore di processo, non riscaldamento ambienti; costi max per kW (es. pompa aria/acqua 1.560 euro/kWt fino a 1.000 kW)", "Dimensionati solo sul fabbisogno di calore di processo"]
          - ["Esclusi", "-", "Beni usati, fabbricati e opere murarie, autoveicoli e camion, pc e beni d'ufficio, abbonamenti SaaS, beni non interconnessi", "Valutare Nuova Sabatini o bandi regionali"]
        nota: >-
          Gli allegati IV e V (dal 2027 E ed F del nuovo TUIR) hanno lo stesso contenuto; dal DL 38/2026 i beni
          possono essere prodotti anche fuori dall'UE, tranne i moduli fotovoltaici (registro ENEA, lettere b e c).
          Per i beni "green" non c'e' una linea a parte ne' un obbligo di risparmio energetico: contano solo gli
          impianti rinnovabili in autoconsumo e i beni degli allegati. Costi massimi dall'allegato 1 al DM 7/5/2026.
      - titolo: "Cosa cambia con la forma e la dimensione dell'impresa"
        colonne: ["Chi", "Puo' usarlo?", "Aliquota che conta", "In pratica"]
        righe:
          - ["Micro e piccola impresa societa' di capitali", "Si'", "IRES 24%", "43,2% fino a 2,5 milioni; perizia e certificazione contabile pesano di piu' sugli importi piccoli"]
          - ["Media impresa", "Si'", "IRES 24%", "Di solito tutto nel primo scaglione; se supera 2,5 milioni nell'anno, valutare di spostare parte all'anno dopo"]
          - ["Grande impresa", "Si'", "IRES 24%", "Sopra 2,5 milioni l'anno il valore scende (33,6% su 5 milioni, 20,4% su 20); oltre 20 milioni nulla"]
          - ["Ditta individuale e snc/sas (ordinaria o semplificata)", "Si'", "IRPEF del titolare o dei soci (23%, 33%, 43% + addizionali)", "Con redditi alti vale piu' che per una srl (fino al 77,4%); con redditi bassi meno"]
          - ["Forfettari", "No", "-", "Non deducono ammortamenti"]
          - ["Professionisti e studi associati", "No", "-", "Non hanno reddito d'impresa"]
          - ["Imprese agricole a reddito catastale", "No in pratica", "-", "Solo le societa' agricole che tassano a bilancio; perizia anche da agronomo"]
          - ["Imprese nel concordato preventivo biennale", "Si'", "Come sopra", "Dal DL 38/2026 la maggiorazione riduce anche il reddito concordato"]
          - ["Imprese in perdita e startup", "Si', ma il beneficio slitta", "-", "Aumenta la perdita riportabile (art. 84 TUIR: per le societa' di capitali, dopo i primi 3 anni, compensabile fino all'80% del reddito)"]
          - ["Imprese del Sud e delle ZES", "Si'", "Come sopra", "Nessuna maggiorazione in piu'; cumulabile con il credito ZES ma la base si riduce del credito"]
        nota: >-
          Non ci sono differenze di aliquota per dimensione o territorio: la dimensione conta solo perche' oltre
          2,5 milioni di investimenti l'anno la maggiorazione scende. Esclusi per norma le imprese in liquidazione o
          procedure concorsuali e quelle con sanzioni interdittive 231.
    beneficio_stimato:
      percentuale_min: 12
      percentuale_max: 77.4
      nota: >-
        Risparmio = maggiorazione x aliquota. Societa' (IRES 24%): primo scaglione 180% x 24% = 43,2% della spesa;
        secondo: 100% x 24% = 24%; terzo: 50% x 24% = 12%. Ditte individuali e soci di societa' di persone:
        aliquota IRPEF marginale, fino a 180% x 43% = 77,4% (59,4% con il 33%), piu' addizionali. Solo per
        un'impresa in utile e capiente, distribuito sugli anni di ammortamento (o del leasing), quindi il valore
        attuale e' un po' piu' basso. Non riduce l'IRAP. Se c'e' un contributo sullo stesso bene, la base si riduce.
    come_si_ottiene: >-
      Tutto sulla piattaforma GSE (Area Clienti, SPID/CIE), per ogni struttura produttiva (sito con una o piu'
      unita' locali sulla stessa particella catastale o su particelle contigue):
      1) comunicazione preventiva (piattaforma aperta dal 12/06/2026) con beni, importi, data prevista
      di interconnessione o entrata in funzione;
      2) entro 60 giorni dall'esito positivo del GSE, comunicazione di conferma con pagamento di acconti
      almeno pari al 20% del costo di ogni bene e dati delle fatture (piattaforma dal 21/07/2026; per il
      leasing basta il contratto e l'ordine firmato dal concedente); non puo' riguardare beni diversi o importi
      maggiori della preventiva;
      3) a investimento completato e interconnesso, e comunque entro il 15/11/2028, comunicazione di
      completamento con attestazione di possesso di perizia e certificazione contabile;
      4) ogni anno, fino a fine fruizione: comunicazione entro il 20 gennaio (investimenti e previsione
      di utilizzo) ed entro il 30 giugno (piano di ammortamento).
      Il GSE risponde entro 10 giorni; integrazioni entro 10 giorni. Il mancato invio nei termini fa perdere
      il beneficio (art. 3 c. 5 DM).
    tempi: >-
      La maggiorazione si usa dal periodo d'imposta in cui si invia la comunicazione di completamento,
      se il bene e' entrato in funzione nello stesso periodo e dopo l'esito positivo del GSE (art. 4 c. 1 DM); poi
      in dichiarazione dei redditi anno per anno, lungo tutta la durata dell'ammortamento (di solito
      7-10 anni per i macchinari, 2 per il software, circa 11 per il fotovoltaico) o del leasing. Investimenti
      completati dal 1/1/2026 al 30/9/2028 (per i beni: consegna secondo l'art. 109 TUIR; per gli impianti: fine
      lavori). L'acconto delle imposte 2026 si calcola senza l'iperammortamento (comma 434).
    cumulabilita:
      con_fondo_perduto: si
      regola: >-
        Cumulabile con altre agevolazioni nazionali ed europee sugli stessi costi (anche credito ZES
        unica, Nuova Sabatini, bandi regionali FESR, de minimis), a condizione che il sostegno non copra
        le medesime quote di costo e che il totale non superi il costo sostenuto; la base della
        maggiorazione si calcola al netto dei contributi a qualunque titolo ricevuti per gli stessi costi.
        Essendo una misura fiscale generale non e' un aiuto di Stato e non consuma i massimali GBER
        (secondo i commentatori; da verificare in eventuali chiarimenti dell'Agenzia).
        NON cumulabile con il credito d'imposta beni strumentali 4.0/Transizione 5.0 sugli stessi beni
        (investimenti che hanno gia' avuto il beneficio dell'art. 1 c. 446 L. 207/2024) e, secondo il GSE, con
        il Conto Termico 3.0 sulle stesse spese.
        Dubbio aperto: se il contributo Sabatini vada sottratto dalla base (prudenza: sottrarlo).
      riferimento: "L. 199/2025 art. 1 comma 431 (come modificato); DM CT 7/8/2025 art. 17"
    attenzione: >-
      Perizia tecnica asseverata (ingegnere o perito industriale iscritto, o ente di certificazione
      accreditato; agronomo, agrotecnico o perito agrario laureato per l'agricolo) per ogni bene, senza soglie
      minime (niente autocertificazione per i beni piccoli, a differenza del vecchio regime): deve provare
      caratteristiche da allegato IV/V, interconnessione e, per gli impianti, i requisiti dell'art. 8. Certificazione
      contabile di un revisore legale (o di quello che gia' rivede i conti). Interconnessione entro il
      completamento: senza, niente beneficio. Termini delle comunicazioni perentori (mancato invio = beneficio
      perso). Decadenza se il bene viene venduto o spostato all'estero durante la fruizione senza sostituirlo
      nello stesso periodo d'imposta con un bene nuovo con caratteristiche analoghe o superiori, per documenti
      mancanti o dichiarazioni false; controlli GSE nei termini dell'accertamento fiscale, recupero con interessi
      e sanzioni tramite l'Agenzia delle Entrate. Beni nuovi, niente usato. Polizza catastrofale: secondo i
      commentatori non e' richiesta perche' l'incentivo e' automatico (da verificare). Nessun tetto di spesa
      complessivo per le imprese: il MEF monitora l'andamento della spesa e il Ministro puo' intervenire se supera
      le previsioni.
    esempi:
      - profilo: manifattura
        interesse: alto
        esempio: >-
          Linea di produzione interconnessa da 1.200.000 euro piu' fotovoltaico in autoconsumo da 400 kW per
          400.000 euro (entro il costo massimo di 1.020 euro/kWp con moduli di lettera b): 1.600.000 euro, tutto nel
          primo scaglione (fino a 2,5 milioni, +180%). Maggiorazione 2.880.000 euro, cioe' circa 691.200 euro di IRES
          in meno (43,2%), distribuiti sugli anni di ammortamento. Comunicazioni al GSE, acconto del 20% entro 60
          giorni dall'esito, perizia e certificazione contabile; sulle stesse spese niente Conto Termico.
      - profilo: logistica
        interesse: alto
        esempio: >-
          Magazzino automatico interconnesso al gestionale, AGV e software di logistica per 800.000 euro
          (magazzini automatici e software di logistica sono negli allegati IV/V): maggiorazione 1.440.000 euro,
          circa 345.600 euro di IRES in meno in piu' anni (il software gia' in 2 anni). Il fotovoltaico sui tetti dei
          magazzini e' ammesso per l'autoconsumo entro il 105% del fabbisogno di ciascuna struttura, con comunicazioni
          separate per ogni struttura produttiva. Camion e furgoni non sono beni 4.0: non compaiono negli allegati.
      - profilo: artigiano
        interesse: alto
        esempio: >-
          Centro di lavoro a controllo numerico interconnesso da 150.000 euro: maggiorazione 270.000 euro. Se il
          laboratorio e' una srl in utile, circa 64.800 euro di IRES in meno negli anni. Se e' una ditta individuale
          o una snc conta l'aliquota IRPEF del titolare o dei soci: circa 89.100 euro con il 33%, fino a 116.100 euro
          con il 43% se il reddito resta sopra 50.000 euro. Perizia e certificazione hanno un costo quasi fisso, che
          pesa di piu' sugli investimenti piccoli.
      - profilo: ristorazione_ricettivo
        interesse: medio
        esempio: >-
          Hotel (srl in utile) che installa 50 kW di fotovoltaico in autoconsumo per 56.000 euro (costo massimo
          ammesso 1.120 euro/kWp con moduli di lettera b, cioe' 56.000 euro): circa 24.200 euro di IRES in meno in
          circa 11 anni, se l'impianto non supera il 105% del fabbisogno. Una pompa di calore conta solo per il calore
          di processo (es. lavanderia, cucina), non per riscaldare le camere. Le attrezzature da cucina contano solo
          se sono nell'allegato IV e interconnesse: da verificare con il perito. Se il fotovoltaico va nel Conto
          Termico insieme a una pompa di calore, sulle stesse spese bisogna scegliere.
      - profilo: agricola
        interesse: medio
        esempio: >-
          Trattore con guida satellitare e raccolta dati interconnessa da 150.000 euro: per una societa' agricola
          che tassa a bilancio, circa 64.800 euro di imposte in meno (43,2%) negli anni. Le imprese agricole a
          reddito catastale non deducono ammortamenti, quindi di fatto sono escluse: per molte aziende agricole
          il beneficio e' zero. La perizia la puo' firmare un agronomo.
      - profilo: negozio
        interesse: basso
        esempio: >-
          Casse self-checkout, totem e vetrine interconnesse al gestionale sono ora nell'allegato IV: 40.000 euro
          valgono circa 17.280 euro di IRES in meno per una srl in utile (per una snc con soci al 33% circa 23.760).
          In alternativa il fotovoltaico in autoconsumo, se c'e' un tetto disponibile. Perizia, certificazione e
          quattro comunicazioni al GSE riducono parecchio il vantaggio netto sugli importi piccoli.
      - profilo: ufficio_servizi
        interesse: basso
        esempio: >-
          Computer e programmi da ufficio, contabilita' e fatturazione non rientrano: servono beni degli allegati
          IV/V interconnessi. Una licenza acquistata di un software dell'allegato V (es. cybersecurity) da 20.000
          euro darebbe circa 8.640 euro di IRES in meno in 2 anni, a fronte dei costi di perizia e
          certificazione; gli abbonamenti SaaS non valgono. Gli studi professionali senza reddito d'impresa sono esclusi.
      - profilo: startup
        interesse: basso
        esempio: >-
          Server GPU e licenze acquistate di software dell'allegato V (es. IA generativa) per 50.000 euro varrebbero
          circa 21.600 euro di imposte in meno, ma solo quando l'impresa avra' utili tassabili: in perdita la
          maggiorazione aumenta la perdita riportabile (nei primi 3 anni di attivita' senza il limite dell'80%,
          art. 84 TUIR). Gli abbonamenti SaaS non rientrano. Per una startup in perdita conta di piu' il credito
          ricerca e sviluppo, che si usa in F24.
    fiscale: >-
      Vale solo per le imposte sui redditi (IRES, o IRPEF per ditte individuali e societa' di persone):
      deduzione extracontabile delle quote di ammortamento o dei canoni di leasing maggiorati (quadro RF del
      modello Redditi). NON riduce l'IRAP (comma 427 "ai fini delle imposte sui redditi", art. 4 DM 7/5/2026; per
      le misure analoghe Circolare AdE 4/E/2017 par. 5.1): ai fini IRAP resta deducibile solo l'ammortamento normale.
      Esempio: macchinario da 200.000 euro, srl, ammortamento in 5 anni: 17.280 euro di IRES in meno l'anno
      (86.400 in tutto); i 72.000 euro annui di maggiorazione non contano per l'IRAP. Non e' un ricavo
      tassabile e non si usa in F24. Acconto 2026 calcolato senza iperammortamento. Per chi ha aderito al
      concordato preventivo biennale la maggiorazione riduce anche il reddito concordato (art. 7 DL 38/2026).
    fonte_verificata_il: "2026-10-09"
  - id: credito_rs_2026
    nome: "Credito d'imposta ricerca e sviluppo"
    aggiunta_il: 2026-10-05
    tipo: credito_imposta
    ente: "MIMIT (comunicazioni, certificazione) e Agenzia delle Entrate (utilizzo e controlli)"
    norma: >-
      Legge 27 dicembre 2019 n. 160, art. 1, commi 198-209, e modifiche (comma 200 spese e maggiorazioni al 150%,
      203 aliquote e tetti, 203-bis base al netto dei contributi, 204 utilizzo e regime fiscale, 205 certificazione
      contabile); DM 26 maggio 2020 (regole di calcolo, art. 6 c. 6 amministratori); DL 29 marzo 2024 n. 39, art. 6
      (comunicazioni preventive e consuntive); DL 73/2022 art. 23 e DPCM 15/9/2023 (certificazione tecnica);
      Linee guida MIMIT 4 luglio 2024 sulla qualificazione delle attivita'. La L. 199/2025 non cambia il credito
      R&S (proroga solo il credito design, voce separata). Non e' un aiuto di Stato: misura generale, senza de
      minimis ne' GBER.
    url_ufficiale: "https://www.mimit.gov.it/it/incentivi/credito-d-imposta-r-s"
    in_vigore_dal: "2023-01-01"
    in_vigore_fino_al: "2031-12-31"
    stato: aperto
    sintesi: >-
      Le imprese che fanno ricerca e sviluppo (ricerca fondamentale, ricerca industriale, sviluppo sperimentale)
      recuperano il 10% delle spese ammissibili (personale, contratti di ricerca, quote di ammortamento di
      strumenti, consulenze, materiali) come credito da usare in F24 per pagare tasse e contributi, in tre quote
      annuali dal 2027 per le spese del 2026. Le spese per giovani ricercatori assunti a tempo indeterminato e per
      i contratti con universita', enti di ricerca e startup innovative contano al 150%: su quelle il credito
      vale in pratica il 15%. Stessa aliquota per tutte le dimensioni e in tutta Italia: le maggiorazioni per il
      Sud (fino al 45% per le piccole) sono finite nel 2025. Massimo 5 milioni l'anno per impresa. Non vale per
      comprare macchinari di produzione, e il credito per innovazione tecnologica, 4.0 e green non esiste piu'
      dal 2026.
    a_chi_si_rivolge: >-
      Tutte le imprese residenti in Italia e le stabili organizzazioni di imprese estere, a prescindere da forma
      giuridica, settore, dimensione e regime di determinazione del reddito (comma 199): anche ditte individuali,
      imprese agricole a reddito agrario e forfettari (le spese contano per l'importo che sarebbe deducibile in via
      analitica, DM 26/5/2020 art. 6). Serve svolgere attivita' di R&S ammissibili secondo il Manuale di Frascati
      e il DM 26/5/2020. Il comma 199 parla solo di imprese: un professionista che non esercita in forma d'impresa
      non rientra (da verificare caso per caso per studi associati e societa' tra professionisti).

      Escluse (comma 199) le imprese in liquidazione volontaria, fallimento o liquidazione giudiziale,
      liquidazione coatta, concordato senza continuita' o altre procedure concorsuali (anche solo in corso di
      dichiarazione) e quelle con sanzioni interdittive D.Lgs. 231/2001. Condizione per usare il credito: rispetto
      delle norme sulla sicurezza sul lavoro e regolarita' contributiva (DURC).

      Chi ha cosa: aliquota unica 10% per micro, piccole, medie e grandi; la sola differenza pratica per dimensione
      e' che le imprese non obbligate alla revisione legale (di solito micro e piccole) ottengono in piu' il costo
      della certificazione contabile, fino a 5.000 euro (comma 205), e che il tetto di 5 milioni conta solo per
      chi ha piu' di 50 milioni di spese R&S l'anno.
    soggetti_ammessi: [impresa]
    dimensioni_ammesse: []
    settori_esclusi: "Nessun settore escluso in quanto tale (comma 199). Escluse solo le imprese in liquidazione o procedure concorsuali e quelle con sanzioni interdittive 231."
    investimenti_ammessi: >-
      Spese per attivita' di ricerca fondamentale, ricerca industriale e sviluppo sperimentale (comma 200), per le
      sole ore o quote dedicate alla R&S:

      a) PERSONALE dipendente o con altro rapporto di lavoro (anche collaboratori), per le ore dedicate
      (timesheet giornalieri nominativi). Amministratori e soci: compensi fissi ammessi al massimo per il 50%,
      esclusi i compensi variabili e la partecipazione agli utili, e solo se il compenso fisso e' pagato per intero
      nell'anno (DM 26/5/2020 art. 6 c. 6). GIOVANI RICERCATORI al 150%: under 35 al primo impiego, con dottorato
      (o iscritti a un dottorato) o laurea magistrale in discipline tecnico-scientifiche (classificazione
      UNESCO ISCED), assunti a tempo indeterminato e impiegati esclusivamente in R&S.

      b) BENI: quote di ammortamento, canoni di leasing o locazione e altre spese per beni materiali mobili e
      software usati nel progetto, per la quota di uso in R&S; in tutto al massimo il 30% delle spese di personale
      della lettera a). Non conta il costo pieno del bene, solo la quota dell'anno.

      c) CONTRATTI DI RICERCA EXTRA MUROS con soggetti residenti in Italia (o nella UE/SEE/white list): al 150%
      se con universita', istituti di ricerca o startup innovative italiane, al 100% con gli altri commissionari;
      contratti infragruppo con regole proprie (da verificare con il certificatore).

      d) PRIVATIVE INDUSTRIALI (brevetti, topografie di prodotti a semiconduttori, nuove varieta' vegetali)
      acquistate o in licenza da soggetti esterni al gruppo, usate nel progetto: quote fino a 1 milione in tutto.

      e) CONSULENZE e servizi equivalenti per la R&S: al massimo il 20% delle spese di personale.

      f) MATERIALI, forniture e altri prodotti analoghi usati nella R&S (anche per prototipi e impianti pilota):
      al massimo il 30% delle spese di personale (o, nella ricerca extra muros, del 30% dei costi dei contratti).

      Software: e' R&S solo se il progetto risolve un'incertezza tecnologica (Frascati 2.68-2.73, Linee guida
      MIMIT 2024: ammessi campi come IA, cybersecurity, big data, cloud, blockchain quando c'e' avanzamento
      tecnico vero); non lo sono gestionali, siti, personalizzazioni, integrazione di API di mercato, migrazioni
      in cloud. Licenze e abbonamenti software usati nel progetto entrano nella voce b); per i servizi cloud la
      voce va verificata con il certificatore. Non ammessi: macchinari di produzione, commercializzazione,
      modifiche di routine o periodiche a prodotti e processi, controllo qualita', reverse engineering.
    categorie_spesa: [ricerca_sviluppo]
    intensita: >-
      ALIQUOTA 2026. 10% della base di calcolo, massimo 5 milioni di euro per periodo d'imposta, per i periodi dal
      2023 al 2031 (comma 203; pagina MIMIT verificata il 09/10/2026). Il tetto di 5 milioni si raggiunge con 50
      milioni di base: per una PMI non conta. Stessa aliquota per micro, piccole, medie e grandi e in tutta Italia.

      COME SI CALCOLA. Base = personale R&S (giovani ricercatori x 1,5) + beni (max 30% del personale) +
      contratti extra muros (x 1,5 con universita', enti di ricerca, startup innovative) + privative (max 1
      milione) + consulenze (max 20% del personale) + materiali (max 30% del personale) - contributi ricevuti per
      le stesse spese (comma 203-bis). Credito = 10% x base, piu' il costo della certificazione contabile fino a
      5.000 euro per le imprese non obbligate alla revisione (comma 205). Si usa in tre quote annuali uguali dal
      periodo dopo quello delle spese.

      ESEMPIO DI CALCOLO (piccola srl, spese 2026). Tre tecnici per le ore in R&S 110.000 euro; un ingegnere di 28
      anni al primo impiego, laurea magistrale, a tempo indeterminato e solo in R&S, 40.000 euro, che conta 60.000;
      quote di ammortamento degli strumenti di laboratorio per l'uso in R&S 15.000; contratto con un'universita'
      30.000, che conta 45.000; consulenze 10.000; materiali per i prototipi 20.000. Totale 260.000; meno 20.000 di
      contributo di un bando regionale sulle stesse spese = base 240.000. Credito 24.000 euro, piu' 3.000 di
      costo del revisore = 27.000, cioe' 9.000 euro l'anno in F24 nel 2027, 2028 e 2029. Senza le due
      maggiorazioni al 150% il credito sarebbe 20.500 + 3.000.

      IN PERCENTUALE SUL COSTO VERO. 10% sulle spese ordinarie; 15% sulle spese per giovani ricercatori e sui
      contratti con universita', enti di ricerca e startup innovative. Esempi: 50.000 euro di spese = 5.000 euro di
      credito (7.500 se tutte al 150%); 200.000 = 20.000 (30.000); 1 milione = 100.000 (150.000).

      NIENTE PIU' MAGGIORAZIONI SUD NE' INNOVAZIONE. Le aliquote maggiorate per Abruzzo, Basilicata, Calabria,
      Campania, Molise, Puglia, Sardegna, Sicilia e per le aree del sisma 2016-2017 di Lazio, Marche e Umbria (art.
      244 DL 34/2020: 25% grandi, 35% medie, 45% piccole) valevano fino al periodo d'imposta 2025 e non sono
      prorogate (la pagina MIMIT non le riporta per il 2026). Il credito innovazione tecnologica (5%, max 2
      milioni) e innovazione 4.0 e green (5%, max 4 milioni) valevano fino al 2025. Il credito design 2026 (10%,
      max 2 milioni) esiste ma i 60 milioni sono finiti l'8/7/2026.
    tabella_intensita:
      - titolo: "Aliquote per attivita' nel 2026"
        colonne: ["Attivita'", "Aliquota 2026", "Tetto annuo per impresa", "Stato", "Su 100.000 euro di spese"]
        righe:
          - ["Ricerca e sviluppo (ricerca fondamentale, industriale, sviluppo sperimentale)", "10%", "5 milioni", "Attivo fino al 2031", "10.000 euro"]
          - ["R&S: giovani ricercatori e contratti con universita', enti di ricerca, startup innovative", "10% su una base al 150%", "5 milioni (insieme al resto)", "Attivo fino al 2031", "15.000 euro"]
          - ["Maggiorazione Mezzogiorno e sisma (art. 244 DL 34/2020)", "Non piu' prevista", "-", "Finita nel 2025 (era 25% grandi, 35% medie, 45% piccole)", "0 in piu'"]
          - ["Innovazione tecnologica", "Non piu' prevista", "-", "Finita nel 2025 (era 5%, max 2 milioni)", "0"]
          - ["Innovazione digitale 4.0 e green", "Non piu' prevista", "-", "Finita nel 2025 (era 5%, max 4 milioni)", "0"]
          - ["Design e ideazione estetica", "10%", "2 milioni", "Fondi 2026 (60 milioni) esauriti l'8/7/2026: domande in coda", "10.000 euro solo se arrivano altri fondi"]
        nota: >-
          Credito = 10% x (spese ammissibili, con giovani ricercatori e contratti con universita', enti di ricerca e
          startup innovative contati al 150%, meno i contributi ricevuti sulle stesse spese), piu' il costo della
          certificazione contabile fino a 5.000 euro per chi non e' obbligato alla revisione. Si usa in F24 in tre
          quote annuali dall'anno dopo. Fonte: pagina MIMIT del credito R&S, L. 160/2019 commi 200-205.
      - titolo: "Voci di spesa: come contano e con quali limiti"
        colonne: ["Voce", "Come entra nella base", "Limite", "Esempio"]
        righe:
          - ["Personale dipendente e collaboratori", "100% del costo delle ore in R&S", "Timesheet nominativi", "80.000 euro di ore in R&S = 8.000 di credito"]
          - ["Giovani ricercatori (under 35, primo impiego, dottorato o laurea magistrale tecnico-scientifica, tempo indeterminato, solo R&S)", "150% del costo", "Tutte le condizioni insieme", "40.000 euro contano 60.000 = 6.000 di credito invece di 4.000"]
          - ["Amministratori e soci", "Compenso fisso per la parte in R&S", "Max 50% del compenso fisso; variabili e utili esclusi", "Compenso 60.000: al massimo 30.000 in base = 3.000"]
          - ["Strumenti, attrezzature e software usati nel progetto", "Quota di ammortamento o canone dell'anno, per l'uso in R&S", "Max 30% delle spese di personale", "Strumento da 100.000 ammortizzato al 20%, usato a meta' in R&S: 10.000 in base = 1.000"]
          - ["Contratti con universita', enti di ricerca, startup innovative italiane", "150% del costo", "-", "30.000 euro contano 45.000 = 4.500"]
          - ["Contratti di ricerca con altre imprese", "100% del costo", "-", "30.000 euro = 3.000"]
          - ["Brevetti e privative acquistati da terzi", "Quote di ammortamento o licenza", "Max 1 milione; non dal gruppo", "-"]
          - ["Consulenze", "100%", "Max 20% delle spese di personale", "Personale 100.000: consulenze fino a 20.000"]
          - ["Materiali e forniture (prototipi, impianti pilota)", "100%", "Max 30% delle spese di personale", "Personale 100.000: materiali fino a 30.000"]
          - ["Certificazione contabile del revisore", "Si aggiunge al credito", "Max 5.000 euro, solo imprese non obbligate alla revisione", "Revisore da 3.000 = 3.000 di credito in piu'"]
        nota: >-
          I limiti al 30% e al 20% si calcolano sulle spese di personale della lettera a); se i contratti extra muros
          sono la voce principale, i materiali si misurano sul 30% dei contratti. Dalla base si tolgono i contributi
          ricevuti per le stesse spese (es. bando regionale). Macchinari di produzione, marketing e lavori di
          routine non entrano mai.
      - titolo: "Cosa cambia per dimensione e categoria"
        colonne: ["Impresa", "Aliquota 2026", "Regole particolari", "In pratica"]
        righe:
          - ["Micro e piccola", "10%", "Di solito non obbligata alla revisione: il costo della certificazione contabile si aggiunge al credito fino a 5.000 euro", "Sotto 30-50.000 euro di spese i costi di relazione, certificazione e rischio contestazione pesano molto"]
          - ["Media", "10%", "Nessuna", "Conviene la certificazione tecnica facoltativa sui progetti grandi"]
          - ["Grande", "10%", "Tetto 5 milioni l'anno (50 milioni di base)", "Unica dimensione per cui il tetto puo' contare"]
          - ["Imprese del Sud e delle aree sisma", "10%", "Maggiorazioni dell'art. 244 (25/35/45%) finite nel 2025", "Per le spese 2026 nessun vantaggio territoriale: valutare i bandi regionali R&S, che pero' riducono la base"]
          - ["Startup e imprese in perdita", "10%", "Credito usabile in F24 su contributi, ritenute e IVA anche senza imposte", "Utile da subito; i giovani ricercatori e i contratti con universita' valgono il 15%"]
          - ["Startup innovativa che fa ricerca per altri", "-", "Il committente conta il contratto al 150%", "Argomento commerciale: per il cliente il contratto vale il 15% di credito"]
          - ["Imprese agricole (anche a reddito agrario) e forfettari", "10%", "Ammesse (comma 199); spese contate per l'importo deducibile in via analitica", "Rara ma possibile, es. sperimentazione con un'universita'"]
          - ["Professionisti non in forma d'impresa", "Esclusi", "Il comma 199 riguarda solo le imprese", "Da verificare per societa' tra professionisti"]
          - ["Imprese in liquidazione, procedure concorsuali, sanzioni 231", "Escluse", "Comma 199", "-"]
        nota: >-
          Non e' un aiuto di Stato: nessun limite de minimis e stessa aliquota per tutti. Le differenze per
          dimensione e territorio valevano fino al 2025 (art. 244 DL 34/2020).
    beneficio_stimato:
      percentuale_min: 10
      percentuale_max: 15
      nota: >-
        10% delle spese di R&S ammissibili (non dell'intero investimento); 15% sulle spese per giovani ricercatori
        e sui contratti con universita', enti di ricerca e startup innovative, che contano al 150%. Credito
        d'imposta: vale anche se l'impresa e' in perdita, perche' si compensa con contributi e ritenute in F24, ed e'
        esente da imposte.
    come_si_ottiene: >-
      1) Comunicazione preventiva al MIMIT (art. 6 DL 39/2024) sulla piattaforma GSE con il modello MIMIT del
      24/4/2024, prima di usare il credito; 2) comunicazione consuntiva a fine periodo; 3) certificazione contabile
      delle spese da un revisore legale (obbligatoria per tutti; per le imprese non obbligate alla revisione il
      costo si aggiunge al credito fino a 5.000 euro); 4) relazione tecnica sul progetto, firmata dal responsabile
      R&S o da un esterno se la ricerca e' commissionata; 5) facoltativa la certificazione tecnica di un
      certificatore iscritto all'albo MIMIT (protegge da contestazioni sulla qualificazione: e' vincolante per
      l'Agenzia salvo attivita' diversa da quella svolta); 6) indicazione in dichiarazione (quadro RU) e utilizzo
      in F24 (codice tributo 6938) dal periodo successivo. Senza le comunicazioni la compensazione in F24 viene
      bloccata (ris. AdE 19/E/2024).
    tempi: >-
      Il credito si usa in compensazione dal periodo d'imposta successivo a quello delle spese, in tre quote
      annuali di pari importo (comma 204), dopo la certificazione contabile e le comunicazioni al MIMIT.
      Per spese 2026: un terzo nel 2027, uno nel 2028, uno nel 2029. Non si puo' cedere.
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Base di calcolo al netto delle sovvenzioni ricevute per le stesse spese (comma 203-bis); cumulabile
        con altre agevolazioni sugli stessi costi se il totale (anche considerando la non tassazione del
        credito) non supera il costo sostenuto (comma 204). Esempio: bando regionale al 50% su 100.000 euro
        di ricerca = base 50.000, credito 5.000. Non essendo un aiuto di Stato non consuma de minimis ne' i tetti
        GBER del bando, ma il bando puo' avere regole proprie sul cumulo: leggerle. Con l'iperammortamento 2026
        cumulabile se non coprono le stesse quote di costo (quota di un bene iperammortizzato usato nel progetto:
        da verificare caso per caso). Con il patent box (110%) puo' convivere sulle stesse spese nel limite del
        costo (norma ora nel nuovo TUIR D.Lgs. 117/2026: riferimento da verificare con il commercialista).
      riferimento: "L. 160/2019 art. 1 commi 203-bis e 204"
    attenzione: >-
      Rischio principale: contestazione della natura di R&S da parte dell'Agenzia (recupero con
      interessi e sanzioni); conviene la certificazione tecnica. Comunicazioni al MIMIT obbligatorie
      dal 2024: senza, il credito non si usa. Documentazione di progetto, timesheet del personale,
      certificazione contabile. La maggiorazione al 150% per i giovani vale solo se ci sono tutte le condizioni
      (under 35, primo impiego, titolo, tempo indeterminato, impiego esclusivo in R&S): un ricercatore che fa anche
      altro conta al 100%. Con debiti a ruolo scaduti oltre la soglia di legge (100.000 euro fino al 2025, 50.000
      dal 2026 secondo L. 199/2025 comma 116: da verificare sul testo) la compensazione dei crediti agevolativi e'
      bloccata (circ. AdE 16/E/2024). Questa voce copre solo la R&S. Il credito innovazione tecnologica
      (anche 4.0 e green) era al 5% nel 2024-2025 e non e' stato prorogato per il 2026. Il credito
      design e ideazione estetica per il 2026 esiste (L. 199/2025 art. 1 commi 925-926: 10%, max 2
      milioni per impresa, utilizzo in una sola quota annuale, tetto complessivo 60 milioni con
      prenotazione sulla piattaforma MIMIT dal 07/07/2026), ma i 60 milioni sono finiti in 24 ore
      (comunicazione MIMIT dell'08/07/2026): le nuove prenotazioni restano in coda solo per un eventuale
      scorrimento se arrivano altri fondi. Per questo non e' una voce separata "aperta".
    esempi:
      - profilo: startup
        interesse: alto
        esempio: >-
          Cinque sviluppatori che lavorano a un software con una vera incertezza tecnologica (non la semplice
          personalizzazione): 250.000 euro di costo del personale in un anno. Credito del 10% = 25.000 euro,
          da usare in F24 per pagare contributi e ritenute anche se l'impresa e' in perdita. Se due di loro (90.000
          euro) sono under 35 al primo impiego, con laurea magistrale tecnico-scientifica o dottorato, assunti a
          tempo indeterminato e solo in R&S, contano al 150%: credito 29.500 euro. Servono comunicazioni al MIMIT,
          certificazione contabile, relazione tecnica e timesheet; la certificazione tecnica facoltativa protegge
          dalle contestazioni.
      - profilo: manifattura
        interesse: medio
        esempio: >-
          Ufficio tecnico con tre ingegneri dedicati per meta' del tempo a un prodotto nuovo (120.000 euro) piu'
          materiali per i prototipi (30.000 euro): 150.000 euro di spese, credito di 15.000 euro in F24 (5.000
          l'anno per tre anni). Con un contratto di prove con un'universita' da 40.000 euro (conta 60.000) il credito
          sale a 21.000. Non valgono i macchinari della produzione ne' le normali migliorie di processo. La base va
          calcolata al netto di eventuali contributi dei bandi sulle stesse spese.
      - profilo: artigiano
        interesse: basso
        esempio: >-
          Solo se sviluppa davvero un prodotto nuovo con incertezza tecnica, per esempio un prototipo con un
          laboratorio universitario per 40.000 euro: il contratto conta al 150%, credito di 6.000 euro, piu' il
          costo del revisore fino a 5.000 euro. Relazione tecnica e rischio di contestazione pesano sui progetti
          piccoli: da valutare caso per caso.
      - profilo: logistica
        interesse: basso
        esempio: >-
          Sviluppare con un'universita' un algoritmo nuovo di ottimizzazione dei percorsi (contratto di ricerca da
          80.000 euro, conta 120.000) vale 12.000 euro di credito. Comprare o configurare un software di mercato non
          e' ricerca e sviluppo.
      - profilo: agricola
        interesse: basso
        esempio: >-
          Sperimentazione con un'universita' su nuove varieta' o tecniche di trasformazione (50.000 euro, conta
          75.000): credito di 7.500 euro. L'acquisto di macchine e impianti non conta. Ammesse anche le imprese
          agricole a reddito agrario (comma 199).
      - profilo: ufficio_servizi
        interesse: basso
        esempio: >-
          Uno studio o un'agenzia di servizi fa raramente ricerca e sviluppo nel senso della norma (nuove
          conoscenze, incertezza tecnica). Se sviluppa una piattaforma propria davvero nuova con due persone dedicate
          (60.000 euro), il credito e' di 6.000 euro, da confrontare con il costo di certificazione e relazione. Un
          professionista che non e' un'impresa non accede.
      - profilo: negozio
        interesse: nullo
        esempio: >-
          Un negozio non fa ricerca e sviluppo nel senso della norma: allestimenti, gestionali e siti web non contano.
      - profilo: ristorazione_ricettivo
        interesse: nullo
        esempio: >-
          Un bar, un ristorante o un hotel di norma non fa ricerca e sviluppo ammissibile: nuovi menu,
          ristrutturazioni e software di prenotazione non contano.
    fiscale: >-
      Il credito non concorre al reddito (IRES/IRPEF) ne' alla base IRAP (comma 204): in dichiarazione si fa una
      variazione in diminuzione; le spese che lo generano restano deducibili. Non rileva per gli artt. 61 e 109
      c. 5 TUIR (interessi passivi e costi generali). Nessun limite annuo alle compensazioni (ne' 250.000 euro dei
      crediti agevolativi ne' tetto generale). Esempio: se fosse tassato (IRES 24% + IRAP 3,9%), su 31.000 euro di
      credito se ne perderebbero circa 8.600.
    fonte_verificata_il: "2026-10-09"
  - id: credito_zes_unica_2026
    nome: "Credito d'imposta ZES unica (investimenti nel Mezzogiorno e in Marche, Umbria, Abruzzo)"
    aggiunta_il: 2026-10-05
    tipo: credito_imposta
    ente: "Agenzia delle Entrate (comunicazioni e utilizzo); Struttura di missione ZES"
    norma: >-
      Legge 30 dicembre 2025 n. 199, art. 1, commi 438-443 (anni 2026-2028); disciplina di base
      art. 16 DL 124/2023 (agricoltura primaria, pesca e acquacoltura: credito separato art. 16-bis);
      L. 18 novembre 2025 n. 171, art. 1 (zone assistite di Marche e Umbria nella ZES unica);
      decreto attuativo 17 maggio 2024; Provvedimento Agenzia delle Entrate 30 gennaio 2026 n. 3882 (modelli e
      istruzioni, con la tabella delle intensita' e l'allegato 1 dei comuni ammessi); risposte AdE 32/2026
      (leasing in costruendo) e 169/2026 (effetto di incentivazione). Aiuto di Stato a finalita' regionale (Reg. UE
      651/2014, GBER, art. 14) secondo la Carta degli aiuti regionali 2022-2027, modificata da ultimo il 3/10/2024.
    url_ufficiale: "https://www.agenziaentrate.gov.it/portale/credito-d-imposta-per-investimenti-nella-zes-unica-zes-2026-/che-cos-"
    in_vigore_dal: "2026-01-01"
    in_vigore_fino_al: "2028-12-31"
    stato: aperto
    sintesi: >-
      Le imprese che investono almeno 200.000 euro (costo complessivo del progetto) in macchinari, impianti,
      attrezzature nuovi e immobili strumentali in una struttura produttiva in Basilicata, Calabria, Campania,
      Molise, Puglia, Sardegna, Sicilia o nei comuni ammessi di Abruzzo, Marche e Umbria ricevono un credito
      d'imposta pari a una percentuale del costo che dipende da zona e dimensione: 60% per le piccole (micro
      comprese), 50% per le medie, 40% per le grandi in Campania, Puglia, Calabria e Sicilia; 50/40/30% in
      Basilicata, Molise e Sardegna; 70/60/50% nella provincia di Taranto; 35/25/15% nei comuni ammessi di
      Abruzzo, Marche e Umbria. Il credito richiesto viene poi ridotto in proporzione se le richieste superano le
      risorse (per il 2025 e' stato pagato il 75%). Esempio: piccola impresa in Campania, 1 milione di
      macchinari: 600.000 euro teorici, circa 450.000 con un riparto come quello del 2025. Il software non conta.
      Si chiede ogni anno in una finestra precisa (31 marzo - 30 maggio): quella del 2026 e' chiusa, la prossima
      e' nel 2027.
    a_chi_si_rivolge: >-
      Imprese di ogni dimensione, forma giuridica e regime contabile, gia' operative o che si insediano
      nella ZES unica, con struttura produttiva nelle regioni indicate (anche con sede altrove). Basilicata,
      Calabria, Campania, Molise, Puglia, Sardegna e Sicilia sono "zone a" (tutto il territorio); in Abruzzo,
      Marche e Umbria valgono solo i comuni della Carta degli aiuti regionali elencati nell'allegato 1 delle
      istruzioni AdE (zone c; Marche e Umbria dal 2026 con la L. 171/2025): per esempio Jesi, Fabriano,
      Macerata, Ascoli Piceno, Fermo, Foligno, Spoleto, Terni (solo alcune sezioni), Chieti, Vasto, Teramo,
      Avezzano, Sulmona.

      Requisiti (dichiarazione nel modello): iscrizione al Registro delle imprese, partita IVA attiva; codice
      ATECO e comune della struttura uguali a quelli in Anagrafe tributaria (altrimenti la comunicazione e'
      scartata); non in liquidazione, scioglimento o difficolta' (art. 2 punto 18 GBER); DURC regolare; nessun
      aiuto illegale da restituire; nessuna delocalizzazione verso lo stabilimento nei 2 anni prima e impegno a non
      farla nei 2 anni dopo.

      Distinzioni per dimensione: micro e piccole hanno la stessa intensita'; le medie 10 punti in meno; le grandi
      20 punti in meno. Nelle zone c (Abruzzo, Marche, Umbria) le grandi imprese possono avere il credito solo per
      una NUOVA attivita' economica (nuovo stabilimento o diversificazione in un'attivita' diversa), non per
      ampliare quella che gia' fanno. Nelle zone a una grande impresa che cambia in modo fondamentale il processo di
      uno stabilimento esistente deve investire piu' degli ammortamenti dei beni da modernizzare nei tre anni
      precedenti; per tutti, la diversificazione di uno stabilimento esistente richiede costi superiori al 200% del
      valore contabile dei beni riutilizzati.
    soggetti_ammessi: [impresa]
    dimensioni_ammesse: []
    settori_esclusi: >-
      Esclusi (art. 16 DL 124/2023 e istruzioni AdE): siderurgia, carbone e lignite, trasporti e relative
      infrastrutture (ma magazzinaggio e attivita' di supporto ai trasporti sono ammessi, e il noleggio di unita'
      da diporto e' ammesso con il codice "casi particolari" 1), produzione, stoccaggio, trasmissione e
      distribuzione di energia e relative infrastrutture, banda larga, settori creditizio, finanziario e
      assicurativo; imprese in liquidazione, scioglimento o difficolta'. Produzione agricola primaria, pesca e
      acquacoltura: credito ZES separato (art. 16-bis DL 124/2023, modificato dalla L. 199/2025 comma 462, altro
      modello); la trasformazione e commercializzazione di prodotti agricoli usa questo modello (codice "casi
      particolari" 2).
    investimenti_ammessi: >-
      Acquisto (anche in leasing) di macchinari, impianti e attrezzature nuovi destinati a strutture
      produttive nella ZES; acquisto di terreni e acquisto, costruzione o ampliamento di immobili
      strumentali (anche usati, anche con leasing in costruendo: risposta AdE 32/2026), che valgono al massimo il
      50% dell'investimento agevolato (in pratica l'immobile conta al massimo quanto i beni strumentali; risposta
      AdE 183/2025: un progetto di solo immobile non e' agevolabile). Solo "investimento iniziale" (nuovo
      stabilimento, ampliamento della capacita', diversificazione verso prodotti nuovi, cambiamento fondamentale
      del processo), non la semplice sostituzione. Soglia di 200.000 euro sul costo complessivo del progetto
      (comprese le spese non ammesse), credito calcolato su massimo 100 milioni per progetto. Spese dal 1/1/2026 al
      31/12/2026 per il credito 2026 (l'investimento si considera fatto alla consegna del bene, anche in leasing;
      per il leasing conta il costo del locatore senza manutenzione). IVA solo se indetraibile. Non ammessi:
      software (licenze, cloud/SaaS, gestionali, MES, CAD, cybersecurity, IA), beni usati (salvo immobili),
      materiali di consumo e merci, beni destinati alla vendita, beni da societa' collegate o fuori mercato,
      manutenzioni. L'hardware (server, sensori, robot) puo' rientrare come attrezzatura; il software di
      controllo compreso nel prezzo della macchina in genere la segue (se fatturato a parte: da verificare).
    # Regioni della ZES unica: la misura compare solo per bandi e imprese di queste regioni.
    regioni: [ABR, BAS, CAL, CAM, MAR, MOL, PUG, SAR, SIC, UMB]
    categorie_spesa: [macchinari_attrezzature, opere_edili_impianti]
    intensita: >-
      LA FORMULA. Credito = (costo ammesso del progetto x intensita' massima della zona per la dimensione
      dell'impresa - altri aiuti di Stato o de minimis sugli stessi beni) x percentuale di riparto fissata
      dall'Agenzia. Il costo ammesso e' quello dei beni agevolabili (immobili al massimo per meta'), fino a 100
      milioni per progetto.

      LE INTENSITA' (tabella delle istruzioni AdE, Carta degli aiuti regionali 2022-2027), piccola/media/grande
      impresa, progetti fino a 50 milioni: Campania, Puglia, Calabria, Sicilia 60/50/40%; Basilicata, Sardegna,
      Molise 50/40/30%; provincia di Taranto 70/60/50% e 23 comuni del Sulcis-Iglesiente 60/50/40% (territori del
      Fondo per una transizione giusta); comuni ammessi di Abruzzo, Marche, Umbria 35/25/15%. Le micro hanno la
      stessa intensita' delle piccole. +10 punti nelle zone a e +5 nelle zone c per investimenti STEP (tecnologie
      critiche, Reg. UE 2024/795).

      GRANDI PROGETTI (costi ammissibili oltre 50 milioni): niente maggiorazione per le PMI, tutti hanno
      l'intensita' delle grandi imprese, e l'aiuto si calcola con l'"importo corretto" = R x (A + 0,50 x B), dove R e'
      l'intensita' delle grandi imprese della zona, A i primi 55 milioni di costi, B la parte tra 55 e 100 milioni.
      Esempio: 80 milioni in Campania = 40% x (55 + 0,5 x 25) = 27 milioni teorici (invece di 32).

      IL RIPARTO. Le risorse sono fisse: 2,3 miliardi per il 2026 (pagina AdE); per il 2027 1 miliardo e per il
      2028 750 milioni (comma 438, letto su fonte secondaria: da verificare sul testo). Se le richieste superano le
      risorse, l'Agenzia fissa una percentuale uguale per tutti. Per il 2025 e' stata il 60,3811%, portata al 75%
      con il contributo aggiuntivo del 14,6189% della Legge di bilancio 2026. Percentuale 2026 non ancora
      pubblicata (09/10/2026): arriva entro dieci giorni dalla scadenza delle integrative (17/1/2027), cioe' a fine
      gennaio 2027 (comma 441). Con risorse 2027 meno della meta' del 2026, il riparto 2027 potrebbe essere molto
      piu' basso.

      ESEMPI (piccola impresa in Campania, ipotesi di riparto 75% come nel 2025): 200.000 euro di investimento =
      120.000 teorici, circa 90.000 effettivi; 1 milione = 600.000, circa 450.000; 10 milioni = 6 milioni, circa
      4,5 milioni. Con un riparto pari al 60,38% (quello iniziale del 2025) gli stessi esempi danno circa 72.500,
      362.000 e 3,6 milioni.
    tabella_intensita:
