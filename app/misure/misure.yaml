# Misure nazionali "automatiche" o a sportello permanente, separate dai bandi.
# Si cumulano (nei limiti indicati) con i bandi a fondo perduto.
# Ricerca e fonti: docs/ricerche/2026-10-05_misure_nazionali.md
# Regola: dove un dato non e' stato verificato su fonte ufficiale c'e' scritto "da verificare".
# beneficio_stimato: percentuale del costo dell'investimento (o della spesa agevolata) che torna
# all'impresa, stima prudente, prima di eventuali cumuli.
# esempi (06/10/2026, richiesta di Matteo): per ogni misura aperta, un caso pratico per ciascun profilo tipo
# di profili_esempio, con l'interesse (alto, medio, basso, nullo). Numeri indicativi calcolati con le regole
# della misura scritte qui sotto; dove un dettaglio non e' certo c'e' scritto "da verificare".
# aggiunta_il (07/10/2026): quando la misura e' entrata in bandinQiaro. Le misure aperte aggiunte da poco compaiono una
# volta nell'email del lunedi' delle imprese a cui sono adatte (app/notifiche/email_imprese.py).
# fiscale (07/10/2026, revisione degli articoli del blog): per ogni misura aperta, in breve, come si tassa il
# beneficio ai fini IRES/IRPEF/IRAP, con le fonti citate negli articoli rivisti; "da verificare" dove non e' chiarito.

profili_esempio:
  - id: ufficio_servizi
    nome: "Studio o ufficio di servizi"
    descrizione: >-
      5-15 addetti, una sede (ufficio di 200-300 m2), consumi di energia modesti: riscaldamento,
      condizionamento, computer. Es. agenzia, studio tecnico, societa' di consulenza.
  - id: negozio
    nome: "Negozio, commercio al dettaglio"
    descrizione: >-
      2-8 addetti, uno o due punti vendita di 100-300 m2 con vetrine, illuminazione e climatizzazione;
      spesso in affitto.
  - id: ristorazione_ricettivo
    nome: "Bar, ristorante, hotel"
    descrizione: >-
      10-40 addetti, una struttura con cucina, molta acqua calda e climatizzazione tutto l'anno:
      consumi termici alti.
  - id: artigiano
    nome: "Artigiano, laboratorio"
    descrizione: >-
      3-10 addetti, un laboratorio di 300-600 m2 con macchine e un ambiente da scaldare;
      spesso ditta individuale o snc.
  - id: manifattura
    nome: "Manifattura PMI con capannone"
    descrizione: >-
      50-150 addetti (media impresa), un capannone di 3.000-8.000 m2 da riscaldare e raffrescare,
      linee produttive; societa' di capitali in utile.
  - id: logistica
    nome: "Logistica e trasporti con piu' sedi"
    descrizione: >-
      30-200 addetti, 4-10 magazzini o depositi in province diverse, coperture grandi, luci accese a lungo,
      mezzi di movimentazione e spesso una flotta.
  - id: agricola
    nome: "Azienda agricola o agroalimentare"
    descrizione: >-
      5-20 addetti, terreni, serre o celle frigo, a volte trasformazione (cantina, caseificio, frantoio);
      spesso reddito agrario da catasto, non da bilancio.
  - id: startup
    nome: "Startup innovativa, impresa digitale"
    descrizione: >-
      3-15 addetti, uffici in affitto o coworking, pochi beni materiali, spese soprattutto in persone e
      software; nei primi anni spesso in perdita.

misure:

  - id: conto_termico_3
    nome: "Conto Termico 3.0"
    aggiunta_il: 2026-10-05
    tipo: contributo_conto_capitale
    ente: "GSE (Gestore dei Servizi Energetici), per conto del MASE"
    norma: >-
      DM MASE 7 agosto 2025 (GU 26/09/2025, in vigore dal 25/12/2025), in particolare art. 11 (calcolo e rate),
      art. 17 (cumulo), Allegato 2 (algoritmi, costi massimi e incentivi massimi per intervento) e Titolo V
      artt. 24-28 (imprese; art. 25 requisiti, art. 26 spese, art. 27 intensita' e cumulo, art. 28 limiti di spesa);
      Regole Applicative GSE approvate il 19/12/2025 (par. 4.2.1 e cap. 9). Per le imprese e' un aiuto in esenzione
      GBER (Reg. UE 651/2014 artt. 38-bis e 41), non de minimis.
    url_ufficiale: "https://www.gse.it/servizi-per-te/efficienza-energetica/conto-termico-3-0"
    in_vigore_dal: "2025-12-25"
    in_vigore_fino_al: null
    stato: aperto
    sintesi: >-
      Contributo a fondo perduto del GSE per lavori di efficienza energetica sugli edifici
      (cappotto, infissi, illuminazione LED, building automation, fotovoltaico o colonnine
      solo insieme a una pompa di calore) e per impianti termici a fonti rinnovabili
      (pompe di calore elettriche, biomassa, solare termico, scaldacqua a pompa di calore).
      Per le imprese la legge fissa un massimo dal 25% al 65% della spesa ammessa secondo dimensione, zona e tipo
      di lavoro, ma il GSE paga il valore piu' basso tra questa percentuale e il calcolo previsto per ogni
      intervento (per LED, building automation e schermature al massimo il 40%; per pompe di calore, biomassa e
      solare termico conta l'energia prodotta): nei casi tipici torna il 30-55% della spesa. Pagato dopo la fine
      dei lavori, in una rata se fino a 15.000 euro, altrimenti in 2 o 5 rate annuali.
    a_chi_si_rivolge: >-
      Imprese di ogni dimensione (anche agricole, forestali, artigiani e ditte individuali: per il decreto e'
      impresa chiunque svolga un'attivita' economica, art. 2 lett. s, quindi anche il professionista con partita IVA)
      e Enti del Terzo Settore che svolgono attivita' economica, che hanno la disponibilita' dell'edificio;
      Pubbliche amministrazioni ed Enti del Terzo Settore non economici; privati per alcuni interventi.
      La dimensione (micro, piccola, media, grande) si calcola con la definizione UE (Raccomandazione 2003/361/CE e
      DM 18/4/2005) contando le imprese associate e collegate, e si autodichiara nella domanda.

      Per le imprese: interventi di efficienza (Titolo II) solo su edifici dell'ambito terziario
      (tabella 6 delle Regole Applicative: A/10, gruppi B, C esclusi C/6-C/7, D escluso D/9, E esclusi E/2, E/4, E/6),
      quindi negozi (C/1), laboratori (C/3), uffici (A/10), alberghi (D/2), capannoni (D/1, D/7, D/8);
      impianti rinnovabili (Titolo III) anche su edifici residenziali. Disponibilita' dell'edificio: proprieta' o altro
      diritto reale o personale di godimento, anche l'affitto, con l'autorizzazione del proprietario (Modello 18 GSE).
      Edificio esistente e accatastato (per le serre non accatastate basta il codice CUAA dell'azienda agricola).
    soggetti_ammessi: [impresa, libero_professionista, ente_terzo_settore, ente_pubblico, persona_fisica]
    dimensioni_ammesse: []
    settori_esclusi: >-
      Nessun settore escluso in quanto tale. Esclusi: imprese in difficolta', imprese con ordine di
      recupero di aiuti illegali pendente, cause di esclusione artt. 94-95 D.Lgs. 36/2023 e art. 67
      D.Lgs. 159/2011. Per imprese ed ETS economici non sono ammessi apparecchi alimentati a
      combustibili fossili, incluso il gas naturale: niente pompe di calore a gas e niente sistemi ibridi con
      caldaia o pompa di calore a gas (Regole Applicative par. 8, art. 25 c. 2).
    investimenti_ammessi: >-
      Titolo II (efficienza energetica, edifici esistenti): II.A isolamento superfici opache (coperture,
      pavimenti, pareti); II.B sostituzione infissi (con termoregolazione o valvole termostatiche); II.C schermature
      solari; II.D trasformazione in edificio a energia quasi zero (nZEB); II.E illuminazione efficiente interna e
      pertinenze; II.F building automation e termoregolazione; II.G colonnine di ricarica insieme a pompa di calore
      elettrica; II.H fotovoltaico e accumulo insieme a pompa di calore elettrica.
      Titolo III (rinnovabili termiche, fino a 2.000 kW): III.A pompe di calore elettriche; III.B sistemi ibridi
      (per le imprese solo senza gas); III.C generatori a biomassa (anche serre e calore di processo); III.D solare
      termico (fino a 2.500 m2, anche per calore di processo e solar cooling); III.E scaldacqua a pompa di calore;
      III.F allaccio a teleriscaldamento efficiente; III.G microcogenerazione da rinnovabili.
      Il Titolo III incentiva la sostituzione dell'impianto di riscaldamento esistente; solo le aziende agricole e
      forestali possono avere anche la nuova installazione di generatori a biomassa (Regole par. 9.11; per le serre
      si puo' tenere il vecchio generatore a gasolio come riserva, con misura della produzione rinnovabile).

      Requisito per le imprese, solo per il Titolo II (art. 25; Regole par. 8): riduzione del fabbisogno di energia
      primaria di almeno il 10% con un intervento singolo, del 20% con un multi-intervento (due o piu' interventi del
      Titolo II insieme, oppure II.D, II.G, II.H), da dimostrare con APE prima e dopo i lavori. Una pompa di calore
      piu' un cappotto non e' un multi-intervento: e' un intervento singolo del Titolo II piu' uno del Titolo III.
      Spese ammesse: fornitura, posa, opere accessorie necessarie (massetti, intonaci, tinteggiature), adeguamenti
      degli impianti, prestazioni professionali e, per le PMI, diagnosi energetica e APE (art. 26). Software: solo
      come parte di un sistema di building automation II.F fornito e installato (BACS almeno in classe B
      UNI EN ISO 52120-1, costo massimo 60 euro/m2); gestionali, licenze, cloud/SaaS, cybersecurity e IA non sono
      ammessi. Non ammessi: IVA (Regole par. 4.2.1), costi non legati al miglioramento energetico, la parte oltre i
      costi massimi unitari.
    categorie_spesa: [energia_efficienza, opere_edili_impianti]
    intensita: >-
      COME SI CALCOLA PER UN'IMPRESA. Il GSE fa due conti e paga il piu' basso (Regole Applicative cap. 9 e par.
      4.2.1; webinar GSE del 3/2/2026, esempio "impresa"): (1) l'algoritmo dell'Allegato 2 per quel tipo di
      intervento, con i costi massimi unitari e l'incentivo massimo; (2) il tetto del Titolo V per le imprese, cioe'
      la percentuale dell'art. 27 per dimensione e zona applicata alla spesa ammessa, IVA esclusa. In nessun caso
      oltre il 65% della spesa.

      TETTO DEL TITOLO V (art. 27). Titolo II: base 25% per intervento singolo, 30% per multi-intervento; +20 punti
      piccole imprese (micro comprese), +10 medie; +15 zone assistite art. 107.3.a TFUE (Campania, Puglia,
      Basilicata, Calabria, Sicilia, Sardegna, Molise), +5 zone 107.3.c; +15 se la prestazione energetica migliora
      di almeno il 40%. Massimo 65% piccole e medie, 60% grandi. Per II.D, II.G e II.H il massimo e' il 30% (nota 6
      delle Regole; se si sommino le maggiorazioni: da verificare con il GSE). Titolo III: 45%, +20 piccole, +10
      medie, nessuna maggiorazione per zona o risparmio: 65% piccole, 55% medie, 45% grandi.

      ALGORITMI. Titolo II: incentivo = percentuale x costo al m2 (al massimo il costo massimo) x m2, entro
      l'incentivo massimo. La percentuale dell'algoritmo e' 40% per cappotto, infissi, schermature, LED e building
      automation; 50% per il cappotto nelle zone climatiche E ed F; 55% per cappotto (e infissi insieme al cappotto)
      se si fa anche una pompa di calore, un generatore a biomassa o uno scaldacqua a pompa di calore; 65% per
      l'nZEB; 30% colonnine; 20% fotovoltaico e accumulo (+5, +10 o +15 punti con moduli del registro ENEA), e per
      questi ultimi due mai piu' dell'incentivo della pompa di calore abbinata. Titolo III: conta l'energia
      prodotta. Pompa di calore: incentivo annuo = potenza (kW) x ore della zona climatica (A 600, B 850, C 1.100,
      D 1.400, E 1.700, F 1.800) x (1 - 1/SCOP) x kp (efficienza stagionale / minima di legge) x Ci (0,15 euro/kWh
      per aria/acqua e VRF fino a 35 kW, 0,06 oltre; 0,16 e 0,06 per geotermiche e ad acqua; 0,07 per split fino a
      12 kW), per 2 anni fino a 35 kW e 5 anni oltre. Caldaia a biomassa: potenza x ore zona x Ci (0,060 fino a 35
      kW, 0,025 fino a 500, 0,020 oltre) x Ce (1, 1,2 o 1,5 secondo le polveri), per 2 o 5 anni. Solare termico:
      energia annua per m2 da certificato Solar Keymark x m2 x Ci (da 0,35 a 0,11 euro/kWh scendendo con la
      superficie), per 2 anni fino a 50 m2 e 5 oltre. Scaldacqua a pompa di calore: 40% fino a 500-1.500 euro.
      Maggiorazione del 10% dell'incentivo con componenti principali prodotti nell'UE (Allegato 4), sempre entro i
      tetti.

      ESEMPIO DI CALCOLO. Piccola impresa al Nord (zona E), pompa di calore aria/acqua da 40 kW che costa 30.000
      euro, SCOP 4 e efficienza 150% contro un minimo di 110% (kp 1,36): 40 x 1.700 x 0,75 x 1,36 x 0,06 = circa
      4.170 euro l'anno per 5 anni = 20.860 euro; tetto Titolo V 65% x 30.000 = 19.500 euro; il GSE paga 19.500.
      Con le stesse ipotesi una pompa di calore vale circa 520 euro per kW in zona E, 430 in zona D, 340 in zona C:
      spesso sotto il tetto del 65%. Cappotto della stessa impresa, 400 m2 per 40.000 euro (100 euro/m2, sotto i
      300 di costo massimo): algoritmo 55% (c'e' la pompa di calore), tetto 45% (piccola, intervento singolo):
      18.000 euro. Totale 37.500 euro su 70.000 (54%), in 5 rate annuali.

      LIMITI DI SPESA. Titolo V: 150 milioni di euro l'anno per tutte le imprese, 30 milioni per impresa e
      intervento (art. 28). Budget annuo complessivo 900 milioni (500 privati, di cui 150 imprese; 400 PA).
    tabella_intensita:
      - titolo: "Percentuale massima per le imprese (tetto del Titolo V, art. 27)"
        colonne: ["Tipo di intervento e zona", "Piccola (micro compresa)", "Media", "Grande", "Su 100.000 euro di spesa (piccola / media / grande)"]
        righe:
          - ["Titolo II, intervento singolo, Centro-Nord", "45%", "35%", "25%", "45.000 / 35.000 / 25.000 euro"]
          - ["Titolo II, multi-intervento (2+ interventi del Titolo II), Centro-Nord", "50%", "40%", "30%", "50.000 / 40.000 / 30.000 euro"]
          - ["Titolo II con risparmio di energia primaria >= 40%, multi-intervento, Centro-Nord", "65%", "55%", "45%", "65.000 / 55.000 / 45.000 euro"]
          - ["Titolo II, intervento singolo, zona assistita a (Sud e isole, Molise)", "60%", "50%", "40%", "60.000 / 50.000 / 40.000 euro"]
          - ["Titolo II, multi-intervento, zona assistita a", "65%", "55%", "45%", "65.000 / 55.000 / 45.000 euro"]
          - ["Titolo II, zona assistita c (comuni elencati nella Carta degli aiuti)", "+5 punti", "+5 punti", "+5 punti", "es. singolo 50.000 / 40.000 / 30.000 euro"]
          - ["Titolo II: nZEB, colonnine, fotovoltaico con pompa di calore", "30%", "30%", "30%", "30.000 euro (maggiorazioni da verificare)"]
          - ["Titolo III (pompe di calore, biomassa, solare termico, scaldacqua)", "65%", "55%", "45%", "65.000 / 55.000 / 45.000 euro, se l'algoritmo arriva fin li'"]
        nota: >-
          E' il massimo, non quanto si incassa: il GSE paga il piu' basso tra questa percentuale e l'algoritmo
          dell'intervento (tabella sotto). Per LED, building automation e schermature l'algoritmo si ferma al 40%,
          quindi una piccola impresa al Sud non prende il 60% ma il 40%. Tetto assoluto 65% (60% grandi imprese sul
          Titolo II). Spesa ammessa IVA esclusa ed entro i costi massimi unitari. Zone c: elenco dei comuni nella
          Carta italiana degli aiuti a finalita' regionale 2022-2027, da controllare comune per comune.
      - titolo: "Algoritmo, costi massimi e incentivo massimo per intervento (Allegato 2)"
        colonne: ["Intervento", "Quota dell'algoritmo", "Costo massimo ammesso", "Incentivo massimo", "Rate se oltre 15.000 euro"]
        righe:
          - ["II.A Cappotto coperture", "40% (50% zone E-F; 55% con pompa di calore, biomassa o scaldacqua PdC)", "300 euro/m2 esterno, 150 interno, 350 ventilata", "1.000.000 euro (coperture + pavimenti + pareti)", "5"]
          - ["II.A Pavimenti e pareti", "come sopra", "Pavimenti 170 esterno, 150 interno; pareti 200 esterno, 100 interno, 250 ventilata (euro/m2)", "compreso nel milione", "5"]
          - ["II.B Infissi", "40% (55% insieme a cappotto e intervento del Titolo III)", "700 euro/m2 zone A-C, 800 zone D-F", "500.000 euro", "5"]
          - ["II.C Schermature solari", "40%", "250 euro/m2 (automazione 50; pellicole 130 o 80)", "90.000 euro (10.000; 30.000)", "5"]
          - ["II.D Edificio nZEB", "65%", "1.000 euro/m2 zone A-C, 1.300 D-F", "2.500.000 / 3.000.000 euro", "5"]
          - ["II.E Illuminazione", "40%", "35 euro/m2 LED, 15 altre lampade efficienti", "140.000 euro LED, 50.000 altre", "5"]
          - ["II.F Building automation", "40%", "60 euro/m2", "100.000 euro", "5"]
          - ["II.G Colonnine (con pompa di calore)", "30%", "2.400 euro per punto monofase, 8.400 trifase; 1.200 euro/kW 22-50 kW; 60.000 o 110.000 euro oltre", "non oltre l'incentivo della pompa di calore", "2 o 5 come la pompa"]
          - ["II.H Fotovoltaico e accumulo (con pompa di calore)", "20% (+5/10/15 moduli registro ENEA)", "1.500 euro/kW fino a 20 kW, 1.200 fino a 200, 1.100 fino a 600, 1.050 fino a 1.000; accumulo 1.000 euro/kWh", "non oltre l'incentivo della pompa di calore", "2 o 5 come la pompa"]
          - ["III.A Pompa di calore elettrica", "Energia prodotta x 0,15 euro/kWh fino a 35 kW, 0,06 oltre (aria/acqua)", "-", "tetto del Titolo V", "2 fino a 35 kW, 5 oltre"]
          - ["III.C Caldaia a biomassa", "Potenza x ore zona x 0,060 / 0,025 / 0,020 euro/kWh x 1-1,5", "-", "tetto del Titolo V", "2 fino a 35 kW, 5 oltre"]
          - ["III.D Solare termico", "Energia da certificato x 0,35-0,11 euro/kWh", "-", "tetto del Titolo V", "2 fino a 50 m2, 5 oltre"]
          - ["III.E Scaldacqua a pompa di calore", "40%", "-", "500-1.500 euro secondo classe e litri", "2"]
          - ["III.F Allaccio a teleriscaldamento", "65%", "200 euro/kW fino a 50 kW, 160 fino a 150, 130 oltre", "6.500 / 15.000 / 30.000 euro", "-"]
          - ["III.G Microcogenerazione rinnovabile", "65%", "5.000 euro/kWe", "100.000 euro", "-"]
        nota: >-
          Fonte: Regole Applicative GSE cap. 9 (tabelle 15-39, riprese dall'Allegato 2 del DM 7/8/2025). Per
          un'impresa l'incentivo di ogni riga e' poi limitato dalla percentuale della tabella precedente. Con piu'
          interventi le rate sono quelle dell'intervento piu' lungo; fino a 15.000 euro in tutto, rata unica. Le
          diagnosi e gli APE obbligatori sono rimborsati a parte e non contano nell'incentivo massimo.
      - titolo: "Cosa cambia per dimensione, zona e settore"
        colonne: ["Caso", "Regola", "In pratica"]
        righe:
          - ["Micro e piccola impresa", "Titolo II 45-65%, Titolo III 65%", "Pompe di calore quasi sempre all'algoritmo pieno; LED e building automation al 40%"]
          - ["Media impresa", "Titolo II 35-65%, Titolo III 55%", "Cappotto al Nord: 35% da solo, 40% in multi-intervento, 55% se risparmia il 40% di energia primaria e fa anche una pompa di calore"]
          - ["Grande impresa", "Titolo II 25-60%, Titolo III 45%", "Niente rimborso di diagnosi e APE; spesso conviene confrontare con iperammortamento o Ecobonus"]
          - ["Sud e isole (zona a)", "+15 punti solo sul Titolo II", "Utile per il cappotto (piccola: 40%, 55% se insieme a una pompa di calore); nessun vantaggio su LED (40%) e sul Titolo III"]
          - ["Zona c", "+5 punti solo sul Titolo II", "Verificare il comune nella Carta degli aiuti 2022-2027"]
          - ["Zone climatiche E ed F (Nord, montagna)", "Cappotto al 50% nell'algoritmo; pompe di calore con piu' ore", "Pompa di calore circa 520 euro/kW contro 340 in zona C (ipotesi SCOP 4)"]
          - ["Aziende agricole e forestali", "Imprese a tutti gli effetti; biomassa anche come nuova installazione e per serre", "Serre senza catasto: basta il codice CUAA"]
          - ["Professionisti con partita IVA", "Sono 'impresa' per il decreto (art. 2 lett. s)", "Stesse percentuali delle micro; ufficio A/10 ammesso al Titolo II"]
          - ["Edificio residenziale (es. alloggio custode)", "Per le imprese solo Titolo III", "Niente cappotto o LED incentivati su abitazioni"]
          - ["Locale in affitto", "Ammesso con autorizzazione del proprietario (Modello 18)", "Negozi e uffici in affitto possono partecipare"]
        nota: >-
          Dimensione con la definizione UE, contando associate e collegate. Le imprese e gli ETS economici devono
          sempre mandare la richiesta preliminare prima di iniziare i lavori e non possono usare apparecchi a gas.
    beneficio_stimato:
      percentuale_min: 25
      percentuale_max: 65
      nota: >-
        Contributo diretto, non fiscale: e' gia' la percentuale della spesa. Il 25% e' il minimo di legge (grande
        impresa, intervento singolo di efficienza fuori dalle zone assistite), il 65% il massimo (piccola impresa sul
        Titolo III o con il massimo delle maggiorazioni). Nei fatti il GSE paga il piu' basso tra questa percentuale e
        l'algoritmo dell'intervento: LED, building automation e schermature al massimo 40%, pompe di calore circa
        340-520 euro per kW secondo la zona, quindi nei casi tipici 30-55%. Contributo in conto impianti: tassato come
        ricavo pro quota.
    come_si_ottiene: >-
      1) Imprese: PRIMA dell'avvio dei lavori (primo ordine vincolante o inizio cantiere) inviare sul
      Portaltermico la "richiesta preliminare" (Modello 4), pena l'inammissibilita': nome e dimensione
      dell'impresa, descrizione, date, luogo, elenco dei costi e importo dell'aiuto richiesto. Vale anche se a
      presentarla e' una ESCO per conto dell'impresa.
      2) Per il Titolo II far fare l'APE prima dei lavori (serve a dimostrare il risparmio del 10% o 20%).
      3) Realizzare l'intervento con asseverazione del tecnico (non obbligatoria per generatori fino a 35 kW a
      catalogo o con certificazione del produttore), diagnosi energetica dove richiesta, pagamenti tracciabili.
      4) Entro 90 giorni dalla fine lavori presentare la richiesta di "accesso diretto" sul Portaltermico
      con fatture, bonifici, foto, APE dopo i lavori (le imprese non possono usare la prenotazione, riservata a PA
      ed ETS).
      5) Firma della scheda-contratto con il GSE dopo l'istruttoria.
    tempi: >-
      Pagamento entro l'ultimo giorno del mese successivo al bimestre in cui il GSE ammette l'istanza.
      Fino a 15.000 euro rata unica; oltre, rate annuali costanti (2 anni per pompe di calore e biomassa fino a
      35 kW, solare termico fino a 50 m2 e scaldacqua; 5 anni per gli interventi del Titolo II e per gli impianti
      piu' grandi; con piu' interventi vale la durata piu' lunga). Trattenuta GSE 1% del contributo, max 250 euro
      + IVA, sulla prima rata.
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Art. 17: niente Conto Termico se per lo stesso intervento ci sono altri "incentivi statali"
        (contributi erogati direttamente da un'Amministrazione centrale), salvo fondi di garanzia,
        fondi di rotazione e contributi in conto interessi (quindi si' Fondo di garanzia PMI e
        Nuova Sabatini). Per le imprese, art. 27: cumulabile con altri aiuti di Stato sugli stessi
        costi (es. bandi regionali/camerali) nel limite delle intensita' massime del Titolo V (65%/60% sul Titolo
        II, 65%/55%/45% sul Titolo III): se il Conto Termico da solo e' gia' al tetto, non resta spazio per un bando
        sugli stessi costi; se e' sotto il tetto per effetto dell'algoritmo (es. LED al 40% per una piccola impresa
        con tetto 45-65%), il bando puo' coprire la differenza. Il GSE (FAQ sul cumulo, KB0017765) considera
        incentivi statali anche detrazioni fiscali (Ecobonus), crediti d'imposta, Transizione 5.0, superammortamento
        e iperammortamento: quindi NON cumulabile con questi sulle stesse spese; esclusi anche i Certificati Bianchi.
        Va dichiarato ogni altro aiuto (codici COR del Registro Nazionale Aiuti).
      riferimento: "DM 7/8/2025 artt. 17 e 27; Regole Applicative GSE par. 4.2.1 e 4.5; FAQ GSE sul cumulo (KB0017765)"
    attenzione: >-
      Richiesta preliminare prima dell'avvio dei lavori (anche un ordine firmato o un acconto fanno
      partire i lavori). Domanda entro 90 giorni dalla fine lavori, a pena di inammissibilita'.
      Il portale e' stato sospeso il 3/3/2026 per troppe richieste (circa 1,3 miliardi) e riaperto il
      13/4/2026 solo in accesso diretto: le risorse annuali possono esaurirsi, controllare i contatori GSE.
      Edificio deve essere esistente e accatastato; per Titolo II solo ambito terziario e APE prima e dopo.
      Le percentuali di legge (fino al 65%) non sono quanto si incassa: fare sempre il conto con l'algoritmo
      dell'intervento e i costi massimi. Per le imprese niente gas, neanche nei sistemi ibridi. Prodotti
      a catalogo GSE semplificano. Controlli e sopralluoghi GSE con possibile revoca.
    esempi:
      - profilo: ristorazione_ricettivo
        interesse: alto
        esempio: >-
          Hotel di 40 camere al Nord (zona E, piccola impresa) che sostituisce la caldaia a gas con pompe di calore
          aria/acqua da 120 kW (130.000 euro) e aggiunge 40 m2 di solare termico per l'acqua calda (50.000 euro).
          Pompa di calore: algoritmo circa 120 x 520 = 62.600 euro (ipotesi SCOP 4, efficienza 150%), sotto il tetto
          del 65% (84.500). Solare termico: 0,32 euro/kWh x circa 450 kWh/m2 (dato del certificato Solar Keymark, da
          verificare sul modello) x 40 m2 x 2 anni = circa 11.500 euro. In tutto circa 74.000 euro su 180.000 (41%),
          in 5 rate annuali perche' la pompa supera 35 kW. Richiesta preliminare al GSE prima di firmare l'ordine.
      - profilo: manifattura
        interesse: alto
        esempio: >-
          Capannone di 5.000 m2 al Nord (zona E, categoria D/1 o D/7), media impresa. Copertura isolata 350.000 euro
          e LED 100.000 euro (Titolo II, multi-intervento, tetto 40%): copertura 140.000 euro (l'algoritmo
          arriverebbe al 55% perche' c'e' anche la pompa di calore), LED 40.000 euro. Se l'APE dimostra un
          risparmio del 40% il tetto sale al 55%: copertura 192.500 euro, LED fermi al 40% (40.000). Pompe di calore da
          300 kW per 150.000 euro (Titolo III, media 55%): algoritmo circa 156.000, tetto 82.500 euro. In tutto circa
          262.500 euro su 600.000 (315.000 con il risparmio del 40%). Sulle stesse spese niente iperammortamento,
          superammortamento ne' Ecobonus: bisogna scegliere.
      - profilo: logistica
        interesse: alto
        esempio: >-
          Sei magazzini da 3.000 m2, media impresa: LED in tutti per circa 40.000 euro a sede (13 euro/m2, sotto i 35
          di costo massimo), 240.000 in tutto. Intervento singolo di efficienza (Titolo II): tetto 35% (25% + 10 punti
          media), algoritmo 40%: si prende il 35%, circa 14.000 euro a sede e 84.000 in tutto, ciascuna pratica in
          rata unica perche' sotto i 15.000 euro. I magazzini devono essere in una categoria catastale ammessa (gruppo
          D escluso D/9: da controllare sede per sede) e risparmiare almeno il 10% di energia primaria, da dimostrare
          con APE prima e dopo; dove non sono riscaldati non ci sono interventi termici da fare.
      - profilo: artigiano
        interesse: alto
        esempio: >-
          Laboratorio di 400 m2 al Nord (categoria C/3, micro impresa) che sostituisce la caldaia a gas con una pompa
          di calore da 40 kW (30.000 euro) e isola la copertura (40.000 euro). Pompa di calore: algoritmo circa 20.900
          euro, tetto 65% = 19.500 euro. Copertura: e' un intervento singolo del Titolo II (la pompa di calore e' del
          Titolo III), tetto 45%, algoritmo 55%: 18.000 euro. Circa 37.500 euro su 70.000, in 5 rate annuali da 7.500.
          Serve un risparmio di energia primaria del 10% (APE prima e dopo). Richiesta preliminare prima dell'ordine.
      - profilo: agricola
        interesse: alto
        esempio: >-
          Azienda con serre al Nord (zona E, piccola impresa) che installa una caldaia a biomassa da 200 kW: spesa
          120.000 euro. Algoritmo: 200 kW x 1.700 ore x 0,025 euro/kWh x 5 anni = 42.500 euro, fino a 63.750 euro se la
          caldaia ha emissioni di polveri oltre il 50% sotto la classe 5 stelle (Ce 1,5); tetto 65% = 78.000 euro.
          Quindi 42.500-63.750 euro, in 5 rate. Per le aziende agricole e' ammessa anche la nuova installazione e si
          puo' tenere il vecchio generatore a gasolio come riserva (allora il GSE paga sulla produzione misurata).
      - profilo: negozio
        interesse: medio
        esempio: >-
          Negozio di 150 m2 al Nord (categoria C/1, micro impresa) che passa a una pompa di calore aria/acqua o VRF da
          12 kW (12.000 euro) e ai LED (6.000 euro). Pompa di calore: algoritmo circa 6.250 euro (sotto il tetto del
          65%, 7.800). LED: 40 euro/m2 contro un costo massimo di 35, quindi 40% x 35 x 150 = 2.100 euro. Circa 8.350
          euro, in una sola rata. I LED sono un intervento singolo del Titolo II: serve un risparmio del 10% di energia
          primaria. In affitto basta il contratto, con l'autorizzazione del proprietario (Modello 18 GSE). Con uno
          split aria/aria fino a 12 kW il coefficiente scende a 0,07 e l'incentivo si dimezza.
      - profilo: ufficio_servizi
        interesse: medio
        esempio: >-
          Ufficio di 250 m2 al Nord (categoria A/10, piccola impresa) che sostituisce la caldaia con una pompa di
          calore da 20 kW (18.000 euro) e cambia l'illuminazione (7.000 euro). Pompa: algoritmo circa 10.400 euro (tetto
          65% = 11.700); LED al 40% = 2.800 euro. Circa 13.200 euro su 25.000, in una sola rata. In zona C (Centro-Sud
          costiero) la pompa vale circa un terzo in meno. Cifre modeste: conviene soprattutto se l'impianto e' da
          cambiare comunque.
      - profilo: startup
        interesse: basso
        esempio: >-
          In coworking non c'e' un edificio a disposizione: niente Conto Termico. Con un ufficio in affitto si puo'
          al massimo cambiare la climatizzazione (pompa di calore aria/acqua da 8 kW, 6.000 euro: algoritmo circa 4.200,
          tetto 65% = 3.900 euro), con l'autorizzazione del proprietario (Modello 18). Server, software e licenze non
          sono finanziabili. Beneficio piccolo rispetto alle pratiche.
    fiscale: >-
      Contributo in conto impianti (Regole Applicative par. 4.6): niente ritenuta del 4%, fuori campo IVA.
      IRES/IRPEF: non e' una sopravvenienza (art. 88 c. 3 lett. b TUIR), concorre al reddito pro quota insieme
      all'ammortamento del bene (OIC 16: costo ridotto o risconto, stesso effetto). IRAP: per le societa' di
      capitali concorre alla base imponibile (art. 5 c. 3 D.Lgs. 446/1997). Forfettari: da verificare con il
      commercialista. Esempio: 65.000 euro di contributo su 100.000, ammortamento al 10%: circa 1.814 euro di
      IRES+IRAP in piu' l'anno per 10 anni, beneficio netto circa 46.860 euro (47% della spesa).
    fonte_verificata_il: "2026-10-09"
  - id: iperammortamento_2026
    nome: "Iperammortamento 2026 (Nuovo Piano Transizione 5.0)"
    aggiunta_il: 2026-10-05
    tipo: maggiorazione_ammortamento
    ente: "MIMIT e MEF, procedura gestita dal GSE; recupero eventuale tramite Agenzia delle Entrate"
    norma: >-
      Legge 30 dicembre 2025 n. 199 (Legge di bilancio 2026), art. 1, commi 427-436, allegati IV e V;
      DL 27 marzo 2026 n. 38 (conv. L. 22 maggio 2026 n. 88), art. 7: eliminato il vincolo di beni prodotti in
      UE/SEE e maggiorazione esclusa dal reddito concordato (concordato preventivo biennale).
      DM MIMIT-MEF 7 maggio 2026 (modalita' attuative, con l'allegato 1 sui costi massimi degli impianti a fonti
      rinnovabili); DD MIMIT 10 giugno 2026 (apertura piattaforma e modelli) e DD 20 luglio 2026 (comunicazioni
      di conferma). Dal 1/1/2027 la norma passa nell'art. 364 del nuovo TUIR (D.Lgs. 19 giugno 2026 n. 117) e
      gli allegati IV e V diventano gli allegati E (beni materiali) ed F (beni immateriali), con lo stesso contenuto.
    url_ufficiale: "https://www.mimit.gov.it/it/incentivi/nuovo-piano-transizione-5-0-iperammortamento"
    in_vigore_dal: "2026-01-01"
    in_vigore_fino_al: "2028-09-30"
    stato: aperto
    sintesi: >-
      Chi compra beni strumentali nuovi 4.0 (macchinari interconnessi, software, sistemi digitali)
      o impianti per produrre energia rinnovabile per autoconsumo puo' dedurre dalle tasse un costo
      piu' alto di quello pagato: oltre al normale ammortamento, un +180% sulla parte di investimenti fino a
      2,5 milioni completati nell'anno, +100% sulla parte tra 2,5 e 10 milioni, +50% tra 10 e 20 milioni.
      Per una societa' in utile (IRES 24%) vale il 43,2% della spesa fino a 2,5 milioni; per una ditta
      individuale o i soci di una snc con aliquota IRPEF del 43% arriva al 77,4%. Il risparmio arriva negli
      anni di ammortamento o del leasing, non subito. Servono comunicazioni al GSE, perizia e certificazione
      contabile. Non e' un credito d'imposta e non riduce l'IRAP.
    a_chi_si_rivolge: >-
      Tutte le imprese residenti e le stabili organizzazioni in Italia, di ogni forma, settore e
      dimensione, che determinano il reddito d'impresa (anche in contabilita' semplificata). Esclusi per norma
      (comma 428; dal 2027 art. 364 nuovo TUIR): imprese in liquidazione volontaria o procedure concorsuali (o con
      procedimento in corso), imprese con sanzioni interdittive D.Lgs. 231/2001. Esclusi perche' senza reddito
      d'impresa o senza deduzione degli ammortamenti: professionisti e lavoratori autonomi, forfettari, imprese
      agricole a reddito catastale (le societa' agricole che tassano a bilancio possono usarlo). Ammesse le
      imprese che hanno aderito al concordato preventivo biennale: la maggiorazione si deduce anche dal reddito
      concordato (art. 7 DL 38/2026; istruzioni CPB aggiornate dall'Agenzia il 23/06/2026). Condizione: rispetto
      delle norme sulla sicurezza sul lavoro e regolarita' contributiva.
    soggetti_ammessi: [impresa]
    dimensioni_ammesse: []
    settori_esclusi: >-
      Nessun settore escluso in quanto tale. Esclusi i soggetti indicati sopra. Il beneficio serve
      solo a chi ha reddito d'impresa tassabile (in perdita il beneficio si sposta negli anni o si perde).
    investimenti_ammessi: >-
      a) Beni materiali e immateriali nuovi elencati negli allegati IV e V alla L. 199/2025 (sostituiscono
      gli ex allegati A e B dell'Industria 4.0; dal 2027 allegati E ed F del nuovo TUIR), destinati a
      strutture produttive in Italia e interconnessi al sistema aziendale di gestione della produzione o alla
      rete di fornitura. Dal DL 38/2026 non serve piu' che siano prodotti in UE/SEE.
      Allegato IV, quattro gruppi: (I) beni controllati da sistemi computerizzati o gestiti con sensori e
      azionamenti (macchine utensili, robot, magazzini automatici, AGV...), che devono avere tutte e cinque le
      caratteristiche obbligatorie (controllo CNC/PLC, interconnessione con caricamento da remoto di istruzioni,
      integrazione con la logistica o con altre macchine, interfaccia uomo-macchina semplice, rispetto delle
      norme di sicurezza) e almeno due delle tre ulteriori (telemanutenzione/telediagnosi, monitoraggio continuo,
      modello che simula il comportamento della macchina); (II) sistemi per qualita' e sostenibilita' (misura,
      controllo in linea, tracciabilita' RFID, monitoraggio dei consumi energetici, filtri intelligenti...);
      (III) dispositivi per l'interazione uomo-macchina e l'ergonomia (esoscheletri, banchi adattivi, anche
      casse self-checkout, totem e vetrine interconnesse nel commercio); (IV) nuovo gruppo hardware (server GPU
      e calcolo ad alte prestazioni, edge computing, storage, reti 5G private, firewall industriali, backup) solo
      se al servizio dei processi produttivi o dei beni dei gruppi precedenti. Esclusi pc, notebook, tablet,
      stampanti, scanner e beni d'ufficio, amministrativi e contabili.
      Allegato V (software): CAD/CAM, PLM, MES, SCADA, CMMS, logistica e supply chain, analytics, low-code,
      IA generativa e agenti di IA, MLOps, EMS e carbon footprint, cybersecurity. ERP solo per i moduli di
      produzione/logistica/filiera (non contabilita', fatturazione, paghe). Il software non deve essere legato
      all'acquisto di una macchina dell'allegato IV: basta che sia in elenco e interconnesso. Ammesse le licenze
      acquistate e ammortizzabili (anche se girano in cloud); abbonamenti SaaS non ammessi perche' non
      ammortizzabili (la versione definitiva del DM ha tolto il riferimento al SaaS; manca un chiarimento ufficiale).
      b) Beni per autoproduzione di energia rinnovabile destinata all'autoconsumo (art. 8 DM): gruppi di
      generazione elettrica, trasformatori e misuratori, impianti termici per calore di processo elettrificato
      (non per riscaldare ambienti o acqua sanitaria), servizi ausiliari, accumuli. Impianti sulla stessa
      particella catastale della struttura produttiva o altrove se collegati a un POD della struttura;
      producibilita' massima 105% del fabbisogno dell'anno precedente (elettricita' piu' combustibili convertiti
      con le formule dell'allegato 1 al DM); costi massimi in euro/kW (allegato 1 al DM); per il fotovoltaico
      solo moduli iscritti al registro ENEA alle lettere b e c (moduli e celle prodotti in UE ad alta efficienza).
      Nessun requisito di riduzione dei consumi energetici (a differenza della vecchia Transizione 5.0).
      Esclusi: beni usati, fabbricati e opere murarie, autoveicoli, beni non in elenco o non interconnessi.
    categorie_spesa: [macchinari_attrezzature, software_digitale, energia_efficienza]
    intensita: >-
      COME FUNZIONA. Il costo del bene (o i canoni di leasing) si deduce due volte: una con il normale
      ammortamento, che sta nel bilancio, e una seconda volta, solo nella dichiarazione dei redditi, con la
      maggiorazione. La maggiorazione si calcola sugli investimenti completati in ciascun anno (art. 4 c. 2
      DM 7/5/2026), a scaglioni come l'IRPEF: 180% sulla parte fino a 2,5 milioni; 100% sulla parte oltre 2,5 e
      fino a 10 milioni; 50% sulla parte oltre 10 e fino a 20 milioni; oltre 20 milioni nessuna maggiorazione.
      Gli scaglioni ripartono ogni anno: chi distribuisce gli investimenti tra 2026, 2027 e 2028 puo' avere il
      180% su 2,5 milioni per ciascun anno. Base di calcolo: costo del bene al netto di altri contributi
      ricevuti sugli stessi costi (comma 431). Non e' un credito d'imposta: non si compensa in F24.

      FORMULA. Maggiorazione = 180% x (investimenti dell'anno fino a 2,5 milioni) + 100% x (parte tra 2,5 e 10
      milioni) + 50% x (parte tra 10 e 20 milioni). Risparmio d'imposta = maggiorazione x aliquota (IRES 24%;
      per ditte individuali e soci di societa' di persone l'aliquota IRPEF marginale: 23% fino a 28.000 euro,
      33% tra 28.000 e 50.000, 43% oltre, piu' addizionali). Esempio: investimenti di 5 milioni nel 2026 =
      2,5 milioni x 180% (4.500.000) + 2,5 milioni x 100% (2.500.000) = 7.000.000 di maggiorazione; per una srl
      7.000.000 x 24% = 1.680.000 euro di IRES in meno, cioe' il 33,6% della spesa.

      QUANDO ARRIVA. La maggiorazione segue il ritmo dell'ammortamento fiscale: ogni anno si deduce in piu' il
      180% (o 100%, 50%) della quota di ammortamento dell'anno. Macchinari: di solito dal 10% al 15,5% annuo
      (coefficienti DM 31/12/1988, primo anno a meta', art. 102 TUIR), quindi 7-10 anni; software in licenza a
      tempo indeterminato: in 2 anni (fino al 50% annuo, art. 103 TUIR); fotovoltaico: di solito 9% annuo,
      circa 11 anni (circolare AdE 36/E/2013); leasing: con i canoni, deducibili in un periodo non inferiore
      alla meta' dell'ammortamento (art. 102 c. 7 TUIR), quindi piu' in fretta. Esempio: macchinario da 100.000
      euro al 15%: maggiorazione 180.000 euro, 27.000 euro l'anno (13.500 il primo), cioe' circa 6.480 euro di
      IRES in meno l'anno per 7 anni circa.
    tabella_intensita:
      - titolo: "Scaglioni e valore della maggiorazione"
        colonne: ["Parte degli investimenti completati nell'anno", "Maggiorazione", "Deduzione totale (con l'ammortamento normale)", "Risparmio in piu' per una societa' (IRES 24%)", "Ditta o soci snc con IRPEF 33%", "Ditta o soci snc con IRPEF 43%"]
        righe:
          - ["Fino a 2,5 milioni", "180%", "280% del costo", "43,2% della spesa", "59,4%", "77,4%"]
          - ["Oltre 2,5 e fino a 10 milioni", "100%", "200% del costo", "24%", "33%", "43%"]
          - ["Oltre 10 e fino a 20 milioni", "50%", "150% del costo", "12%", "16,5%", "21,5%"]
          - ["Oltre 20 milioni", "nessuna", "100% (solo ammortamento normale)", "0", "0", "0"]
        nota: >-
          Le percentuali si applicano a scaglioni sulla somma degli investimenti completati nello stesso anno
          (art. 4 c. 2 DM 7/5/2026), come le aliquote IRPEF: anche chi investe 30 milioni ha il 180% sui primi 2,5.
          Il risparmio e' calcolato solo sulla parte in piu' (la maggiorazione); l'ammortamento normale si deduce
          comunque. Per l'IRPEF conta l'aliquota dell'anno in cui si deduce: se la deduzione fa scendere il reddito
          sotto 50.000 euro, quella parte risparmia il 33% (o il 23% sotto 28.000). Non vale per l'IRAP.
      - titolo: "Esempi di risparmio per importo investito in un anno"
        colonne: ["Investimenti completati nell'anno", "Maggiorazione", "Srl/spa (IRES 24%)", "% della spesa (IRES)", "Ditta o soci snc (IRPEF 43%)", "In pratica"]
        righe:
          - ["100.000 euro", "180.000 euro", "43.200 euro", "43,2%", "77.400 euro", "Perizia e certificazione contabile costano quasi uguale per ogni importo: su cifre piccole pesano di piu'"]
          - ["1.000.000 euro", "1.800.000 euro", "432.000 euro", "43,2%", "774.000 euro", "Tutto nel primo scaglione"]
          - ["2.500.000 euro", "4.500.000 euro", "1.080.000 euro", "43,2%", "1.935.000 euro", "Massimo dello scaglione al 180% per quell'anno"]
          - ["5.000.000 euro", "7.000.000 euro (4.500.000 + 2.500.000)", "1.680.000 euro", "33,6%", "3.010.000 euro", "Se si puo', meglio dividere tra due anni: 2,5 + 2,5 milioni danno 9.000.000 di maggiorazione (2.160.000 euro di IRES)"]
          - ["10.000.000 euro", "12.000.000 euro", "2.880.000 euro", "28,8%", "-", "Tipico di media o grande impresa"]
          - ["20.000.000 euro", "17.000.000 euro", "4.080.000 euro", "20,4%", "-", "Oltre questa cifra nell'anno non si aggiunge nulla"]
        nota: >-
          Calcolo: 180% fino a 2,5 milioni, 100% da 2,5 a 10 milioni, 50% da 10 a 20 milioni, poi moltiplicato per
