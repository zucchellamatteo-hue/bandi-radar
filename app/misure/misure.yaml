          - ["Giovani, svantaggiati", "Under 35 con una sola condizione: senza impiego regolare da 6 mesi, 15-24 anni, senza diploma, ecc.", "Tutti i datori privati", "500 euro; 650 in ZES", "12 mesi", "6.000 euro (7.800 in ZES)", "Stessi fondi"]
          - ["Donne, molto svantaggiate", "Donne di ogni eta' senza impiego regolare da 24 mesi, o da 12 mesi con un'altra condizione (15-24 anni, oltre 50, senza diploma, vive sola con persone a carico, settore con disparita', minoranza)", "Tutti i datori privati, nessun limite di dimensione", "650 euro; 800 se residente in ZES", "24 mesi", "15.600 euro (19.200 residente in ZES)", "26,5 milioni (con le svantaggiate)"]
          - ["Donne, svantaggiate", "Donne con una sola condizione: senza impiego regolare da 6 mesi, oltre 50 anni, senza diploma, ecc.", "Tutti i datori privati", "650 euro; 800 se residente in ZES", "12 mesi", "7.800 euro (9.600 residente in ZES)", "Stessi fondi"]
