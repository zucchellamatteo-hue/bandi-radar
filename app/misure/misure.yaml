          - ["Grande impresa", "36% / 30%", "Nessun limite di dimensione, non e' aiuto di Stato", "Ammessa; i tetti per unita' pesano sui grandi stabili"]
          - ["Immobile strumentale (capannone, ufficio, negozio)", "36% / 30%", "Serve impianto di riscaldamento (salvo solare, schermature, biomassa)", "Il caso tipico; molti magazzini non riscaldati sono esclusi"]
          - ["Immobile merce (impresa edile o immobiliare che rivende)", "36% / 30%", "Ammesso dalla risoluzione 34/E/2020; se l'immobile si vende, le rate residue passano all'acquirente salvo accordo diverso (da verificare con acquirente societa')", "Vale se la rivendita e' lontana o si conservano le rate"]
          - ["Immobile patrimonio, anche abitativo dato in affitto", "36% / 30%", "Ammesso (risoluzione 34/E/2020); building automation solo su unita' residenziali", "Utile per le immobiliari di gestione"]
          - ["Immobile in affitto o leasing (impresa inquilina)", "36% / 30%", "Spetta a chi paga i lavori, con contratto registrato e consenso del proprietario", "Conservare il consenso scritto"]
          - ["Abitazione principale di una persona fisica", "50% / 36%", "Solo per il proprietario o titolare di diritto reale che ci abita", "Non riguarda mai l'impresa"]
        nota: >-
          Ecobonus e Conto Termico 3.0 sugli stessi lavori non si sommano: per un'impresa con un'aliquota del 36%
          in 10 anni il Conto Termico (contributo del 25-65%, pagato subito) e' quasi sempre migliore,
          quando e' possibile chiederlo.
    beneficio_stimato:
      percentuale_min: 36
      percentuale_max: 36
      nota: >-
        Per un'impresa e' sempre 36% della spesa ammessa (lavori finiti nel 2026), recuperato in 10 anni in
        dichiarazione: valore attuale piu' basso (circa 31% con un tasso del 3%). Solo se l'impresa ha imposte da
        pagare ogni anno: la quota che non trova capienza si perde (IRPEF e IRES), senza rimborso ne' riporto.
        Sui grandi lavori il tetto di detrazione per unita' abbassa la percentuale effettiva (es. 13% su un
        cappotto da 450.000 euro). Nel 2027 30%.
    come_si_ottiene: >-
      1) Tecnico abilitato: verifica dei requisiti (trasmittanze, efficienze; per lavori iniziati dal
      4/2/2026 i nuovi requisiti del D.Lgs. 5/2026), APE dove richiesto, asseverazione con computo metrico
      e congruita' delle spese. 2) Pagamenti: per le imprese il bonifico "parlante" non e' obbligatorio
      (bastano fatture e contratti; pagamento comunque tracciabile); per persone fisiche e professionisti si'.
      3) Entro 90 giorni dalla fine lavori (o dal collaudo), invio della scheda descrittiva all'ENEA sul portale
      bonusfiscali.enea.it (sezione dell'anno di fine lavori); per lavori iniziati dal 4/2/2026 e finiti prima del
      25/6/2026 i 90 giorni decorrono dal 25/6/2026 (avviso ENEA). 4) Conservare ricevuta con CPID,
      asseverazione, APE, fatture, consenso del proprietario. 5) Detrazione in dichiarazione dei redditi dal
      periodo della spesa, per 10 anni.
    tempi: >-
      Nessuna domanda preventiva e nessuna graduatoria: la detrazione spetta per legge se ci sono i
      requisiti. Il beneficio arriva in 10 quote annuali a partire dalla dichiarazione dell'anno della spesa
      (per un'impresa con lavori finiti nel 2026: prima rata nella dichiarazione 2027 sui redditi 2026).
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Con un contributo a fondo perduto regionale, camerale o locale sugli stessi lavori: la detrazione
        si calcola solo sulla parte di spesa rimasta a carico (spesa meno contributo), e il totale non puo'
        superare il 100% della spesa; serve che il bando non vieti il cumulo. NON si somma con il Conto
        Termico 3.0 sugli stessi interventi (il DM 7/8/2025 art. 17 esclude chi ha altri incentivi statali,
        e il GSE ci comprende le detrazioni): bisogna scegliere uno dei due (per un'impresa il Conto Termico,
        25-65% subito, rende quasi sempre di piu'). Non si somma con altre detrazioni fiscali per gli
        stessi lavori (es. bonus ristrutturazioni o sismabonus sulla stessa spesa); bonus diversi su lavori
        diversi dello stesso cantiere si', con spese separate. Esempio: lavori per 30.000 euro con contributo
        camerale di 10.000: Ecobonus su 20.000, cioe' 7.200 euro in 10 anni.
      riferimento: "Guida AdE 'Tutte le agevolazioni della dichiarazione 2026', Riqualificazione energetica, par. Cumulabilita'; DM MASE 7/8/2025 art. 17"
    attenzione: >-
      Scheda ENEA entro 90 giorni dalla fine lavori. Requisiti tecnici cambiati per i lavori iniziati
      dal 4/2/2026 (D.Lgs. 5/2026: SCOP minimi per le pompe di calore, regole piu' strette per ibridi e
      biomasse; vademecum ENEA aggiornati al 23/09/2026). Cessione del credito e sconto in fattura vietati
      dal 17/2/2023 salvo casi transitori ormai residuali: la detrazione si usa solo contro le proprie
      imposte. Edificio esistente, non nuova costruzione ne' ampliamento. Controlli ENEA e Agenzia con
      recupero della detrazione. Con le caldaie solo a combustibili fossili niente detrazione. Per le imprese
      in ordinaria conta la fine lavori: un cantiere che finisce a gennaio 2027 prende il 30%, non il 36%.
    esempi:
      - profilo: ristorazione_ricettivo
        interesse: medio
        esempio: >-
          Hotel di proprieta' (srl in utile) che cambia gli infissi per 80.000 euro: detrazione 36% = 28.800 euro in
          10 anni (2.880 euro l'anno), entro il limite di 60.000 euro di detrazione per unita' immobiliare. Se i lavori
          finiscono nel 2027: 24.000 euro. Con il Conto Termico lo stesso lavoro varrebbe il 45% per una piccola
          impresa: l'Ecobonus serve quando il Conto Termico non e' possibile (lavori gia' partiti senza richiesta
          preliminare, fondi GSE esauriti). Non si sommano.
      - profilo: manifattura
        interesse: basso
        esempio: >-
          Capannone riscaldato di proprieta': isolamento della copertura per 450.000 euro. Il limite di 60.000 euro di
          detrazione per unita' immobiliare porta il beneficio a circa il 13% della spesa, in 10 anni (6.000 euro
          l'anno). Il Conto Termico (40% o piu' per una media impresa) e' quasi sempre meglio; l'edificio deve avere
          un impianto di riscaldamento.
      - profilo: artigiano
        interesse: basso
        esempio: >-
          Laboratorio di proprieta': pompa di calore da 30.000 euro, detrazione 36% = 10.800 euro in 10 anni, solo con
          imposte capienti. Se e' una snc la detrazione va ai soci per quote. Con il Conto Termico la stessa pompa di
          calore vale fino al 65%: l'Ecobonus e' un ripiego.
      - profilo: ufficio_servizi
        interesse: basso
        esempio: >-
          Ufficio di proprieta' con infissi da cambiare per 30.000 euro: detrazione 10.800 euro, 1.080 euro l'anno per
          10 anni. Rende di piu' il Conto Termico (45% per una piccola impresa); l'Ecobonus resta utile se i lavori sono
          gia' partiti senza la richiesta al GSE.
      - profilo: negozio
        interesse: basso
        esempio: >-
          Negozio con climatizzazione nuova in pompa di calore da 12.000 euro: detrazione 4.320 euro in 10 anni, con
          imposte capienti. Se il locale e' in affitto la detrazione spetta all'inquilino che paga i lavori, che deve
          conservare la dichiarazione di consenso del proprietario. Il Conto Termico al 65% rende di piu'.
      - profilo: logistica
        interesse: basso
        esempio: >-
          Molti magazzini non hanno un impianto di riscaldamento, che e' una condizione richiesta: li' niente Ecobonus.
          Si applica agli uffici delle sedi (es. infissi per 20.000 euro: 7.200 euro in 10 anni). Per l'illuminazione
          LED dei magazzini non c'e' Ecobonus; c'e' il Conto Termico.
      - profilo: agricola
        interesse: basso
        esempio: >-
          Con il reddito agrario catastale le imposte sono basse e la detrazione rischia di non trovare capienza. Caso
          tipico: infissi o cappotto degli uffici aziendali (30.000 euro: 10.800 euro in 10 anni). Le serre di solito
          non rientrano (edificio esistente con impianto di riscaldamento: da verificare caso per caso).
      - profilo: startup
        interesse: nullo
        esempio: >-
          In perdita e quasi sempre in affitto: una detrazione in 10 anni non serve. La parte che non trova imposte da
          pagare si perde, senza riporto. Software e piattaforme non sono agevolati.
    fiscale: >-
      Detrazione dall'IRES o IRPEF lorda; non riduce l'IRAP. Non e' tassata: non e' un ricavo e non concorre ne'
      al reddito ne' al valore della produzione IRAP; il costo dei lavori resta deducibile o ammortizzabile per
      intero (se in bilancio la detrazione riduce il costo si recupera con variazioni in diminuzione: norma di
      comportamento AIDC 224/2024; manca un documento specifico dell'Agenzia, da confermare con il
      commercialista). La quota incapiente si perde, senza rimborso ne' riporto. Esempio: srl, infissi per
      50.000 euro finiti nel 2026: 18.000 euro di detrazione (1.800 l'anno) piu' circa 12.000 di IRES e 1.950
      di IRAP risparmiate con l'ammortamento: circa 31.950 euro in tutto.
    fonte_verificata_il: "2026-10-09"
  - id: sismabonus_imprese_2026
    nome: "Sismabonus (detrazione per interventi antisismici, anche su immobili produttivi)"
    aggiunta_il: 2026-10-06
    tipo: detrazione_fiscale
    ente: "Agenzia delle Entrate"
    norma: >-
      Art. 16 commi 1-bis - 1-septies.1 DL 4 giugno 2013 n. 63; aliquote 2025-2027 dalla L. 207/2024
      art. 1 comma 55 lett. b) n. 2 (nuovo comma 1-septies.1); per il 2026 portate al 36% (50% abitazione
      principale) dalla L. 199/2025, art. 1 comma 22; 10 quote annuali dall'art. 4-bis comma 4 DL 39/2024;
      circolare AdE 8/E del 19/6/2025. Imprese su immobili strumentali, merce e patrimoniali: risoluzione AdE
      34/E del 25/6/2020; pagamenti delle imprese: risposta AdE 46 del 22/10/2018. Classificazione del rischio:
      DM 58/2017 e DM 329/2020. Dal 1/1/2027 i commi del DL 63/2013 sono abrogati e la disciplina passa
      nell'art. 371 del nuovo TUIR (D.Lgs. 19 giugno 2026 n. 117); secondo le prime analisi aliquote invariate.
    url_ufficiale: "https://www.agenziaentrate.gov.it/portale/aree-tematiche/casa/agevolazioni/sisma-bonus"
    in_vigore_dal: "2025-01-01"
    in_vigore_fino_al: "2027-12-31"
    stato: aperto
    sintesi: >-
      Chi fa lavori di adeguamento o miglioramento antisismico su edifici abitativi o adibiti ad
      attivita' produttive nelle zone sismiche 1, 2 e 3 puo' togliere dalle tasse (IRES o IRPEF) il 36%
      della spesa sostenuta nel 2026, fino a 96.000 euro di spesa per unita' immobiliare (massimo 34.560 euro
      di detrazione), in 10 rate annuali. Vale anche per le societa', su immobili strumentali, merce o dati in
      affitto. Non riduce l'IRAP. Nel 2027 scende al 30% (massimo 28.800 euro). Dal 2025 non ci sono piu' le
      aliquote maggiorate (70-85%) per chi riduceva di una o due classi il rischio sismico: la percentuale e'
      unica. Su un capannone grande il tetto di 96.000 euro porta il beneficio sotto il 10% della spesa.
    a_chi_si_rivolge: >-
      Contribuenti IRPEF e IRES, comprese le imprese di ogni dimensione (e' una detrazione fiscale generale,
      non un aiuto di Stato), che possiedono o detengono edifici residenziali o adibiti ad attivita' produttive
      (agricole, professionali, produttive di beni e servizi, commerciali) in zona sismica 1, 2 o 3 (circ.
      29/E/2013). Per le imprese la detrazione spetta a prescindere dall'uso dell'immobile: strumentale, merce o
      patrimonio (risoluzione AdE 34/E/2020, che riguarda sia ecobonus sia sismabonus).

      Chi ne trae davvero vantaggio: solo chi ha IRES o IRPEF da pagare per 10 anni. Societa' di capitali:
      dall'IRES della societa'. Societa' di persone: la detrazione passa ai soci per quote. Ditte individuali e
      professionisti: nella propria IRPEF, con il possibile tetto agli oneri detraibili dell'art. 16-ter TUIR
      se il reddito complessivo supera 75.000 euro (vale per le spese edilizie; per lavori sugli immobili
      dell'impresa da verificare). Forfettari: di solito nessun vantaggio.

      Sismabonus acquisti (comma 1-septies): spetta a chi compra (persona o impresa, IRPEF o IRES) un'unita'
      in un edificio demolito e ricostruito in chiave antisismica in zona 1-3 da un'impresa di costruzione
      che la vende entro 30 mesi dalla fine lavori; vale per unita' residenziali e non residenziali (risposta
      AdE 556/2021).
    soggetti_ammessi: [impresa, libero_professionista]
    dimensioni_ammesse: []
    settori_esclusi: "Nessun settore escluso, nessun limite di dimensione. Escluse le zone sismiche 4. Serve capienza d'imposta."
    investimenti_ammessi: >-
      Interventi antisismici e di messa in sicurezza statica (art. 16-bis comma 1 lett. i TUIR) sulle parti
      strutturali, compresa demolizione e ricostruzione antisismica, e spese per classificazione e verifica
      sismica (comma 1-sexies). Es.: collegamenti trave-pilastro e tegolo-trave dei capannoni prefabbricati,
      fondazioni, pilastri, solai, murature, coperture; spese tecniche. Non ammessi: zona 4, impianti,
      macchinari, scaffalature, arredi, lavori solo energetici, spesa oltre il massimale, software (licenze,
      gestionali, cloud, cybersecurity, IA); monitoraggio strutturale continuo previsto solo per il Superbonus,
      per il Sismabonus da verificare.

      Limite di spesa 96.000 euro per unita' immobiliare per anno; se i lavori proseguono un intervento
      iniziato negli anni prima, si contano anche le spese gia' detratte (circ. 8/E/2025: 80.000 gia' spesi =
      altri 16.000 al massimo). In pratica il tetto vale per intervento, non si moltiplica dividendo il cantiere
      su piu' anni. Il tetto e' per unita' catastale: un capannone accatastato come una sola unita' ha un solo
      tetto, un complesso con piu' unita' ne ha uno per ciascuna. Dal 2025 la percentuale e' fissa: il
      miglioramento di una o due classi di rischio non da' piu' aliquote maggiori. Sismabonus acquisti: 36%
      del prezzo nel 2026 (30% nel 2027) su massimo 96.000 euro per unita'.
    categorie_spesa: [opere_edili_impianti]
    intensita: >-
      ALIQUOTE. Spese 2026: 36% (50% solo per l'abitazione principale del proprietario persona fisica: mai per
      l'impresa). Spese 2027: 30% (36%). Massimale 96.000 euro di spesa per unita' immobiliare per anno. 10 quote
      annuali. Fino al 2024 l'aliquota era 50%, 70-80% con riduzione di una o due classi di rischio (75-85% sulle
      parti comuni condominiali): dal 2025 queste maggiorazioni non ci sono piu'.

      FORMULA. Detrazione = aliquota x minimo tra (spesa ammessa rimasta a carico) e (96.000 euro meno le spese
      gia' agevolate per lo stesso intervento negli anni prima). Rata annua = detrazione / 10, usabile solo fino
      all'imposta lorda dell'anno. Esempio: srl in zona 2, rinforzo di un capannone (una unita') per 250.000 euro
      con lavori finiti nel 2026: 36% x 96.000 = 34.560 euro, cioe' 3.456 euro l'anno per 10 anni, il 13,8% della
      spesa. Se finiti nel 2027: 30% x 96.000 = 28.800 euro (11,5%).

      QUANDO CONTA LA SPESA. Imprese in contabilita' ordinaria: competenza, cioe' fine lavori o SAL accettati in
      via definitiva, e nessun obbligo di bonifico (risposta AdE 46/2018). Imprese in contabilita' semplificata:
      cassa, quindi conta la data del pagamento, con bonifico "parlante" (stessa risposta). Professionisti e
      privati: cassa e bonifico parlante.

      VALORE REALE. Con un tasso del 3% annuo le 10 rate valgono oggi circa l'85% del totale (36% nominale =
      circa 31%). Calcolo nostro, non ufficiale.
