      - titolo: "Quanto si risparmia su una retribuzione tipica (tempo pieno)"
        colonne: ["Retribuzione lorda annua", "Contributi esonerabili al mese (circa 30%)", "Giovani 500 euro: 12 / 24 mesi", "Giovani in ZES o Donne 650 euro: 12 / 24 mesi", "Donne residenti in ZES 800 euro: 12 / 24 mesi", "Bonus ZES 650 euro: 24 mesi"]
        righe:
          - ["20.000 euro", "500 euro", "6.000 / 12.000 euro", "6.000 / 12.000 euro", "6.000 / 12.000 euro", "12.000 euro"]
          - ["24.000 euro", "600 euro", "6.000 / 12.000 euro", "7.200 / 14.400 euro", "7.200 / 14.400 euro", "14.400 euro"]
          - ["30.000 euro", "750 euro", "6.000 / 12.000 euro", "7.800 / 15.600 euro", "9.000 / 18.000 euro", "15.600 euro"]
          - ["36.000 euro", "900 euro", "6.000 / 12.000 euro", "7.800 / 15.600 euro", "9.600 / 19.200 euro", "15.600 euro"]
          - ["Part-time 50% (12.000 euro, 24.000 a tempo pieno)", "300 euro", "3.000 / 6.000 euro (tetto 250)", "3.600 / 7.200 euro (tetto 325)", "3.600 / 7.200 euro (tetto 400)", "7.200 euro (tetto 325)"]
        nota: >-
          Calcolo: esonero mensile = il minore tra contributi del mese e tetto; risparmio = esonero mensile x
          mesi. Retribuzione mensile = lordo annuo / 12 (ratei di tredicesima e quattordicesima compresi, come
