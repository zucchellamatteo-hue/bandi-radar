          gli svantaggiati, 24 per i molto svantaggiati.
      - titolo: "Cosa cambia per zona, dimensione e tipo di datore"
        colonne: ["Situazione", "Bonus richiedibili", "In pratica"]
        righe:
          - ["Impresa del Centro-Nord, qualunque dimensione", "Giovani (500); Donne (650, o 800 se la lavoratrice risiede in una regione ZES)", "Il Bonus ZES non si puo' chiedere; per una donna residente al Sud assunta al Nord il tetto e' comunque 800"]
          - ["Posto di lavoro in una regione ZES, datore con piu' di 10 dipendenti", "Giovani (650); Donne (650 o 800 secondo la residenza)", "Bonus ZES escluso; per gli over 35 uomini non resta nulla salvo altri incentivi (es. disabili, NASpI)"]
          - ["Posto di lavoro in una regione ZES, datore fino a 10 dipendenti nel mese dell'assunzione", "Tutti e tre", "Uomo di 35 anni o piu' disoccupato da 24 mesi: solo Bonus ZES (650 x 24). Donna nella stessa situazione e residente in ZES: meglio il Bonus Donne (800 x 24) se lo stipendio supera circa 26.000 euro, altrimenti uguale"]
          - ["Micro, piccola, media e grande impresa", "Giovani e Donne senza limiti di dimensione; ZES solo fino a 10 dipendenti", "Nessuna maggiorazione per le micro o piccole; l'incremento netto si calcola sull'intero gruppo (al netto dei cali nelle controllate e collegate)"]
          - ["Studi professionali, associazioni, fondazioni, ETS", "Tutti e tre (datori privati anche non imprenditori)", "Ammessi secondo le circolari INPS, par. 2"]
          - ["Agricoltura", "Tutti e tre, solo per operai a tempo indeterminato (OTI)", "Non si somma alle riduzioni per zone montane o svantaggiate: conviene solo se l'esonero e' piu' alto; gli stagionali (OTD) sono esclusi"]
          - ["Edilizia", "Tutti e tre", "Non si somma alle riduzioni contributive dell'edilizia: fare il confronto"]
          - ["Agenzie di somministrazione", "Tutti e tre, per assunzioni a tempo indeterminato", "Beneficio, limite dei 10 dipendenti, incremento netto e zona si guardano sull'impresa utilizzatrice"]
          - ["Pubblica amministrazione, lavoro domestico, apprendistato, intermittente, tempo determinato", "Nessuno", "Per le trasformazioni a tempo indeterminato di giovani c'e' una misura a parte (art. 4 DL 62/2026)"]
        nota: >-
          Il tetto piu' alto del Bonus Giovani dipende da dove si lavora; quello del Bonus Donne da dove risiede
          la lavoratrice; il Bonus ZES da dove si lavora e dalla dimensione del datore. Fonte: circolari INPS
          55, 56 e 57 del 14/05/2026.
    beneficio_stimato:
      percentuale_min: 12
      percentuale_max: 22
      nota: >-
        Percentuale del costo aziendale del lavoratore assunto (stipendio lordo + contributi + TFR) nei mesi
        agevolati. Esempio: stipendio lordo di 24.000 euro l'anno, contributi a carico dell'impresa circa 30%
        (600 euro al mese), costo aziendale circa 33.000 euro: con il Bonus Giovani (tetto 500) l'impresa
        risparmia 6.000 euro l'anno, circa il 18% del costo; con il tetto di 650 o 800 l'esonero copre tutti i
        contributi (7.200 euro, circa 22%). Con stipendi alti il tetto pesa di piu': 36.000 euro lordi, Bonus
        Giovani circa 12%, Bonus Donne in ZES circa 19%. Aliquote contributive reali secondo il contratto e il
        settore: da verificare caso per caso.
    come_si_ottiene: >-
      1) Verificare che il lavoratore rientri nelle categorie (eta', mesi senza impiego regolare, residenza,
      eventuali altre condizioni) e che l'impresa abbia l'incremento occupazionale netto; per il Bonus ZES
      contare i dipendenti del mese di assunzione. 2) Domanda all'INPS sul "Portale delle Agevolazioni (ex
      DiResCo)", modulo Bonus giovani 2026, Bonus donne 2026 o Bonus ZES 2026 (aperti dall'11/06/2026), con
      dati del lavoratore (per le donne anche la residenza), classe di svantaggio, tipo di contratto e
      percentuale di part-time, retribuzione media mensile e aliquota contributiva, dichiarazione di non
      cumulo con altri esoneri e di rispetto del trattamento economico dell'art. 7. 3) Se la domanda e' fatta
      prima di assumere, l'INPS accantona le risorse e comunica via PEC: l'impresa deve assumere e inviare la
      comunicazione obbligatoria (Unilav) entro 10 giorni, pena la perdita della prenotazione; i dati devono
      coincidere con l'Unilav. 4) Dopo l'accoglimento l'esonero si applica nelle denunce contributive mensili
      (Uniemens), recuperando anche i mesi gia' passati; l'importo autorizzato e' il massimo (se poi l'orario
      sale non aumenta).
    tempi: >-
      Risposta dell'INPS nel modulo online (assunzione gia' fatta) o via PEC (assunzione da fare). Il risparmio
      arriva subito, mese per mese, sui contributi da versare, per 12 o 24 mesi. Termine finale per le domande
      relative alle assunzioni 2026: non ancora fissato al 09/10/2026 (il termine del 30/09/2026, messaggio
      INPS n. 2451 del 23/07/2026, riguardava i bonus 2024-2025 del decreto Coesione, DL 60/2024).
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Non si somma con altri esoneri o riduzioni dei contributi a carico del datore di lavoro (es. Decontribuzione
        Sud, incentivo per l'assunzione di disabili, incentivo NASpI, riduzioni per agricoltura in zone montane ed
        edilizia), e i tre bonus non si sommano tra loro sullo stesso lavoratore. Si somma senza riduzioni con la
        maxi-deduzione del costo dei nuovi assunti (L. 207/2024 commi 399-400), con l'esonero dell'1% per la
        certificazione della parita' di genere (fino a 50.000 euro l'anno) e con gli sgravi sui contributi a carico
        del lavoratore (es. esonero per le lavoratrici madri). Essendo un aiuto in esenzione (art. 32 GBER), con
        un bando regionale che paga gli stessi costi del personale il totale non puo' superare l'intensita'
        massima del regolamento (50% dei costi salariali di 12 mesi, 24 per i molto svantaggiati): da verificare
        con il bando. L'INPS registra l'aiuto nel Registro nazionale degli aiuti di Stato.
      riferimento: "DL 62/2026 art. 1 c. 9, art. 2 c. 10 e art. 3 c. 9; circolari INPS 55, 56 e 57 del 14/05/2026, par. 8 e 9; Reg. UE 651/2014 art. 32"
    attenzione: >-
      Solo tempo indeterminato e solo assunzioni dal 1/1 al 31/12/2026. Fondi annuali limitati (Bonus ZES e Donne
      circa 26 milioni ciascuno nel 2026): fare domanda presto, anche prima dell'assunzione. Senza incremento
      occupazionale netto (contato in ULA sui 12 mesi precedenti, sull'intero gruppo) l'esonero non spetta per
      quel mese. Diritti di precedenza di altri lavoratori, licenziamenti nei 6 mesi precedenti o violazioni
      contributive fanno perdere il bonus. Pubblicazione delle offerte sulla piattaforma SIISL (DL 159/2025 art.
      14): dovuta dal 1/4/2026, ma non obbligatoria finche' non esce il decreto attuativo (messaggio INPS 1153
      del 31/03/2026); controllare prima di assumere. Domanda fatta prima di assumere: Unilav entro 10 giorni o
      si perde la prenotazione. Collegate ma distinte: esonero per le madri di almeno tre figli
      (L. 199/2025 commi 210-213, circolare INPS 82 del 29/07/2026, fino a 8.000 euro l'anno) e incentivo per le
      trasformazioni a tempo indeterminato di giovani dal 1/8 al 31/12/2026 (art. 4 DL 62/2026, circolare 72/2026).
    esempi:
      - profilo: ristorazione_ricettivo
        interesse: alto
        esempio: >-
          Hotel che assume a tempo indeterminato un cuoco di 28 anni senza lavoro da 8 mesi (svantaggiato) con 24.000
          euro lordi l'anno: contributi a carico circa 7.200 euro l'anno, esonero fino a 500 euro al mese per 12 mesi,
          circa 6.000 euro (7.200 se l'hotel e' in Puglia, tetto 650). Non vale per i contratti stagionali a termine
          ne' per il lavoro intermittente (a chiamata), anche se a tempo indeterminato.
      - profilo: manifattura
        interesse: alto
        esempio: >-
          Media impresa che aumenta l'organico di 4 operai: due donne senza impiego da oltre 24 mesi (Bonus Donne, fino
          a 650 euro al mese per 24 mesi: con 28.000 euro lordi circa 15.600 euro ciascuna) e due under 35
          svantaggiati (circa 6.000 euro ciascuno per 12 mesi): totale circa 43.000 euro. Nessun limite di dimensione;
          serve l'incremento netto dell'organico; si somma alla maxi-deduzione del costo dei nuovi assunti.
      - profilo: logistica
        interesse: alto
        esempio: >-
          Operatore logistico che assume 10 magazzinieri a tempo indeterminato: per ogni under 35 svantaggiato circa
          6.000 euro (12 mesi), per i molto svantaggiati fino a 12.000 euro (24 mesi), fino a 7.800 e 15.600 euro nei
          magazzini delle regioni ZES. L'incremento netto si calcola sull'intera impresa: se nello stesso periodo
          chiude un deposito e licenzia, il bonus puo' saltare. Con le agenzie di somministrazione il bonus va
          all'utilizzatore.
      - profilo: negozio
        interesse: medio
        esempio: >-
          Negozio di Bari con 4 dipendenti che assume una commessa di 40 anni disoccupata da 2 anni: Bonus ZES (ha
          meno di 10 dipendenti, 650 euro al mese) o Bonus Donne (fino a 800 euro, perche' residente nella ZES), per
          24 mesi; con 20.000 euro lordi l'anno i contributi sono circa 500 euro al mese, quindi risparmio di circa
          12.000 euro in due anni con l'uno o con l'altro (non si sommano).
      - profilo: ufficio_servizi
        interesse: medio
        esempio: >-
          Studio tecnico che assume un geometra di 23 anni al primo impiego (svantaggiato perche' sotto i 25 anni):
          esonero fino a 500 euro al mese per 12 mesi, circa 6.000 euro. Gli studi professionali sono ammessi: le
          circolari INPS valgono per tutti i datori privati, anche non imprenditori. L'apprendistato e' escluso.
      - profilo: startup
        interesse: medio
        esempio: >-
          Startup che assume a tempo indeterminato uno sviluppatore di 26 anni senza un impiego regolare da 6 mesi:
          circa 6.000 euro in 12 mesi (stipendio da 32.000 euro: contributi circa 800 euro al mese, tetto 500). Utile
          anche in perdita, perche' riduce i contributi da versare e non le tasse.
      - profilo: artigiano
        interesse: medio
        esempio: >-
          Laboratorio artigiano che assume un operaio di 30 anni disoccupato da 2 anni (molto svantaggiato): fino a
          500 euro al mese per 24 mesi, circa 12.000 euro. Molti artigiani assumono giovani in apprendistato, che
          pero' e' escluso: va confrontato con le aliquote ridotte dell'apprendistato. Al Sud, con al massimo 10
          dipendenti, per un operaio di 35 anni o piu' disoccupato da 2 anni c'e' il Bonus ZES (650 per 24 mesi).
      - profilo: agricola
        interesse: basso
        esempio: >-
          Azienda agricola che assume a tempo indeterminato un trattorista di 33 anni disoccupato da 8 mesi: circa
          6.000 euro in 12 mesi, ma l'esonero non si somma alle riduzioni contributive per le zone montane o
          svantaggiate: conviene solo se supera la riduzione gia' goduta. La maggior parte degli operai agricoli e'
          a tempo determinato (OTD), esclusi.
    fiscale: >-
      Non e' un contributo tassato ma un minor costo: il risparmio non si dichiara come ricavo, ma il costo del
      personale deducibile scende dello stesso importo, quindi salgono IRES/IRPEF e IRAP (il costo del lavoro a
      tempo indeterminato e' deducibile anche ai fini IRAP, art. 11 c. 4-octies D.Lgs. 446/1997). Esempio, srl
      in utile: 6.000 euro di esonero = circa 1.440 euro di IRES e 234 di IRAP in piu', beneficio netto circa
      4.300 euro (circa 72%). Si somma senza riduzioni alla maxi-deduzione dei nuovi assunti. Aiuto in esenzione
      GBER (art. 32), non de minimis.
    fonte_verificata_il: "2026-10-09"
  - id: fondo_garanzia_pmi
    nome: "Fondo di Garanzia per le PMI"
    aggiunta_il: 2026-10-06
    tipo: garanzia
    ente: "MIMIT; gestore Mediocredito Centrale - Banca del Mezzogiorno (fondidigaranzia.it)"
    norma: >-
      L. 23 dicembre 1996 n. 662, art. 2 comma 100 lett. a); riforma dell'art. 15-bis DL 145/2023 ("DL Anticipi")
      in vigore dal 1/1/2024, modificata dalla L. 207/2024 (art. 1 commi 450-454); regole 2025 prorogate per tutto
      il 2026 dall'art. 14 comma 1 DL 31 dicembre 2025 n. 200 (Milleproroghe); Disposizioni operative del Fondo
      (Parte IV soggetti e operazioni, Parte V commissioni, Parte VII calcolo dell'aiuto) e circolari MCC n. 21/2023
      (tabelle delle coperture), n. 20/2024 (liquidita' al 50%), n. 1/2026 (proroga), n. 2/2026 (premio aggiuntivo
      per le banche) e n. 6/2026 (sezione speciale Enti del Terzo Settore).
    url_ufficiale: "https://www.fondidigaranzia.it/prorogate-per-il-2026-le-modalita-di-funzionamento-del-fondo-di-garanzia/"
    in_vigore_dal: "2000-01-01"
    in_vigore_fino_al: null
    stato: aperto
    sintesi: >-
      Garanzia dello Stato sui finanziamenti bancari e sul leasing di PMI e professionisti: se l'impresa non paga,
      il Fondo rimborsa alla banca una parte del debito. Nel 2026 copre l'80% dei finanziamenti per investimenti
      (e quelli di startup, PMI innovative, microcredito, Nuova Sabatini, importo ridotto) e il 50% di quelli per
      liquidita', per tutte le fasce di rating ammesse (la peggiore, 5, e' esclusa). Non e' un contributo: aiuta ad
      avere il prestito, a un tasso piu' basso e senza garanzie reali, assicurative o bancarie sulla parte coperta
      (garanzie personali dei soci invece possibili). Commissione una tantum sul garantito: micro gratis, piccole
      0,5%, medie 1%; gratis al Sud, per imprese femminili, autotrasporto, startup e PMI innovative. Vale come aiuto
      di Stato per circa il 3-4% del prestito (stima). Si chiede tramite la banca o un confidi.
    a_chi_si_rivolge: >-
      Micro, piccole e medie imprese (definizione UE, con associate e collegate) iscritte al Registro delle imprese
      e professionisti iscritti agli ordini o alle associazioni professionali dell'elenco MIMIT (L. 4/2013) con
      l'attestazione prevista; consorzi. Enti del terzo settore iscritti a RUNTS e REA (operazioni fino a 60.000 euro
      senza rating); dal 21/9/2026 anche quelli iscritti solo al RUNTS e gli enti religiosi civilmente riconosciuti,
      con la sezione speciale ETS (circ. MCC 6/2026, 10 milioni, garanzia 80% gratuita). Con percentuali piu' basse le
      mid-cap (250-499 dipendenti, contando associate e collegate), ma solo dopo l'autorizzazione della Commissione
      europea: da verificare con la banca se e' operativa.

      L'impresa deve essere "economicamente e finanziariamente sana" secondo il modello di rating del Fondo, che
      usa gli ultimi due bilanci (o dichiarazioni fiscali) e la Centrale dei rischi e assegna una fascia da 1 a 5: la
      fascia 5 non e' ammessa; le fasce 1-4 hanno la stessa copertura. Per importo ridotto e microcredito il
      rating si usa solo per gestire il rischio del Fondo. Imprese nuove (meno di tre anni) senza due bilanci
      valutabili: solo per programmi di investimento, con mezzi propri gia' versati pari almeno al 25% del programma
      e un business plan triennale (Disposizioni operative, Parte IX). Toscana: la garanzia diretta della banca non e'
      ammessa per sedi in Toscana (Disposizioni operative Parte IV, B.4): si passa da un confidi o da Fidi Toscana,
      con riassicurazione del Fondo (sezione speciale regionale fino al 90%).
    soggetti_ammessi: [impresa, libero_professionista, ente_terzo_settore]
    dimensioni_ammesse: [micro, piccola, media]
    settori_esclusi: >-
      Esclusi (Disposizioni operative, tabelle 1 e 3, ATECO 2007): K attivita' finanziarie e assicurative, O
      pubblica amministrazione, T famiglie come datori di lavoro domestico, U organismi extraterritoriali, e A
      agricoltura, silvicoltura e pesca. Per l'agricoltura ci sono eccezioni: con la garanzia diretta della banca
      sono ammessi solo servizi di supporto all'agricoltura (01.6), caccia (01.7) e silvicoltura (02) se attivita'
      prevalente; le aziende agricole di produzione primaria e la pesca possono avere solo la riassicurazione
      tramite un confidi del settore agricolo, agroalimentare e della pesca, e solo in de minimis. La
      trasformazione alimentare (cantine, caseifici, frantoi come attivita' industriale, sezione C) e' ammessa
      normalmente. In alternativa per le aziende agricole c'e' la garanzia ISMEA. Esclusi anche: imprese in
      difficolta', con sofferenze, inadempienze o crediti scaduti da oltre 180 giorni verso la banca finanziatrice,
      con protesti o pignoramenti (procedure semplificate), in liquidazione, in fascia 5 di rating, con aiuti illegali
      non restituiti; operazioni legate all'esportazione (finanziamento di quantita' esportate o reti commerciali
      all'estero) e operazioni senza durata o scadenza certa.
    investimenti_ammessi: >-
      Qualsiasi finanziamento direttamente legato all'attivita' d'impresa, a breve o medio-lungo termine, anche
      leasing (l'importo e' il costo del bene meno quanto pagato prima del piano): investimenti (macchinari,
      impianti, immobili strumentali, veicoli, opere, attivi immateriali ammortizzabili come licenze software
      capitalizzate e sviluppo software esterno capitalizzato: copertura 80%), liquidita' e scorte (50%: qui
      finiscono anche pagamento di fornitori e stipendi, abbonamenti SaaS e cloud, canoni, consulenze, marketing),
      consolidamento di debiti a breve con nuova finanza di un'altra banca (50%) o della stessa banca (regole e
      tetti propri), rinegoziazione con nuova erogazione, fideiussioni legate all'attivita' tipica (es. canoni di
      locazione, forniture), operazioni sul capitale di rischio (50%), minibond, anticipi di crediti verso la PA.
      Per le imprese di autotrasporto i mezzi di trasporto sono garantiti solo alle condizioni del GBER.
      Importo massimo garantito per impresa: 5 milioni di euro nel 2026 (somma di tutte le garanzie in essere;
      nelle Disposizioni operative restano limiti piu' bassi per alcune operazioni, es. 2,5 milioni per capitale di
      rischio e 1,5 milioni per consolidamento sulla stessa banca: come si combinano con i 5 milioni, da verificare).
    categorie_spesa: [macchinari_attrezzature, software_digitale, opere_edili_impianti, immobili, veicoli, scorte_circolante]
    intensita: >-
      QUANTO COPRE (circolari MCC 21/2023 e 20/2024, prorogate al 31/12/2026). Garanzia diretta (chiesta dalla
      banca): 80% per investimenti, Nuova Sabatini, PMI innovative, importo ridotto (fino a 40.000 euro, 100.000
      tramite confidi autorizzato), microcredito (fino a 50.000), startup, startup innovative, incubatori certificati,
      enti del terzo settore (fino a 60.000); 50% per la liquidita' (dal 2025 unica per tutte le fasce: nel 2024 era
      55% per le fasce 1-2 e 60% per le fasce 3-4) e per il capitale di rischio. Mid-cap: 40% investimenti e startup
      innovative, 30% liquidita', solo con autorizzazione UE. Tramite confidi (riassicurazione): il confidi garantisce
      fino all'80% del prestito e il Fondo copre fino all'80% della garanzia del confidi; il prodotto non puo'
      superare la percentuale della garanzia diretta (es. liquidita' al massimo 50% del prestito). Le sezioni
      speciali regionali (es. Toscana fino al 90% di riassicurazione) possono alzare la copertura.

      FORMULA. Importo garantito = finanziamento x percentuale di copertura, entro 5 milioni per impresa.
      Commissione una tantum = importo garantito x aliquota per dimensione (micro 0, piccola 0,5%, media 1%,
      mid-cap 1,25%), da versare entro 3 mesi dalla delibera. Esempio: piccola impresa del Nord, mutuo di 200.000
      euro per un macchinario: garantiti 160.000 euro, commissione 800 euro; per un fido di liquidita' di 200.000
      euro: garantiti 100.000, commissione 500 euro.

      VALORE COME AIUTO (ESL, Disposizioni operative Parte VII). Il Fondo calcola il "costo di mercato" della
      garanzia come debito residuo x copertura x (0,95% per investimenti o 1,28% per circolante + 0,60% costi + 0,32%
      remunerazione) per ogni anno, attualizzato al tasso di riferimento UE, meno la commissione pagata. Stima su un
      prestito di 100.000 euro in 5 anni a rate costanti (tasso di attualizzazione 3,5%): investimento all'80%
      circa 4.200 euro per una micro (4,2%), 3.800 piccola, 3.400 media; liquidita' al 50% circa 3.100 euro (micro).
      Il numero vero e' nella delibera del Fondo e va nel Registro Nazionale Aiuti; i parametri sono quelli delle
      Disposizioni operative pubblicate dal MIMIT (aggiornamento da verificare).

      REGIME DI AIUTO. De minimis (300.000 euro in 3 anni, Reg. UE 2023/2831) o esenzione GBER (art. 17 per gli
      investimenti delle PMI). Sulla parte garantita la banca non puo' chiedere garanzie reali, assicurative o
      bancarie, ma puo' chiedere garanzie personali.
    tabella_intensita:
      - titolo: "Copertura per tipo di operazione nel 2026"
        colonne: ["Operazione", "Copertura (garanzia diretta)", "Fasce di rating", "Garantito su 100.000 euro", "Note"]
        righe:
          - ["Investimenti (macchinari, impianti, immobili, veicoli, software capitalizzato, leasing)", "80%", "1-4 uguali; 5 esclusa", "80.000 euro", "Con confidi: fino all'80% della garanzia del confidi"]
          - ["Nuova Sabatini", "80%", "1-4; modello di rating apposito", "80.000 euro", "Istruttoria con priorita'"]
          - ["Liquidita' (fornitori, stipendi, scorte, consolidamento con altra banca)", "50%", "1-4 uguali (dal 2025)", "50.000 euro", "Nel 2024 era 55-60%"]
          - ["Importo ridotto (fino a 40.000 euro; 100.000 con confidi autorizzato)", "80%", "Rating solo per gestire il rischio", "fino a 32.000 / 80.000 euro", "Procedura semplificata"]
          - ["Microcredito (fino a 50.000 euro)", "80%", "Rating solo per gestire il rischio", "fino a 40.000 euro", "Senza commissione"]
          - ["Startup, startup innovative, incubatori certificati, PMI innovative", "80%", "Nuove imprese senza bilanci: solo investimenti, mezzi propri >= 25%", "80.000 euro", "Startup innovative, incubatori e PMI innovative senza commissione"]
          - ["Enti del terzo settore (fino a 60.000 euro per operazione)", "80%", "Senza rating", "fino a 48.000 euro", "Sezione speciale gratuita per ETS senza REA ed enti religiosi"]
          - ["Capitale di rischio", "50%", "1-4", "50.000 euro", "Commissione annuale aggiuntiva 0,25-0,50%"]
          - ["Mid-cap 250-499 dipendenti", "40% investimenti, 30% liquidita'", "1-4", "40.000 / 30.000 euro", "Solo con autorizzazione UE: da verificare"]
        nota: >-
          Garantito = finanziamento x copertura, al massimo 5 milioni di euro per impresa (somma delle garanzie in
          essere). Percentuali in vigore fino al 31/12/2026 (DL 200/2025), poi decide la prossima proroga. Tramite
          confidi la percentuale e' il prodotto tra garanzia del confidi (max 80%) e riassicurazione del Fondo (max
          80%), entro la copertura della riga. Per sedi in Toscana niente garanzia diretta: solo tramite confidi.
      - titolo: "Commissioni e regole per dimensione e categoria"
        colonne: ["Categoria", "Commissione una tantum sul garantito", "Su 80.000 euro garantiti", "In pratica"]
        righe:
          - ["Micro (meno di 10 occupati, fatturato o attivo fino a 2 milioni)", "0 (DL 145/2023 art. 15-bis)", "0 euro", "Garanzia gratuita"]
          - ["Piccola (meno di 50 occupati, fino a 10 milioni)", "0,5%", "400 euro", "Si paga entro 3 mesi dalla delibera"]
          - ["Media (meno di 250 occupati, fatturato fino a 50 milioni o attivo fino a 43)", "1%", "800 euro", "Confrontare il tasso con e senza garanzia"]
          - ["Mid-cap (250-499 dipendenti)", "1,25%", "1.000 euro", "Copertura 40/30%, operativita' da verificare"]
          - ["Sede legale o operativa nel Mezzogiorno; imprese femminili; autotrasporto; imprese sociali; PMI in contratto di rete; piccole imprese dell'indotto di imprese in amministrazione straordinaria", "0 sulle operazioni ordinarie (non su consolidamento sulla stessa banca, capitale di rischio, minibond)", "0 euro", "Gratis anche per piccole e medie"]
          - ["Startup innovative, incubatori certificati, PMI innovative, microcredito, anticipo crediti verso la PA", "0 sempre", "0 euro", "Gratis per tutte le operazioni"]
          - ["Nuova Sabatini", "Come la dimensione (l'esenzione non risulta nelle Disposizioni operative)", "0 / 400 / 800 euro", "Copertura 80% e priorita' di istruttoria"]
          - ["Professionisti iscritti a ordini o associazioni L. 4/2013", "Come la dimensione", "di solito 0 (micro)", "Ammessi come le imprese"]
          - ["Aziende agricole (produzione primaria) e pesca", "-", "-", "Solo tramite confidi agricoli e in de minimis; in alternativa ISMEA"]
          - ["Agroalimentare di trasformazione (sezione C)", "Come la dimensione", "0 / 400 / 800 euro", "Ammessa come la manifattura"]
          - ["Enti del terzo settore", "0", "0 euro", "80%, fino a 60.000 euro per operazione"]
        nota: >-
          Commissioni: Disposizioni operative Parte V, tabella 5 (nella versione base micro 0,25%, azzerata dal 2024
          dal DL 145/2023) e par. 3-4 per le esenzioni. Dal 20/2/2026 le banche che usano molto la garanzia pagano un
          premio aggiuntivo al Fondo (0,5-1,5% sulle quote oltre il 30% dei loro finanziamenti, circ. MCC 2/2026): non
          e' a carico dell'impresa per legge, ma puo' pesare sulle condizioni.
      - titolo: "Quanto vale come aiuto di Stato (ESL): stime"
        colonne: ["Caso (prestito 100.000 euro, 5 anni, rate costanti)", "Garantito", "Commissione", "Aiuto stimato (ESL)", "In pratica"]
        righe:
          - ["Micro, investimento", "80.000 euro", "0", "circa 4.200 euro (4,2%)", "Consuma de minimis o intensita' GBER"]
          - ["Piccola, investimento", "80.000 euro", "400 euro", "circa 3.800 euro (3,8%)", "Con un bando sugli stessi beni conta nel tetto"]
          - ["Media, investimento", "80.000 euro", "800 euro", "circa 3.400 euro (3,4%)", "Con la Sabatini al 3,575% supera il tetto del 10%: il MIMIT riduce la Sabatini"]
          - ["Micro, liquidita'", "50.000 euro", "0", "circa 3.100 euro (3,1%)", "Di solito in de minimis"]
        nota: >-
          Formula delle Disposizioni operative Parte VII: per ogni anno debito residuo x copertura x (0,95%
          investimenti o 1,28% circolante + 0,60% + 0,32%), attualizzato, meno la commissione. Stime nostre con tasso
          di attualizzazione 3,5%; il valore ufficiale e' nella delibera del Fondo. Su 1 milione di euro i valori
          sono circa dieci volte tanto.
    beneficio_stimato:
      percentuale_min: null
      percentuale_max: null
      nota: >-
        Non e' un contributo sulla spesa: il beneficio e' poter ottenere il finanziamento, con un tasso di solito piu'
        basso e meno garanzie personali. Il valore come aiuto di Stato (equivalente sovvenzione lordo) lo calcola il
        Fondo per ogni operazione: con la formula delle Disposizioni operative, per un prestito di 5 anni e' circa il
        3-4% del finanziamento (stima; il dato ufficiale e' nella delibera). Per questo non lo esprimiamo in
        percentuale della spesa.
    come_si_ottiene: >-
      1) L'impresa chiede il finanziamento a una banca, societa' di leasing o intermediario e, insieme, la garanzia
      del Fondo (garanzia diretta); oppure si rivolge a un confidi, che garantisce e chiede la riassicurazione al
      Fondo (unica strada per le sedi in Toscana e per le aziende agricole di produzione primaria). Non si presenta
      domanda direttamente al Fondo. 2) La banca carica la richiesta sul portale del Fondo con i dati di bilancio
      per il modello di rating e, per gli investimenti, la descrizione del programma. In esenzione (GBER) la
      domanda va firmata prima di avviare l'investimento; in de minimis il programma non deve essere partito da
      piu' di 6 mesi. 3) Il Fondo delibera (Consiglio di gestione, di norma due sedute a settimana) e la banca eroga:
      almeno il 25% del finanziamento entro 6 mesi dalla delibera, a pena di decadenza della garanzia. 4) Commissione
      versata entro 3 mesi dalla delibera (se dovuta).
    tempi: >-
      Istruttoria rapida dopo l'invio della banca (di solito poche settimane, da verificare). Strumento permanente;
      le percentuali di copertura attuali valgono fino al 31/12/2026, poi dipendono dalla prossima proroga.
      Dal 20/2/2026 le banche che usano molto la garanzia pagano un premio aggiuntivo al Fondo (circ. MCC 2/2026):
      chiedere se viene ribaltato sul cliente.
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Si usa spesso insieme ai bandi a fondo perduto (per finanziare la quota non coperta), alla Nuova Sabatini e
        all'iperammortamento. L'aiuto implicito della garanzia (ESL, circa 3-4% del prestito) conta come aiuto di
        Stato: sugli stessi costi il totale degli aiuti non deve superare l'intensita' massima del regolamento usato
        (GBER, es. 20% piccole e 10% medie per l'art. 17) o il massimale de minimis dell'impresa. Per una media
        impresa con la Sabatini 4.0 (10,1%) la garanzia fa superare il 10%: il MIMIT riduce il contributo Sabatini
        (circolare Sabatini 8.11). Il Conto Termico 3.0 ammette espressamente i fondi di garanzia (DM 7/8/2025 art.
        17).
      riferimento: "Disposizioni operative del Fondo Parti V e VII; DM MASE 7/8/2025 art. 17; circolare MIMIT Nuova Sabatini 410823/2022 punto 8.11; Reg. UE 651/2014 e 2023/2831"
    attenzione: >-
      Le percentuali del 2026 sono una proroga di un anno (DL 200/2025): dal 2027 possono cambiare. Rating del Fondo:
      con bilanci deboli (fascia 5) la garanzia e' negata. Per la liquidita' la copertura e' solo il 50%. L'aiuto
      consuma il massimale de minimis se la garanzia e' concessa in quel regime: tenerne conto prima di chiedere
      altri aiuti de minimis (conta l'ESL calcolato dal Fondo, non l'importo garantito). Avviare l'investimento
      prima della domanda in esenzione fa perdere la qualifica di investimento. In Toscana e per le aziende agricole
      serve un confidi. La banca resta libera di non concedere il prestito anche con la garanzia.
    esempi:
      - profilo: startup
        interesse: alto
        esempio: >-
          Startup innovativa che chiede 150.000 euro alla banca per sviluppo prodotto e capitale circolante: copertura
          80% (120.000 euro garantiti) anche per la liquidita', senza commissione. Spesso e' l'unico modo per avere
          credito nei primi anni, quando i bilanci sono in perdita. Una startup non iscritta come innovativa, con meno
          di tre anni e senza due bilanci valutabili, e' ammessa solo per investimenti, con almeno il 25% di mezzi propri
          gia' versati e un business plan triennale.
      - profilo: artigiano
        interesse: alto
        esempio: >-
          Laboratorio che finanzia un macchinario da 60.000 euro: garanzia 80% (48.000 euro), microimpresa senza
          commissione; con la Nuova Sabatini sullo stesso finanziamento il tasso effettivo si abbassa ancora. Aiuto
          stimato circa 2.500 euro, da contare con gli altri aiuti sugli stessi beni. Per importi fino a 40.000 euro c'e'
          la procedura semplificata "importo ridotto".
      - profilo: negozio
        interesse: alto
        esempio: >-
          Negozio che rinnova arredi e vetrine con un finanziamento di 50.000 euro: garanzia 80% (40.000 euro); per un
          fido per le scorte da 30.000 euro la copertura e' il 50% (15.000 euro). Micro: nessuna commissione. In
          Toscana la stessa garanzia passa da un confidi.
      - profilo: ristorazione_ricettivo
        interesse: alto
        esempio: >-
          Hotel che ristruttura le camere con un mutuo di 800.000 euro: garanzia 80% (640.000 euro), commissione una
          tantum 0,5% del garantito se piccola impresa del Centro-Nord (3.200 euro), nulla con sede al Sud o se impresa
          femminile; sulla parte coperta la banca non puo' chiedere garanzie reali, ma puo' chiedere garanzie personali.
          Aiuto stimato circa 30.000 euro (circa 3,8% su 5 anni, di piu' con durate lunghe), da tenere nei limiti di un
          bando regionale sul turismo usato per la quota non coperta.
      - profilo: manifattura
        interesse: medio
        esempio: >-
          Media impresa che finanzia un nuovo capannone e una linea per 3 milioni: garanzia 80% (2,4 milioni, entro il
          tetto di 5 milioni per impresa), commissione 1% del garantito (24.000 euro). Aiuto stimato oltre 100.000 euro:
          con la Sabatini 4.0 sulla linea il contributo Sabatini viene ridotto per stare nel 10%. Se il rating e' buono
          la banca puo' dare il prestito anche senza: conviene confrontare il tasso con e senza garanzia.
      - profilo: logistica
        interesse: medio
        esempio: >-
          Operatore logistico che finanzia carrelli, scaffalature e furgoni per 1,2 milioni: garanzia 80% (960.000
          euro). Un'impresa di autotrasporto non paga commissione, ma per i mezzi di trasporto valgono le condizioni del
          GBER. Sopra i 250 addetti (contando le collegate) diventa mid-cap con copertura piu' bassa (40% per gli
          investimenti, commissione 1,25%, operativita' da verificare con la banca).
      - profilo: ufficio_servizi
        interesse: medio
        esempio: >-
          Societa' di consulenza che chiede 100.000 euro di liquidita' per sostenere la crescita: garanzia 50% (50.000
          euro), commissione 250 euro se piccola, nulla se micro. Vale anche per i professionisti iscritti agli ordini o
          alle associazioni L. 4/2013. Utile soprattutto se la banca chiede garanzie personali ai soci.
      - profilo: agricola
        interesse: basso
        esempio: >-
          Azienda agricola che finanzia una cella frigo da 100.000 euro: la produzione primaria non e' ammessa alla
          garanzia diretta della banca; puo' avere la riassicurazione solo tramite un confidi del settore agricolo, in
          de minimis (es. confidi all'80% e Fondo all'80% del confidi). La strada tipica e' la garanzia ISMEA. Se invece
          l'attivita' prevalente e' la trasformazione (cantina, caseificio, frantoio come impresa industriale) vale la
          regola normale: 80% per gli investimenti.
    fiscale: >-
      La garanzia non genera reddito: nessuna somma incassata, nulla da tassare ai fini IRES, IRPEF o IRAP. Gli
      interessi del prestito restano deducibili con le regole ordinarie (art. 96 TUIR per le societa'). La
      commissione e' un onere accessorio al finanziamento, imputato per competenza sulla durata; se rientri nel
      limite dell'art. 96 TUIR e se sia deducibile IRAP dipende dalla classificazione in bilancio: da verificare
      con il commercialista. Conta come aiuto di Stato per il suo ESL (de minimis o GBER, Registro nazionale aiuti).
      Esempio: piccola impresa del Nord, 200.000 euro in 5 anni, 160.000 garantiti: 800 euro di commissione una tantum.
    fonte_verificata_il: "2026-10-09"
  - id: maxi_deduzione_assunzioni
    nome: "Maxi-deduzione del costo dei nuovi assunti (120% - 130%)"
    aggiunta_il: 2026-10-06
    tipo: deduzione_maggiorata
    ente: "Agenzia delle Entrate (in dichiarazione dei redditi)"
    norma: >-
      Art. 4 D.Lgs. 30 dicembre 2023 n. 216 e suo allegato 1 (categorie al 130%); decreto attuativo MEF-Lavoro
      25 giugno 2024 (GU 3/7/2024 n. 154); prorogata per i periodi d'imposta 2025, 2026 e 2027 dalla L. 30
      dicembre 2024 n. 207, art. 1, commi 399 e 400. Chiarimenti: Agenzia delle Entrate, circolare n. 1/E del
      20/01/2025. Dal 1/1/2027 l'art. 4 e l'allegato 1 del D.Lgs. 216/2023 sono abrogati dal nuovo TUIR (D.Lgs. 19
      giugno 2026 n. 117), che riporta la misura con le stesse regole e la proroga fino al 2027 nell'art. 104,
      commi 10-18, e le categorie al 130% nell'Allegato G.
    url_ufficiale: "https://www.agenziaentrate.gov.it/portale/-/comunicato-stampa-del-20-gennaio-2025-nuove-assunzioni"
    in_vigore_dal: "2024-01-01"
    in_vigore_fino_al: "2027-12-31"
    stato: aperto
    sintesi: >-
      Chi aumenta i dipendenti a tempo indeterminato puo' dedurre dalle tasse (IRES o IRPEF) il costo dei nuovi
      assunti maggiorato del 20%, cioe' il 120%; il 130% per le categorie dell'allegato 1 (tra cui disabili e
      svantaggiati, lavoratori molto svantaggiati, alcune donne e, soprattutto, chi lavora in una sede nelle
      regioni del Sud a basso PIL). Vale per gli anni 2024-2027. Nessuna domanda: si applica in dichiarazione.
      Per una societa' in utile vale il 4,8% del costo dei nuovi assunti (7,2% al 130%); per ditte individuali,
      soci di snc e professionisti dal 4,6% al 12,9% secondo l'aliquota IRPEF. Non riduce l'IRAP.
    a_chi_si_rivolge: >-
      Imprese (societa' di capitali e cooperative, societa' di persone, ditte individuali e imprese familiari,
      enti commerciali e stabili organizzazioni di soggetti esteri) e professionisti anche associati, con reddito
      determinato in modo analitico (anche in contabilita' semplificata, con il criterio di cassa), che hanno
      esercitato effettivamente l'attivita' nei 365 giorni prima dell'inizio del periodo agevolato (per il 2026:
      attivita' iniziata entro il 1/1/2025). Esclusi: imprese in liquidazione ordinaria, liquidazione giudiziale o
      altre procedure liquidatorie, dall'inizio della procedura (le procedure di risanamento non escludono);
      forfettari; imprenditori agricoli con solo reddito agrario. Enti non commerciali solo per i dipendenti
      dell'attivita' commerciale, con contabilita' separata (se il dipendente lavora anche nell'attivita'
      istituzionale, in proporzione ai ricavi commerciali). Nessun limite di dimensione o di settore.
    soggetti_ammessi: [impresa, libero_professionista]
    dimensioni_ammesse: []
    settori_esclusi: >-
      Nessun settore escluso. Non serve a chi non ha reddito d'impresa o di lavoro autonomo determinato
      analiticamente (es. forfettari, imprese agricole con solo reddito agrario catastale), e rende poco a chi e' in perdita.
    investimenti_ammessi: >-
      Nessun investimento: il costo del personale a tempo indeterminato assunto in piu' (voci B9 del conto
      economico: salari, oneri sociali, TFR, quiescenza, altri costi; esclusi buoni pasto, formazione, vitto e
      alloggio, trasferte, auto in uso promiscuo, accantonamenti per premi; circolare 1/E/2025). Gli apprendisti
      contano come tempo indeterminato; i part-time in proporzione alle ore; i soci lavoratori di cooperativa con
      contratto subordinato come dipendenti; i somministrati se assunti a tempo indeterminato dall'agenzia (il
      beneficio va all'utilizzatore). Per le trasformazioni da tempo determinato conta il costo dalla data della
      trasformazione. Non contano collaboratori, freelance e consulenti a partita IVA, ne' i dipendenti arrivati
      con la cessione di un'azienda o ramo d'azienda, ne' quelli passati da un'altra societa' del gruppo.
      Condizioni a fine periodo d'imposta (circolare 1/E, par. 2): il numero dei dipendenti a tempo
      indeterminato al 31/12 deve superare la media dell'anno precedente (somma dei giorni da contratto di
      ciascuno diviso 365) e anche il numero complessivo dei dipendenti al 31/12 (compresi i tempi determinati)
      deve superare la media complessiva dell'anno precedente.
    categorie_spesa: [personale]
    intensita: >-
      FORMULA (art. 4 c. 3 D.Lgs. 216/2023; circolare 1/E par. 3). Base = il minore tra (a) il costo dei nuovi
      assunti a tempo indeterminato dell'anno (voci B9) e (b) l'aumento del costo complessivo del personale
      rispetto all'anno precedente (tutti i contratti, anche a termine). Maggiorazione = base x 20%, oppure x 30%
      per i nuovi assunti delle categorie dell'allegato 1. Con assunti sia al 20% sia al 30%, se l'aumento
      complessivo e' minore del costo dei nuovi assunti si divide in proporzione al costo (esempio 3 della
      circolare: nuovi assunti 1.000.000 al 20% e 600.000 al 30%, aumento del costo complessivo 1.200.000; base
      750.000 x 20% + 450.000 x 30% = 285.000 euro di maggiorazione). Risparmio = maggiorazione x aliquota (IRES
      24%; IRPEF marginale del titolare, dei soci o del professionista: 23% fino a 28.000 euro, 33% tra 28.000 e
      50.000, 43% oltre, piu' addizionali).

      ESEMPIO. Srl che assume 2 operai il 1° marzo, costo annuo pieno 36.000 euro ciascuno: nel primo anno
      conta solo il costo da marzo a dicembre, circa 60.000 euro; se il costo complessivo del personale cresce di
      almeno 60.000 euro, maggiorazione 12.000 euro, IRES risparmiata 2.880 euro. Se l'aumento complessivo e'
      solo 40.000 euro (per esempio perche' sono usciti premi o straordinari), la base e' 40.000: maggiorazione
      8.000, IRES 1.920. Il beneficio vale solo per l'anno dell'assunzione: l'anno dopo conta di nuovo solo chi
      e' assunto in piu' rispetto a quell'anno (base "mobile", circolare 1/E par. 5).

      CATEGORIE AL 130% (allegato 1 D.Lgs. 216/2023, dal 2027 allegato G del nuovo TUIR): lavoratori molto
      svantaggiati (art. 2 n. 99 Reg. UE 651/2014); persone con disabilita' (L. 68/1999), svantaggiati della
      L. 381/1991, ex degenti psichiatrici, tossicodipendenti, alcolisti, detenuti e ammessi a misure alternative;
      donne con almeno due figli minori o senza impiego regolarmente retribuito da almeno 6 mesi residenti in
      regioni ammissibili ai fondi strutturali UE e nelle aree individuate ogni anno con decreto Lavoro-MEF; donne
      vittime di violenza inserite nei percorsi di protezione con i requisiti della norma; giovani ammessi agli
      incentivi art. 27 c. 1 DL 48/2023; lavoratori con sede di lavoro in regioni che nel 2018 avevano un PIL pro
      capite sotto il 75% della media UE27, o tra il 75% e il 90% con tasso di occupazione sotto la media nazionale;
      ex percettori del reddito di cittadinanza decaduti e senza requisiti per l'Assegno di inclusione. Solo
      imposte sui redditi, non IRAP. Negli acconti non si tiene conto della maggiorazione (L. 207/2024 c. 400).
    tabella_intensita:
      - titolo: "Maggiorazione per categoria di lavoratore (esempio: nuovo assunto da 35.000 euro di costo annuo)"
        colonne: ["Categoria del nuovo assunto a tempo indeterminato", "Deduzione", "Maggiorazione su 35.000 euro", "Risparmio srl (IRES 24%)", "Risparmio ditta/soci/professionista IRPEF 33%", "Risparmio IRPEF 43%"]
        righe:
          - ["Qualunque lavoratore (anche apprendista; part-time in proporzione)", "120%", "7.000 euro", "1.680 euro", "2.310 euro", "3.010 euro"]
          - ["Sede di lavoro in una regione del Sud a basso PIL (criterio 2018: PIL sotto il 75% della media UE, o 75-90% con occupazione sotto la media)", "130%", "10.500 euro", "2.520 euro", "3.465 euro", "4.515 euro"]
          - ["Persone con disabilita' (L. 68/1999) e svantaggiati L. 381/1991 (ex detenuti, tossicodipendenti, alcolisti, ex degenti psichiatrici...)", "130%", "10.500 euro", "2.520 euro", "3.465 euro", "4.515 euro"]
          - ["Lavoratori molto svantaggiati (Reg. UE 651/2014 art. 2 n. 99: es. senza lavoro da almeno 24 mesi)", "130%", "10.500 euro", "2.520 euro", "3.465 euro", "4.515 euro"]
          - ["Donne con almeno due figli minori o senza impiego da 6 mesi, residenti nelle regioni e aree indicate dalla norma", "130%", "10.500 euro", "2.520 euro", "3.465 euro", "4.515 euro"]
          - ["Donne vittime di violenza in percorsi di protezione certificati", "130%", "10.500 euro", "2.520 euro", "3.465 euro", "4.515 euro"]
          - ["Ex percettori del reddito di cittadinanza senza requisiti per l'Assegno di inclusione", "130%", "10.500 euro", "2.520 euro", "3.465 euro", "4.515 euro"]
          - ["Giovani ammessi agli incentivi art. 27 DL 48/2023", "130%", "10.500 euro", "2.520 euro", "3.465 euro", "4.515 euro"]
        nota: >-
          Calcolo: costo annuo del nuovo assunto (voci B9) x 20% (o 30%) x aliquota. Nel primo anno conta solo il
          costo dei mesi lavorati: assunto a luglio, circa la meta'. La base non puo' superare l'aumento del costo
          complessivo del personale rispetto all'anno prima. La categoria va documentata al momento
          dell'assunzione. L'incentivo dell'art. 27 DL 48/2023 riguardava assunzioni del 2023: per le assunzioni
          2026 questa categoria e' di fatto vuota (da verificare). Elenco preciso delle regioni a basso PIL non
          indicato dall'Agenzia: con lo stesso criterio la Decontribuzione Sud usava Abruzzo, Molise, Campania,
          Puglia, Basilicata, Calabria, Sicilia e Sardegna (da verificare per questa misura).
      - titolo: "Quanto vale per forma giuridica e aliquota"
        colonne: ["Chi assume", "Imposta che si riduce", "Risparmio al 120%", "Risparmio al 130%", "In pratica"]
        righe:
          - ["Srl, spa, cooperative (qualunque dimensione)", "IRES 24%", "4,8% del costo", "7,2% del costo", "Serve un utile tassabile; in perdita aumenta la perdita riportabile"]
          - ["Ditta individuale, snc, sas, studio associato con reddito fino a 28.000 euro per persona", "IRPEF 23%", "4,6%", "6,9%", "Nelle societa' di persone la deduzione si divide tra i soci per quote"]
          - ["Ditta, soci o professionista con reddito tra 28.000 e 50.000 euro", "IRPEF 33%", "6,6%", "9,9%", "Caso tipico dell'artigiano o del piccolo negozio"]
          - ["Ditta, soci o professionista con reddito oltre 50.000 euro", "IRPEF 43%", "8,6%", "12,9%", "Il massimo; piu' le addizionali regionale e comunale"]
          - ["Forfettari", "-", "0", "0", "Esclusi"]
          - ["Imprese agricole con solo reddito agrario catastale", "-", "0", "0", "Escluse; possibile solo per attivita' con reddito d'impresa (es. societa' di trasformazione)"]
          - ["Enti non commerciali", "IRES 24%", "Solo per l'attivita' commerciale, in proporzione ai ricavi", "Idem", "Serve la contabilita' separata"]
          - ["Gruppi di societa' (controllate e collegate in Italia)", "IRES 24%", "Ridotto se altre societa' del gruppo calano", "Idem", "L'aumento deve esserci anche a livello di gruppo"]
          - ["Imprese nate da meno di 365 giorni", "-", "0", "0", "Per il 2026 l'attivita' deve essere iniziata entro il 1/1/2025"]
        nota: >-
          Nessuna differenza per dimensione (micro, piccola, media, grande) ne' per settore: conta solo come si
          tassa il reddito. Il vantaggio arriva con il saldo delle imposte dell'anno dopo (per il 2026, nel 2027),
          perche' gli acconti si calcolano senza la maggiorazione. Non riduce l'IRAP.
    beneficio_stimato:
      percentuale_min: 4.6
      percentuale_max: 12.9
      nota: >-
        Risparmio = maggiorazione x aliquota. Societa' di capitali (IRES 24%): 20% x 24% = 4,8% del costo dei nuovi
        assunti, 30% x 24% = 7,2%. Ditte individuali, soci di societa' di persone e professionisti (IRPEF 2026: 23%
        fino a 28.000 euro, 33% tra 28.000 e 50.000, 43% sopra): dal 4,6% (20% x 23%) al 12,9% (30% x 43%), piu'
        addizionali. Solo con un reddito imponibile capiente; in perdita aumenta la perdita riportabile.
    come_si_ottiene: >-
      Nessuna domanda. A fine anno il commercialista verifica le due condizioni (dipendenti a tempo
      indeterminato al 31/12 oltre la media dell'anno prima, e dipendenti totali al 31/12 oltre la media totale
      dell'anno prima, in giorni da contratto e con i part-time in proporzione), calcola il costo dei nuovi assunti
      e l'aumento del costo del personale, prende il minore, applica il 20% o 30% e deduce la maggiorazione come
      variazione in diminuzione nella dichiarazione dei redditi (codice del rigo da controllare nelle istruzioni del
      modello dell'anno). Conservare la documentazione sulle categorie di lavoratori al 130%, raccolta al momento
      dell'assunzione (es. certificazione di disabilita', stato di disoccupazione, sede di lavoro).
    tempi: "Beneficio nella dichiarazione dei redditi del periodo d'imposta dell'assunzione (2026: dichiarazione e saldo del 2027). Ultimo anno agevolato: 2027."
    cumulabilita:
      con_fondo_perduto: si
      regola: >-
        Misura fiscale generale, senza bando: non e' concessa in de minimis e non consuma quel massimale. Si somma
        espressamente, senza riduzioni, con i Bonus Giovani, Donne e ZES 2026 (DL 62/2026 art. 1 c. 9, art. 2 c. 10,
        art. 3 c. 9). Con un contributo a fondo perduto sui costi del personale: il contributo e'
        un ricavo tassato, la maggiorazione resta sul costo; eventuali divieti di cumulo del bando vanno controllati.
      riferimento: "D.Lgs. 216/2023 art. 4 (dal 2027 art. 104 c. 10-18 nuovo TUIR); L. 207/2024 art. 1 c. 399-400; circolare AE 1/E 2025; DL 62/2026"
    attenzione: >-
      Serve un aumento netto sia dei tempi indeterminati sia del totale dei dipendenti: se si assume a tempo
      indeterminato ma scadono contratti a termine non rinnovati, il beneficio puo' sparire. Le uscite contano
      tutte, anche pensionamenti e dimissioni. Le trasformazioni da tempo determinato a indeterminato aumentano i
      tempi indeterminati ma non il totale dei dipendenti: da sole non bastano (circolare 1/E). Nei gruppi si
      guarda all'incremento al netto dei cali nelle societa' controllate o collegate. Non contano i dipendenti
      ricevuti con la cessione di azienda o di contratti, ne' quelli arrivati da un'altra societa' del gruppo. Il
      costo che conta e' quello delle voci B9 del bilancio (niente buoni pasto, trasferte, formazione). Attivita' da
      almeno 365 giorni. Categorie al 130% da documentare. Concordato preventivo biennale: effetto della
      maggiorazione sul reddito concordato da verificare.
    esempi:
      - profilo: manifattura
        interesse: alto
        esempio: >-
          Srl in utile che passa da 80 a 85 dipendenti a tempo indeterminato, con 200.000 euro di costo per i 5 nuovi
          assunti (e un aumento del costo del personale almeno pari): maggiorazione 40.000 euro, risparmio IRES circa
          9.600 euro; se 2 dei 5 sono persone con disabilita' o molto svantaggiate (40.000 euro ciascuno) la
          maggiorazione diventa 48.000 euro, circa 11.500 euro di IRES. Si somma ai bonus contributivi INPS per gli
          stessi lavoratori.
      - profilo: logistica
        interesse: alto
        esempio: >-
          Operatore logistico che apre un nuovo magazzino e assume 15 persone a tempo indeterminato per 540.000 euro
          di costo: maggiorazione 108.000 euro, risparmio IRES circa 25.900 euro; se il magazzino e' in una regione
          del Sud compresa nel criterio della norma (es. Campania o Puglia), 130%: maggiorazione 162.000 euro, circa
          38.900 euro. Attenzione ai contratti a termine non rinnovati negli altri depositi: conta il totale dei
          dipendenti.
      - profilo: ristorazione_ricettivo
        interesse: medio
        esempio: >-
          Srl che gestisce un ristorante e assume 2 camerieri a tempo indeterminato (64.000 euro di costo):
          maggiorazione 12.800 euro, risparmio IRES circa 3.070 euro (circa 4.600 se il locale e' in una regione del
          Sud ammessa al 130%). Se a fine anno il numero totale dei dipendenti, stagionali a termine compresi, non
          supera la media dell'anno prima, il beneficio si perde.
      - profilo: artigiano
        interesse: medio
        esempio: >-
          Ditta individuale artigiana che assume il primo operaio a tempo indeterminato (30.000 euro di costo):
          maggiorazione 6.000 euro, risparmio IRPEF circa 1.980-2.580 euro con aliquota del 33-43% (al 130%, per
          esempio con sede in Sicilia o Calabria: 9.000 euro, circa 2.970-3.870). Serve l'attivita' da almeno un anno e
          un reddito capiente; anche un apprendista conta (l'apprendistato e' di regola a tempo indeterminato,
          circolare 1/E).
      - profilo: ufficio_servizi
        interesse: medio
        esempio: >-
          Societa' di consulenza in utile che assume un consulente junior per 40.000 euro di costo annuo: maggiorazione
          8.000 euro, risparmio IRES circa 1.920 euro; se la sede di lavoro e' in una regione del Sud ammessa al 130%,
          maggiorazione 12.000 e circa 2.880 euro. Vale anche per professionisti e studi associati con reddito
          determinato analiticamente: per un professionista al 43%, 3.440 euro (5.160 al 130%).
      - profilo: negozio
        interesse: basso
        esempio: >-
          Snc con un negozio che assume una commessa a tempo indeterminato (28.000 euro di costo): maggiorazione 5.600
          euro, divisa tra i soci, risparmio IRPEF circa 1.850-2.410 euro (33-43%). Non spetta se l'impresa e' nel
          forfettario.
      - profilo: startup
        interesse: basso
        esempio: >-
          Startup in perdita che assume 3 sviluppatori (120.000 euro di costo): la maggiorazione di 24.000 euro aumenta
          la perdita riportabile, quindi il risparmio arriva solo quando ci saranno utili. Serve anche l'attivita' da
          almeno 365 giorni prima dell'anno dell'assunzione. Meglio puntare sui bonus contributivi, che valgono subito.
      - profilo: agricola
        interesse: nullo
        esempio: >-
          Azienda agricola che dichiara solo il reddito agrario catastale: la maggiorazione non serve, perche' il
          reddito non si calcola sui costi (circolare 1/E). Puo' interessare solo se c'e' una societa' di
          trasformazione (cantina, caseificio) con reddito d'impresa e bilancio.
    fiscale: >-
      Solo imposte sui redditi (IRES o IRPEF), non IRAP. Variazione in diminuzione extracontabile nel modello
      Redditi; gli acconti dell'anno dopo si calcolano senza la maggiorazione (il vantaggio arriva con il saldo);
      in perdita aumenta la perdita riportabile. IRPEF 2026: 23% fino a 28.000 euro, 33% tra 28.000 e 50.000, 43%
      sopra. Esempio: srl con utile di 300.000 euro, 3 assunti per 120.000 euro e costo del personale +130.000:
      maggiorazione 24.000 euro, IRES risparmiata 5.760 euro, IRAP invariata.
    fonte_verificata_il: "2026-10-09"
