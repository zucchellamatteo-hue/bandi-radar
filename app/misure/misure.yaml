    beneficio_stimato:
      percentuale_min: 5
      percentuale_max: 70
      nota: >-
        Beneficio = intensita' della zona x percentuale di riparto. Massimo teorico 60% (piccola impresa
        nelle regioni meno sviluppate; 70% a Taranto) prima del riparto; con un riparto del 75% come nel 2025
        il 60% diventa 45%. Nelle zone ammesse di Abruzzo, Marche, Umbria 15-35%. Credito d'imposta da
        usare in F24: vale anche per imprese in perdita. Probabilmente tassato come contributo (vedi fiscale).
    come_si_ottiene: >-
      1) Comunicazione preventiva all'Agenzia delle Entrate con il software gratuito, nella finestra
      annuale (per il 2026: dal 31/03/2026 al 30/05/2026, gia' chiusa) con spese gia' sostenute dal 1° gennaio e
      previste fino al 31 dicembre; si puo' rimandare piu' volte nella finestra (vale l'ultima). Codice ATECO e
      comune devono coincidere con l'Anagrafe tributaria;
      2) comunicazione integrativa a investimento realizzato (per il 2026: dal 03/01/2027 al 17/01/2027),
      a pena di decadenza, con le fatture elettroniche e gli estremi della certificazione delle spese da revisore
      legale; importi non superiori alla preventiva, niente nuovi progetti o nuove strutture;
      3) utilizzo in compensazione in F24 (codice tributo 7034), solo con i servizi telematici dell'Agenzia,
      dal giorno lavorativo successivo al provvedimento con la percentuale di riparto e dopo la ricevuta di
      riconoscimento. Per leasing e acquisti senza fattura elettronica la certificazione va inviata entro 30
      giorni dal provvedimento sul riparto (servizio "Consegna documenti e istanze"); sopra 150.000 euro di credito
      (anche sommando gli anni precedenti) si usa dopo i controlli antimafia. Prossime finestre: dal 31/3 al
      30/5/2027 e dal 31/3 al 30/5/2028.
    tempi: >-
      Investimenti da concludere entro il 31/12 dell'anno (2026: entro il 31/12/2026; conta la consegna del bene).
      Il credito diventa utilizzabile dopo la comunicazione integrativa (3-17 gennaio 2027) e il provvedimento
      dell'Agenzia sulla percentuale, entro dieci giorni dalla scadenza dell'integrativa (fine gennaio 2027).
      Nessun limite annuo alle compensazioni (ne' 250.000 euro dei crediti agevolativi ne' tetto generale).
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        E' un aiuto di Stato a finalita' regionale: cumulabile con aiuti de minimis e altri aiuti di Stato
        sugli stessi costi solo se il totale non supera l'intensita' massima della Carta degli aiuti
        regionali per quella zona e impresa; cumulabile con misure che non sono aiuti di Stato (es.
        iperammortamento, che pero' si calcola sulla base netta; regole di cumulo del suo decreto da
        verificare) nei limiti della spesa sostenuta. Nel modello il credito = intensita' x costo meno gli
        altri aiuti sugli stessi beni: piccola impresa in Puglia, 400.000 euro di investimento e bando
        regionale di 100.000 euro = 240.000 - 100.000 = 140.000 euro prima del riparto. Con la Nuova Sabatini e'
        ammesso nei limiti delle intensita' (FAQ MIMIT 9.6): il contributo Sabatini, espresso in ESL, si sottrae
        allo stesso modo. Con Transizione 5.0 valgono le regole dell'art. 38 c. 18 DL 19/2024. Divieto di doppio
        finanziamento con fondi PNRR. Altri aiuti da dichiarare nel quadro D del modello.
      riferimento: "Art. 16 c. 5 DL 124/2023; DM 17/5/2024 art. 7; Reg. UE 651/2014 art. 14 e art. 8; istruzioni AdE ZES 2026"
    attenzione: >-
      Finestra di comunicazione annuale stretta: chi ha perso quella del 2026 deve aspettare il 2027
      (dal 31/3 al 30/5/2027). Il credito reale dipende dal riparto (incertezza fino al provvedimento).
      Effetto di incentivazione: il progetto (primo ordine vincolante compreso) non deve essere partito prima
      dell'entrata in vigore della misura; poiche' il credito e' stato prorogato senza interruzioni, un leasing
      firmato a febbraio 2026, prima della comunicazione, va bene (risposta AdE 169/2026), e gli acquisti 2026 di
      progetti pluriennali avviati dal 2024 si possono indicare (provvedimento 30/1/2026 punto 1.5).
      Vincoli: beni in funzione entro il secondo periodo d'imposta dopo l'acquisto; fino al quinto periodo
      d'imposta dopo l'entrata in funzione i beni non si vendono, dismettono o spostano (leasing: va
      riscattato); attivita' mantenuta nella zona per almeno 5 anni dopo il completamento, pena decadenza.
      Investimento iniziale, non semplice sostituzione. Certificazione contabile obbligatoria. Comunicazione
      integrativa a pena di decadenza, con importi non superiori alla preventiva. Con debiti a ruolo scaduti
      oltre la soglia di legge (100.000 euro fino al 2025, 50.000 dal 2026 secondo L. 199/2025 comma 116: da
      verificare sul testo) la compensazione e' bloccata (circ. AdE 16/E/2024).
    esempi:
      - profilo: manifattura
        interesse: alto
        esempio: >-
          Solo se lo stabilimento e' in una regione ZES. Esempio in Puglia: nuovo reparto con macchinari per
          2.000.000 di euro, media impresa (fuori dalla provincia di Taranto). Intensita' 50%: credito richiesto
          1.000.000 di euro, ridotto dal riparto (75% nel 2025, ipotesi): circa 750.000 euro di credito in F24. Nella
          provincia di Taranto l'intensita' sarebbe 60% (circa 900.000 euro). Serve un investimento iniziale
          (ampliamento o nuova produzione), mantenimento per 5 anni e la comunicazione nella finestra annuale
          (quella del 2026 e' chiusa).
      - profilo: ristorazione_ricettivo
        interesse: medio
        esempio: >-
          Hotel in Sicilia (piccola impresa) che costruisce nuove camere (400.000 euro) e compra attrezzature nuove
          (200.000 euro): l'immobile conta al massimo quanto il resto, quindi la spesa agevolata e' 400.000 euro.
          Credito 400.000 x 60% x 75% (riparto ipotizzato) = circa 180.000 euro. Rifare gli arredi di camere
          esistenti non e' un investimento iniziale. Finestra 2027: dal 31/3 al 30/5/2027.
      - profilo: artigiano
        interesse: medio
        esempio: >-
          Laboratorio in Campania (micro impresa) che acquista un capannone da 120.000 euro e nuove macchine per
          130.000 euro per una nuova produzione (l'immobile resta sotto la meta'): 250.000 x 60% x 75% = circa
          112.500 euro (percentuale di riparto 2026 non ancora nota). Lo stesso progetto in un comune ammesso delle
          Marche vale 250.000 x 35% x 75% = circa 65.600 euro.
          Sotto i 200.000 euro di progetto non si accede: per molti artigiani la soglia e' il vero ostacolo.
      - profilo: agricola
        interesse: medio
        esempio: >-
          Cantina o frantoio in Puglia che installa una nuova linea di imbottigliamento da 400.000 euro: con
          l'intensita' massima di una piccola impresa (60%) e un riparto del 75% il credito sarebbe circa
          180.000 euro (trasformazione con il codice "casi particolari" 2 di questo modello). La produzione
          agricola primaria ha invece un credito ZES separato (art. 16-bis DL 124/2023), con un altro modello.
      - profilo: negozio
        interesse: basso
        esempio: >-
          Un negozio arriva raramente a 200.000 euro di investimento in beni strumentali, e rifare gli arredi non e'
          un investimento iniziale. Puo' valere per l'apertura di un nuovo punto vendita importante in una regione
          ZES, con immobile (anche in leasing in costruendo) e attrezzature: es. 300.000 euro, piccola impresa in
          Calabria, circa 135.000 euro con riparto 75%.
      - profilo: ufficio_servizi
        interesse: basso
        esempio: >-
          Un ufficio di servizi difficilmente arriva a 200.000 euro di macchinari e impianti, e il software non conta.
          Caso possibile: acquisto e allestimento di una nuova sede in una regione ZES, ma l'immobile pesa al
          massimo per meta' dell'investimento agevolato.
      - profilo: logistica
        interesse: basso
        esempio: >-
          Il trasporto (autotrasporto, marittimo, aereo) e' escluso: un'impresa di autotrasporto non accede. Il
          magazzinaggio e le attivita' di supporto ai trasporti sono invece ammessi: un nuovo magazzino al Sud con
          scaffalature, carrelli e impianti puo' rientrare (media impresa in Campania, 1 milione: 500.000 teorici,
          circa 375.000 con riparto 75%).
      - profilo: startup
        interesse: basso
        esempio: >-
          Pochi beni materiali e quasi mai 200.000 euro di macchinari e impianti: di solito la ZES non serve. Il credito
          pero' si usa in F24 anche in perdita, quindi una startup del Sud che attrezza un laboratorio o una produzione
          sopra la soglia dovrebbe considerarlo. Software e persone non contano.
    fiscale: >-
      Da verificare: ne' l'art. 16 ne' il decreto attuativo dicono che il credito e' esente. Per il precedente
      credito Mezzogiorno l'Agenzia ha chiarito che e' un contributo tassabile ai fini IRES/IRPEF e IRAP
      (circ. 34/E/2016 par. 6); manca un chiarimento specifico per la ZES unica. Se tassato, lo e' come
      contributo in conto impianti, pro quota con gli ammortamenti. Esempio: 500.000 euro di macchinari al
      10%, credito 225.000: circa 6.280 euro di IRES+IRAP in piu' l'anno, vantaggio netto circa 162.000 euro
      (32% della spesa) per un'impresa in utile.
    fonte_verificata_il: "2026-10-09"
  - id: nuova_sabatini
    nome: "Nuova Sabatini (beni strumentali PMI)"
    aggiunta_il: 2026-10-05
    tipo: contributo_conto_interessi
    ente: "MIMIT, tramite banche e intermediari convenzionati (CDP-ABI)"
    norma: >-
      Art. 2 DL 21 giugno 2013 n. 69 (art. 21 DL 34/2019 per la Capitalizzazione) e successivi rifinanziamenti
      (Legge di bilancio 2026: 650 milioni, 200 per il 2026 e 450 per il 2027); DI 22 aprile 2022 (disciplina
      vigente) e DI 19 gennaio 2024 n. 43 (Capitalizzazione); circolare MIMIT n. 410823 del 6/12/2022, testo
      vigente con allegati (6/A e 6/B beni e software 4.0, 6/C certificazioni green). Aiuto in esenzione:
      art. 17 GBER (Reg. UE 651/2014), ABER (Reg. 2022/2472) per l'agricoltura, FIBER (Reg. 2022/2473) per la pesca.
    url_ufficiale: "https://www.mimit.gov.it/it/incentivi/agevolazioni-per-gli-investimenti-delle-pmi-in-beni-strumentali-nuova-sabatini"
    in_vigore_dal: "2014-03-31"
    in_vigore_fino_al: null
    stato: aperto
    sintesi: >-
      Le micro, piccole e medie imprese che comprano (o prendono in leasing) macchinari, impianti, attrezzature,
      hardware e software nuovi con un finanziamento bancario o un leasing da 20.000 euro a 4 milioni ricevono dal
      Ministero un contributo pari agli interessi di un finanziamento "di riferimento" di 5 anni: al 2,75% per i
      beni ordinari, al 3,575% per i beni 4.0 e green, al 5% (micro e piccole) o 3,575% (medie) per le societa'
      di capitali che fanno anche un aumento di capitale (Sabatini Capitalizzazione). Tradotto: dal 7,7% al 14,3%
      dell'importo finanziato. Non e' un fondo perduto sul prezzo e non abbassa la rata della banca: e' una somma
      che arriva a investimento finito (tutta insieme fino a 200.000 euro di finanziamento, altrimenti in quote
      annuali). Le grandi imprese e le mid-cap sono escluse. Sportello aperto fino a esaurimento delle risorse.
    a_chi_si_rivolge: >-
      Solo PMI secondo la definizione europea (Raccomandazione 2003/361/CE, imprese associate e collegate
      comprese; FAQ 4.3), verificata alla data della domanda (FAQ 4.2): micro (meno di 10 occupati e fatturato o
      attivo fino a 2 milioni), piccola (meno di 50 occupati e fatturato o attivo fino a 10 milioni), media (meno
      di 250 occupati e fatturato fino a 50 milioni o attivo fino a 43 milioni). Grandi imprese e mid-cap
      (come le imprese fino a 499 dipendenti che il Fondo di Garanzia ammette) sono
      escluse.

      Requisiti (circolare, punto 4): iscrizione al Registro delle imprese (o delle imprese di pesca);
      sede legale o unita' locale in Italia (un'impresa di un altro Stato UE puo' fare domanda e attivare
      l'unita' locale entro la richiesta di erogazione); non in liquidazione volontaria o procedure concorsuali
      liquidatorie; non "in difficolta'" secondo le regole UE; nessun aiuto illegale da restituire. Tutti i
      settori sono ammessi (agricoltura, pesca, trasporti compresi) tranne le attivita' finanziarie e assicurative.

      Chi puo' chiedere cosa: linea ordinaria, 4.0 e green aperte a tutte le PMI, anche ditte individuali e
      societa' di persone iscritte al Registro delle imprese; la variante Capitalizzazione solo
      alle PMI societa' di capitali (srl, spa, srls) che deliberano un aumento di capitale in denaro di almeno
      il 30% del finanziamento, senza amministratori o soci condannati per il reato dell'art. 2632 c.c.
    soggetti_ammessi: [impresa]
    dimensioni_ammesse: [micro, piccola, media]
    settori_esclusi: "Attivita' finanziarie e assicurative (sezione L ATECO 2025 secondo la FAQ 5.1). Ammessi agricoltura, pesca e trasporti (per i trasporti i mezzi solo dentro un programma di investimento, circolare 6.6)."
    investimenti_ammessi: >-
      Acquisto o leasing finanziario di macchinari, attrezzature, impianti, beni strumentali ad uso produttivo,
      hardware, software e tecnologie digitali, nuovi di fabbrica, con autonomia funzionale, correlati
      all'attivita' e nell'unita' locale dell'investimento (bilancio B.II.2-4 o B.I.3-4). Il programma deve essere
      un "investimento iniziale" nel senso dell'art. 17 GBER (circolare 6.5): nuovo stabilimento, ampliamento,
      diversificazione della produzione o cambiamento sostanziale del processo; per questo la mera sostituzione
      di un bene uguale e' esclusa.

      Tre linee, anche nella stessa domanda con importi separati (circolare 7.7):
      (1) ORDINARIA, beni strumentali; (2) 4.0, beni materiali dell'allegato 6/A (tutte e cinque le
      caratteristiche obbligatorie, due delle tre ulteriori, interconnessione dichiarata nel modulo RU) e software
      dell'allegato 6/B (MES, SCADA, CMMS, IoT industriale, cybersecurity, IA per la produzione...); (3) GREEN,
      macchinari, impianti e attrezzature a basso impatto ambientale in programmi per migliorare la sostenibilita'
      di prodotti o processi, con una certificazione dell'allegato 6/C: o dell'impresa (es. EMAS, ISO 14001) o
      del singolo bene (es. Ecolabel, EPD o autodichiarazione ambientale del produttore; FAQ 6.B.2). Un bene
      dichiarato 4.0 o green che non lo e' non viene ammesso neanche sulla linea ordinaria. Ammessi anche
      veicoli commerciali nuovi mai immatricolati usati nell'attivita', trattori e macchine agricole, colonnine
      e fotovoltaico non infisso al suolo solo dentro un programma piu' ampio (da soli solo per produttori di
      energia e aziende agricole), trasporto e montaggio capitalizzati.

      Software: solo licenze capitalizzate
      (proprieta', licenza perpetua B.I.3, licenza a tempo pagata tutta all'inizio B.I.4 e lunga almeno 3 anni;
      FAQ 6.4); abbonamenti SaaS/cloud a canone esclusi. Esclusi (circolare punto 7.4): terreni, fabbricati e
      opere murarie, beni usati, rigenerati o revamping, veicoli a km zero o gia' immatricolati e auto per
      trasporto privato, ricambi senza autonomia, consulenze, servizi, formazione, pubblicita', scorte, utenze,
      beni pagati con permute o costruiti internamente, lease-back, fatture sotto 516,46 euro, IVA e spese del
      contratto di finanziamento.
    categorie_spesa: [macchinari_attrezzature, software_digitale]
    intensita: >-
      IL FINANZIAMENTO (circolare 5.2). Lo concede una banca o una societa' di leasing aderente alla convenzione
      MIMIT-ABI-CDP, alle sue condizioni di tasso e garanzie: da 20.000 a 4.000.000 euro per impresa (conta la
      somma dei finanziamenti Sabatini ancora in corso), fino al 100% dell'investimento IVA esclusa, durata
      massima 5 anni compreso un preammortamento (o prelocazione) fino a 12 mesi, firmato solo dopo la domanda ed
      erogato in un'unica soluzione entro 30 giorni (nel leasing al fornitore, alla consegna; opzione di acquisto
      esercitata subito). Puo' avere la garanzia del Fondo di Garanzia per le PMI fino all'80%, chiesta dalla
      banca (FAQ 8.1). La banca puo' ridurre importo o durata in base al merito di credito: il contributo segue
      l'importo deliberato.

      IL CONTRIBUTO (circolare 8.1 e 8.12). E' un contributo in conto impianti pari agli interessi di un
      finanziamento convenzionale, cioe' immaginario: stesso importo del finanziamento vero, 5 anni, 10 rate
      semestrali costanti, tasso annuo fisso stabilito dalla legge. Il tasso dipende dalla linea e, solo nella
      Capitalizzazione, dalla dimensione: ordinaria 2,75% per tutte le PMI; 4.0 e green 3,575% per tutte le PMI;
      Capitalizzazione 5% per micro e piccole, 3,575% per le medie. Micro e piccole sono trattate allo stesso modo
      in tutte le linee; le medie hanno meno solo nella Capitalizzazione (stesso tasso della 4.0, nessun vantaggio
      in piu') e un tetto di aiuto piu' basso (vedi sotto). Il tasso vero della banca, il preammortamento e la
      durata reale non cambiano il contributo.

      DA DOVE VENGONO 7,7% / 10,1% / 14,3%. Ogni semestre si applica meta' del tasso annuo al debito che resta;
      le 10 rate sono uguali, quindi il debito scende e gli interessi si calcolano su un capitale medio di circa
      il 56% del finanziamento. Per questo il contributo vale circa 2,8 volte il tasso annuo, non 5 volte. In
      formula (la stessa del foglio di calcolo MIMIT): i = tasso annuo / 2; rata = F x i / (1 - (1 + i)^-10);
      contributo = 10 x rata - F. Risultato: 2,75% -> 7,72% del finanziamento; 3,575% -> 10,09%; 5% -> 14,26%.
      Esempi: su 100.000 euro 7.717 (ordinaria), 10.092 (4.0, green, Capitalizzazione medie), 14.259
      (Capitalizzazione micro e piccole); su 500.000 euro 38.587, 50.462 e 71.294; al minimo di 20.000 euro 1.543,
      2.018 e 2.852; al massimo di 4 milioni 308.695, 403.695 e 570.351. La percentuale e' sul finanziamento: se
      un bene da 100.000 euro e' finanziato per 60.000, il contributo e' sui 60.000 (circa 4,6-8,6% del costo).

      I TETTI EUROPEI. La Sabatini e' un aiuto di Stato in esenzione (non de minimis): fuori da agricoltura e pesca
      si applica l'art. 17 GBER, aiuti agli investimenti delle PMI, con intensita' massima del 20% dei costi per
      le piccole imprese (micro comprese) e del 10% per le medie, uguale in tutta Italia (non e' un aiuto
      regionale: nel Mezzogiorno non ci sono tetti piu' alti ne' tassi maggiorati). Agricoltura (ABER): 65%, con
      al massimo 600.000 euro di aiuto per progetto nella produzione primaria; pesca e acquacoltura (FIBER): 50%,
      progetti fino a 2,5 milioni di spesa e aiuto fino a 1,25 milioni l'anno (circolare 8.3-8.7, FAQ 9.1).
      L'intensita' si misura come ESL, il valore attualizzato del contributo diviso per i costi ammessi
      attualizzati (tasso di riferimento UE + 1 punto; circolare 8.9-8.10): un contributo pagato in quote annuali
      vale un po' meno della cifra nominale. Da sola la Sabatini resta di norma sotto i tetti: 7,7% e 14,3%
      contro il 20% delle piccole, 7,7% contro il 10% delle medie. Il caso stretto e' la media impresa sulle
      linee al 3,575%: il contributo nominale e' il 10,09% del finanziamento, quindi con un finanziamento pari al
      100% dell'investimento e pagamento in un'unica soluzione puo' superare di poco il 10%; se l'ESL supera il
      massimo il Ministero riduce il contributo fino al massimo concedibile e il finanziamento resta (circolare
      8.11, scritto per il cumulo con altri aiuti, Fondo di Garanzia compreso); quanto pesi in pratica: da
      verificare sul provvedimento di concessione. La stessa regola vale se sugli stessi beni ci sono altri aiuti
      di Stato (bando a fondo perduto, credito ZES, garanzia pubblica): per una media impresa il margine e'
      quasi nullo, per una piccola resta circa il 5-12% dei costi.

      NON PIU' ATTIVE O NON PARTITE. La "Sabatini Sud" (tasso 5,5% per micro e piccole del Mezzogiorno), prevista
      nel 2022, non compare nella circolare vigente ne' nella pagina MIMIT: oggi non e' una linea richiedibile.
      Nessuna linea PNRR o maggiorazione nuova risulta nel 2025-2026: le leggi di bilancio hanno solo aggiunto
      risorse.
    tabella_intensita:
      - titolo: "Contributo per linea di investimento"
        colonne: ["Linea", "Chi puo' chiederla", "Tasso convenzionale", "Contributo sul finanziamento", "Su 100.000 euro", "Su 500.000 euro"]
        righe:
          - ["Ordinaria (beni strumentali)", "Tutte le PMI, anche ditte individuali", "2,75%", "7,72%", "7.717 euro", "38.587 euro"]
          - ["4.0 (allegati 6/A e 6/B)", "Tutte le PMI", "3,575%", "10,09%", "10.092 euro", "50.462 euro"]
          - ["Green (certificazione allegato 6/C)", "Tutte le PMI", "3,575%", "10,09%", "10.092 euro", "50.462 euro"]
          - ["Capitalizzazione", "Micro e piccole societa' di capitali con aumento di capitale >= 30% del finanziamento", "5%", "14,26%", "14.259 euro", "71.294 euro"]
          - ["Capitalizzazione", "Medie societa' di capitali con aumento di capitale >= 30% del finanziamento", "3,575%", "10,09%", "10.092 euro", "50.462 euro"]
        nota: >-
          Contributo = interessi di un finanziamento immaginario di 5 anni a 10 rate semestrali costanti, stesso
          importo del finanziamento vero (formula del foglio di calcolo MIMIT). Percentuali sull'importo finanziato,
          non sul costo del bene. Fino a 200.000 euro di finanziamento il contributo arriva in un'unica soluzione,
          sopra in quote annuali.
      - titolo: "Cosa cambia con la dimensione dell'impresa"
        colonne: ["Dimensione (definizione UE)", "Linee e tassi", "Tetto di aiuto sugli stessi costi (ESL)", "In pratica"]
        righe:
          - ["Micro: meno di 10 occupati, fatturato o attivo fino a 2 milioni", "Ordinaria 2,75%; 4.0 e green 3,575%; Capitalizzazione 5% (solo se societa' di capitali)", "20% (come le piccole)", "Margine ampio: con la Capitalizzazione il 14,3%, e restano circa 5,7 punti per altri aiuti"]
          - ["Piccola: meno di 50 occupati, fatturato o attivo fino a 10 milioni", "Ordinaria 2,75%; 4.0 e green 3,575%; Capitalizzazione 5% (solo se societa' di capitali)", "20%", "Come la micro"]
          - ["Media: meno di 250 occupati, fatturato fino a 50 milioni o attivo fino a 43 milioni", "Ordinaria 2,75%; 4.0 e green 3,575%; Capitalizzazione 3,575% (nessun vantaggio sulla 4.0)", "10%", "Sulle linee al 3,575% il contributo (10,09%) e' gia' al tetto: quasi nessun margine per un bando sugli stessi beni"]
          - ["Grande impresa e mid-cap", "Escluse", "-", "Valutare iperammortamento o altri strumenti"]
          - ["PMI agricole (ABER)", "Stessi tassi", "65% (aiuto massimo 600.000 euro per progetto nella produzione primaria)", "Cumulo con altri aiuti molto piu' largo"]
          - ["PMI della pesca e acquacoltura (FIBER)", "Stessi tassi", "50% (spesa fino a 2,5 milioni)", "Cumulo largo"]
        nota: >-
          Fuori da agricoltura e pesca vale l'art. 17 GBER, uguale in tutta Italia: nessun tetto o tasso piu' alto
          nel Mezzogiorno. Se il contributo, da solo o sommato ad altri aiuti sugli stessi costi, supera il tetto,
          il Ministero lo riduce fino al massimo; il finanziamento resta (circolare 8.11).
    beneficio_stimato:
      percentuale_min: 7.7
      percentuale_max: 14.3
      nota: >-
        Percentuale dell'importo finanziato (non del costo, se il bene e' finanziato solo in parte): 7,72% con la
        linea ordinaria (2,75%), 10,09% con le linee 4.0 e green o con la Capitalizzazione delle medie (3,575%),
        14,26% con la Capitalizzazione di micro e piccole (5%). Sono gli interessi di un finanziamento immaginario
        di 5 anni a rate semestrali costanti, calcolati con la formula del foglio di calcolo MIMIT (verificata
        il 08/10/2026). Il tetto UE (20% piccole, 10% medie) puo' ridurre il contributo se ci sono altri aiuti
        sugli stessi beni.
    come_si_ottiene: >-
      1) Domanda sulla piattaforma benistrumentali.dgiai.gov.it (SPID/CNS/CIE del legale rappresentante), in bollo
      salvo agricoltura e pesca, inviata via PEC alla banca o societa' di leasing aderente insieme alla richiesta
      di finanziamento, PRIMA di qualsiasi ordine, conferma, fattura o acconto (circolare 6.7). Una domanda per
      ogni unita' locale; nella domanda si divide l'importo tra linea ordinaria, 4.0 e green. Per la
      Capitalizzazione la delibera di aumento di capitale va presa nei 6 mesi prima della domanda.

      2) La banca delibera e prenota le risorse; il Ministero concede il contributo (con la documentazione
      antimafia se supera 150.000 euro); il contratto di finanziamento si firma dopo la domanda.
      Capitalizzazione: aumento sottoscritto e versato almeno al 25% entro 30 giorni dalla concessione.

      3) Acquisto pagato con bonifico, SEPA o Ri.Ba., con CUP e dicitura "art. 2, c. 4, D.L. n. 69/2013" sulle
      fatture elettroniche; investimento completato entro 12 mesi dalla firma del finanziamento.

      4) Richiesta di erogazione (modulo RU) entro 120 giorni dal termine per completare l'investimento, con le dichiarazioni dei fornitori e, per 4.0 e green,
      le attestazioni su allegati 6/A-6/B e sulle certificazioni 6/C.
    tempi: >-
      Contributo in un'unica soluzione se il finanziamento deliberato non supera 200.000 euro (legge 234/2021,
      circolare 13.2, nei limiti delle risorse); sopra, in quote annuali secondo il piano del provvedimento di
      concessione, che si chiude entro il sesto anno dalla fine dell'investimento: la prima dopo il modulo RU, le
      successive su richiesta ogni anno, non prima di 12 mesi dalla precedente ed entro i 12 mesi successivi (FAQ
      10.6). Pagamento di norma entro 60 giorni dalla richiesta, se ci sono fondi in cassa e il DURC e' regolare.
      Capitalizzazione: con il pagamento in quote l'aumento di capitale va versato almeno in proporzione alle
      quote; in unica soluzione, tutto prima della richiesta.
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Cumulabile con altri aiuti di Stato sugli stessi costi, de minimis compresi, se il totale non supera
        l'intensita' massima applicabile in base ai regolamenti di esenzione (circolare 8.8, FAQ 9.2): nel GBER
        20% per le piccole e 10% per le medie imprese, 65% in agricoltura, 50% nella pesca. Per una media impresa
        sulle linee al 3,575% il tetto e' gia' raggiunto. Ammessa con il credito d'imposta Mezzogiorno/ZES nei
        limiti delle intensita' (FAQ 9.6). Cumulabile con misure fiscali generali che non sono aiuti di Stato
        (iperammortamento, a suo tempo crediti 4.0/5.0) entro il costo sostenuto (FAQ 9.5). Cumulabile con il
        Conto Termico (contributo in conto interessi ammesso dall'art. 17 DM 7/8/2025). Se il cumulo supera il
        tetto, il Ministero riduce il contributo Sabatini (circolare 8.11).
      riferimento: "Circolare MIMIT 410823/2022 punti 8.5-8.11; FAQ MIMIT Nuova Sabatini 9.1, 9.2, 9.5, 9.6, 9.7, 9.9, 9.10; Reg. UE 651/2014 art. 17"
    attenzione: >-
      La domanda va inviata via PEC alla banca prima dell'investimento: contratti, conferme d'ordine,
      fatture o acconti precedenti (anche lo stesso giorno) fanno perdere tutto. Il contributo non riduce la rata:
      la banca applica il suo tasso e l'impresa paga tutto il finanziamento; il contributo arriva dopo. Sportello
      fino a esaurimento risorse (al 14/09/2026 disponibili circa 1,199 miliardi Sabatini e 77 milioni
      Capitalizzazione). Dimensione d'impresa calcolata con le associate e collegate: una "piccola" che fa parte
      di un gruppo puo' risultare media o grande. Cumulo con un bando a fondo perduto sugli stessi beni spesso
      limitato dall'intensita' massima, soprattutto per le medie. I beni vanno tenuti in azienda e in uso
      produttivo per 3 anni dalla fine dell'investimento. Obbligo assicurazione catastrofale (DM 18/6/2025).
    esempi:
      - profilo: manifattura
        interesse: alto
        esempio: >-
          Media impresa, linea di produzione 4.0 da 1.200.000 euro in leasing a 5 anni: contributo al 3,575%, circa il
          10,1% del finanziamento, cioe' circa 121.100 euro, in quote annuali (sopra i 200.000 euro). Essendo media il
          tetto UE e' il 10%: il contributo e' gia' al limite (puo' essere ridotto di poco) e non resta spazio per un
          bando a fondo perduto sugli stessi beni; la Capitalizzazione non conviene (per le medie resta al 3,575%).
          Si somma all'iperammortamento entro il costo sostenuto (per prudenza, base dell'iperammortamento al netto
          del contributo). Domanda alla societa' di leasing prima dell'ordine.
      - profilo: artigiano
        interesse: alto
        esempio: >-
          Centro di lavoro 4.0 da 150.000 euro in leasing: contributo circa il 10,1% del finanziamento, cioe' circa
          15.100 euro, in un'unica soluzione perche' sotto i 200.000 euro. Se il laboratorio e' una srl micro o piccola
          e i soci versano un aumento di capitale di almeno 45.000 euro (30% del finanziamento), la Capitalizzazione
          porta il tasso al 5%: circa 14,3%, cioe' 21.400 euro. Una snc o ditta individuale resta al 10,1%. Tetto UE
          20%: resta spazio per un bando regionale sugli stessi beni. Domanda prima dell'acquisto.
      - profilo: agricola
        interesse: alto
        esempio: >-
          Trattore e attrezzature nuove per 120.000 euro finanziati in 5 anni: contributo circa 7,7%, cioe' circa
          9.300 euro (circa 12.100 se i beni sono 4.0, al 10,1%), in un'unica soluzione. L'agricoltura e' ammessa e il
          tetto di cumulo con altri aiuti e' il 65% (ABER), quindi resta molto spazio per altri aiuti sugli stessi
          beni. Domanda prima dell'acquisto.
      - profilo: logistica
        interesse: alto
        esempio: >-
          Carrelli elevatori elettrici, scaffalature e sistema di magazzino per 800.000 euro in leasing: se sono beni 4.0
          contributo circa 10,1%, cioe' circa 80.700 euro in quote annuali; serve una domanda per ogni unita' locale.
          Con piu' di 50 addetti l'impresa e' di solito media: tetto 10%, nessun margine per altri aiuti sugli stessi
          beni. Camion e furgoni nuovi mai immatricolati sono ammessi dentro un programma di investimento, non come
          semplice sostituzione di mezzi uguali (es. un Euro 6 al posto del vecchio camion: escluso).
      - profilo: ristorazione_ricettivo
        interesse: medio
        esempio: >-
          Cucina professionale nuova per 120.000 euro in leasing a 5 anni: contributo circa 7,7%, cioe' circa
          9.300 euro, in un'unica soluzione; se gli apparecchi hanno una certificazione ambientale dell'allegato 6/C
          (linea green, dentro un programma per ridurre l'impatto ambientale) circa 12.100 euro. Esclusi lavori murari e opere sull'immobile; arredi delle camere: da verificare.
      - profilo: negozio
        interesse: medio
        esempio: >-
          Banchi frigo, casse e attrezzature per 50.000 euro con un finanziamento di 5 anni: contributo circa 7,7%,
          cioe' circa 3.900 euro, in un'unica soluzione. Finanziamento minimo 20.000 euro; utile se l'attrezzatura si
          rinnova comunque a rate. Micro o piccola impresa: tetto 20%, si puo' sommare a un bando camerale.
      - profilo: ufficio_servizi
        interesse: medio
        esempio: >-
          Computer, server e licenze software perpetue per 40.000 euro: contributo circa 7,7%, cioe' circa 3.100 euro
          (circa 4.000 se i software sono dell'allegato 6/B, es. cybersecurity, al 10,1%). Niente per gli abbonamenti
          SaaS. Pratica semplice tramite la banca; non vale per comprare o ristrutturare l'ufficio.
      - profilo: startup
        interesse: basso
        esempio: >-
          Hardware e licenze per 30.000 euro finanziati: contributo circa 2.300 euro; se e' una srl e i soci versano un
          aumento di capitale di almeno 9.000 euro (variante Capitalizzazione, 5%) circa 4.300 euro. Serve che una banca
          conceda il finanziamento, non scontato per una startup in perdita (aiuta la garanzia del Fondo PMI).
    fiscale: >-
      Contributo in conto impianti (FAQ MIMIT 7.2), tassato: IRES/IRPEF pro quota con l'ammortamento (art. 88
      c. 3 TUIR; OIC 16: costo ridotto o risconto passivo); IRAP anche (art. 11 c. 3 D.Lgs. 446/1997; ditte
      individuali senza IRAP dal 2022). Niente ritenuta del 4% (art. 28 c. 2 DPR 600/1973), fuori campo IVA.
      Esempio: srl, leasing di 200.000 euro per un bene 4.0, contributo circa 20.200 euro, ammortamento in
      10 anni: circa 5.600 euro di IRES+IRAP in 10 anni, beneficio netto circa 14.600 euro.
    fonte_verificata_il: "2026-10-08"

  - id: ecobonus_imprese_2026
    nome: "Ecobonus (detrazione per la riqualificazione energetica degli edifici)"
    aggiunta_il: 2026-10-06
    tipo: detrazione_fiscale
    ente: "Agenzia delle Entrate (detrazione in dichiarazione); ENEA (comunicazione dei dati tecnici)"
    norma: >-
      Art. 14 DL 4 giugno 2013 n. 63, comma 3-quinquies (e art. 1 commi 344-347 L. 296/2006); aliquote
      2025-2027 riscritte dalla L. 30 dicembre 2024 n. 207, art. 1 comma 55; per il 2026 confermate al 36%
      (50% abitazione principale) dalla L. 30 dicembre 2025 n. 199, art. 1 comma 22 (verificato su Normattiva);
      building automation art. 1 comma 88 L. 208/2015; requisiti tecnici e limiti di detrazione DM MISE 6 agosto
      2020 (allegato B); per lavori iniziati dal 4/2/2026 anche D.Lgs. 9 gennaio 2026 n. 5 e DM 26/10/2025
      (requisiti minimi). Imprese su immobili strumentali, merce e patrimoniali: risoluzione AdE 34/E del
      25/6/2020. Dal 1/1/2027 la disciplina passa nell'art. 372 del nuovo TUIR (D.Lgs. 19 giugno 2026 n. 117),
      stesse aliquote.
    url_ufficiale: "https://www.agenziaentrate.gov.it/portale/schede/agevolazioni/detrazione-riqualificazione-energetica-55-2016/cosa-riqualificazione-55-2016"
    in_vigore_dal: "2025-01-01"
    in_vigore_fino_al: "2027-12-31"
    stato: aperto
    sintesi: >-
      Chi fa lavori di risparmio energetico su un edificio esistente (cappotto, infissi, schermature,
      pompe di calore, caldaie a condensazione, solare termico, building automation) puo' togliere dalle
      tasse (IRES o IRPEF, non IRAP) il 36% della spesa sostenuta nel 2026, in 10 rate annuali uguali.
      Per le imprese in contabilita' ordinaria conta la data di fine lavori (competenza). Vale su tutti gli
      immobili posseduti o detenuti: strumentali, beni merce o patrimonio, anche abitativi. Ogni tipo di lavoro
      ha un tetto di DETRAZIONE per unita' immobiliare (es. 60.000 euro per infissi o cappotto, 30.000 per
      l'impianto di riscaldamento): al 36% la spesa utile arriva a 166.667 euro per gli infissi, 83.333 per
      l'impianto. Il 50% spetta solo per l'abitazione principale delle persone fisiche, mai all'impresa. Nel
      2027 scende al 30%. Niente piu' cessione del credito ne' sconto in fattura: serve avere imposte da pagare.
    a_chi_si_rivolge: >-
      Tutti i contribuenti IRPEF e IRES che sostengono la spesa e possiedono o detengono l'immobile:
      societa' di capitali e di persone, ditte individuali, enti commerciali, professionisti, privati.
      Nessun limite di dimensione: anche le grandi imprese (e' una detrazione fiscale generale, non un aiuto di
      Stato). Per i titolari di reddito d'impresa la detrazione spetta a prescindere dalla destinazione
      dell'immobile ("strumentali", "beni merce" o "patrimoniali"): risoluzione AdE 34/E/2020 e guida AdE
      alla dichiarazione 2026. Anche l'inquilino o l'utilizzatore in leasing che paga i lavori, conservando
      la dichiarazione di consenso del proprietario.

      Chi ne trae davvero vantaggio: solo chi ha IRES o IRPEF da pagare ogni anno per 10 anni. Societa' di
      capitali: detrazione dall'IRES della societa'. Societa' di persone: la detrazione passa ai soci in
      proporzione alle quote e la usano nella loro IRPEF. Ditte individuali e professionisti: nella propria
      IRPEF; se il reddito complessivo supera 75.000 euro c'e' anche il tetto agli oneri detraibili dell'art.
      16-ter TUIR (in vigore dal 2025, comprende le spese edilizie): se valga anche per lavori sugli immobili
      dell'impresa e' da verificare. Forfettari: il reddito forfettario non paga IRPEF ordinaria, quindi la
      detrazione si usa solo su altri redditi, di solito non c'e' spazio.
    soggetti_ammessi: [impresa, libero_professionista]
    dimensioni_ammesse: []
    settori_esclusi: >-
      Nessun settore escluso, nessun limite di dimensione. Esclusi dal 2025 gli interventi di sostituzione
      dell'impianto di riscaldamento con caldaie uniche alimentate a combustibili fossili (anche a gas).
      Serve capienza d'imposta: chi e' in perdita o forfettario ne trae poco o nulla.
    investimenti_ammessi: >-
      Su edifici esistenti (accatastati o con accatastamento in corso) e dotati di impianto di
      riscaldamento. Limiti di DETRAZIONE (non di spesa) per unita' immobiliare (DM 6/8/2020, all. B):
      riqualificazione energetica globale 100.000 euro; coibentazione di pareti, coperture e pavimenti 60.000;
      infissi 60.000 (involucro + infissi insieme 60.000); schermature solari 60.000; collettori solari termici
      60.000; impianti di climatizzazione invernale (caldaie a condensazione, pompe di calore, sistemi
      ibridi, generatori a biomassa, scaldacqua a pompa di calore) 30.000 complessivi; microcogeneratori
      100.000; building automation 15.000, solo su unita' residenziali (vademecum ENEA 23/09/2026: classe B
      EN 15232; ammessi dispositivi, opere e spese tecniche; esclusi smartphone, tablet, PC). In piu' costi
      massimi unitari (euro/m2, euro/kW, all. I DM). Ammesse anche spese professionali (APE, asseverazione,
      direzione lavori). Senza impianto di riscaldamento ammessi solo collettori solari, schermature e
      generatori a biomassa. Non ammessi: caldaia unica a combustibili fossili, edifici nuovi o ampliamenti,
      LED e fotovoltaico, macchinari di produzione, software (licenze, gestionali, cloud/SaaS, energy
      management venduto a parte, cybersecurity, IA).

      Capannoni e uffici: il tetto vale per ogni unita' immobiliare catastale, non per metro quadro. Su un
      grande capannone (una sola unita') il tetto taglia il beneficio: 60.000 euro di detrazione su un
      cappotto da 450.000 euro sono circa il 13% della spesa.
    categorie_spesa: [energia_efficienza, opere_edili_impianti]
    intensita: >-
      ALIQUOTE. Spese 2025 e 2026: 36% (50% solo se il titolare di proprieta' o diritto reale la sostiene
      sull'abitazione principale: mai per un'impresa). Spese 2027: 30% (36% abitazione principale). Aliquota unica
      per tutti gli interventi (fino al 2024 c'erano il 65%, il 50% per infissi e caldaie e le maggiorazioni
      condominiali: dal 2025 sono spariti). Detrazione ripartita in 10 quote annuali di pari importo.

      QUANDO CONTA LA SPESA. Imprese in contabilita' ordinaria (principio di competenza, art. 109 TUIR): conta
      la fine dei lavori o i SAL accettati in via definitiva, non il pagamento: lavori finiti entro il 31/12/2026
      = 36%, finiti nel 2027 = 30%. Professionisti e imprese in contabilita' semplificata: per il sismabonus
      l'Agenzia applica la cassa (risposta 46/2018); per l'ecobonus in semplificata da verificare con il
      commercialista, per prudenza pagare entro il 31/12/2026.

      FORMULA. Detrazione = aliquota x spesa ammessa (costo rimasto a carico, al netto di eventuali contributi,
      IVA compresa solo se non detraibile), ma non oltre il tetto di detrazione dell'intervento per unita'
      immobiliare. Rata annua = detrazione / 10. Ogni anno si usa al massimo quanto l'imposta lorda (IRES o IRPEF);
      il resto si perde. Esempio: srl che cambia gli infissi per 100.000 euro + IVA (IVA detraibile), lavori finiti
      a novembre 2026: 36% x 100.000 = 36.000 euro, sotto il tetto di 60.000; 3.600 euro l'anno dal 2026 al 2035.
      Se lo stesso lavoro finisce a gennaio 2027: 30% = 30.000 euro, 3.000 l'anno. Spesa massima utile per gli
      infissi: 60.000 / 36% = 166.667 euro nel 2026, 200.000 euro nel 2027 (il tetto in euro di detrazione resta
      uguale).

      VALORE REALE. Recuperare 10 rate vale meno che incassare subito: con un tasso del 3% annuo il valore
      attuale delle 10 rate e' circa l'85% del totale (36% nominale = circa 31% "oggi"). Calcolo nostro, non
      ufficiale.

      IPOTESI 2027. Stampa di settembre 2026: il Governo studia il 65% sull'abitazione principale e il
      mantenimento del 36% per gli altri immobili dal 2027. Nessun testo approvato: vale il 30%.
    tabella_intensita:
      - titolo: "Tetti per tipo di intervento ed esempi di detrazione"
        colonne: ["Intervento", "Tetto di detrazione per unita'", "Spesa massima utile 2026 (36%)", "Spesa massima utile 2027 (30%)", "Esempio di spesa", "Detrazione 2026 (rata annua)"]
        righe:
          - ["Riqualificazione energetica globale (tutto l'edificio, indice di prestazione)", "100.000 euro", "277.778 euro", "333.333 euro", "200.000 euro", "72.000 euro (7.200 l'anno)"]
          - ["Cappotto, isolamento di coperture e pavimenti", "60.000 euro (insieme agli infissi)", "166.667 euro", "200.000 euro", "450.000 euro (copertura capannone)", "60.000 euro, tetto (6.000 l'anno; 13% della spesa)"]
          - ["Infissi", "60.000 euro (insieme all'involucro)", "166.667 euro", "200.000 euro", "100.000 euro", "36.000 euro (3.600 l'anno)"]
          - ["Schermature solari", "60.000 euro", "166.667 euro", "200.000 euro", "20.000 euro", "7.200 euro (720 l'anno)"]
          - ["Collettori solari termici", "60.000 euro", "166.667 euro", "200.000 euro", "15.000 euro", "5.400 euro (540 l'anno)"]
          - ["Climatizzazione invernale (pompe di calore, caldaie a condensazione, ibridi, biomassa)", "30.000 euro complessivi", "83.333 euro", "100.000 euro", "100.000 euro", "30.000 euro, tetto (3.000 l'anno; 30% della spesa)"]
          - ["Microcogeneratori", "100.000 euro", "277.778 euro", "333.333 euro", "50.000 euro", "18.000 euro (1.800 l'anno)"]
          - ["Building automation (solo unita' residenziali)", "15.000 euro", "41.667 euro", "50.000 euro", "10.000 euro", "3.600 euro (360 l'anno)"]
        nota: >-
          Detrazione = aliquota x spesa ammessa, fino al tetto di detrazione dell'intervento (DM 6/8/2020, all. B:
          i tetti sono in euro di detrazione, non di spesa, e restano uguali anche se l'aliquota scende; spesa
          massima utile = tetto / aliquota). Tetti per unita' immobiliare catastale. Aliquota 36% per lavori
          finiti (imprese in ordinaria) nel 2026, 30% nel 2027. Rata = detrazione / 10, usabile solo fino
          all'imposta lorda dell'anno. Oltre ai tetti valgono i costi massimi unitari (all. I DM 6/8/2020).
      - titolo: "Cosa cambia per tipo di impresa e di immobile"
        colonne: ["Caso", "Aliquota 2026 / 2027", "Regole particolari", "In pratica"]
        righe:
          - ["Societa' di capitali (srl, spa) in utile", "36% / 30%", "Detrazione dall'IRES; conta la fine lavori (competenza); bonifico parlante non obbligatorio", "Il caso migliore: rata usata per intero se l'IRES annua supera la rata"]
          - ["Societa' in perdita o con poca IRES", "36% / 30%", "La quota che supera l'imposta si perde, senza riporto ne' rimborso", "Meglio il Conto Termico (contributo subito) o rinviare i lavori"]
          - ["Societa' di persone (snc, sas)", "36% / 30%", "La detrazione va ai soci in proporzione alle quote, nella loro IRPEF", "Conta l'IRPEF dei soci; possibile tetto art. 16-ter TUIR se il socio supera 75.000 euro di reddito (da verificare)"]
          - ["Ditta individuale e professionista", "36% / 30%", "Detrazione nella propria IRPEF; professionisti: bonifico parlante e cassa", "Utile con IRPEF capiente; possibile tetto art. 16-ter TUIR sopra 75.000 euro di reddito (da verificare)"]
          - ["Forfettario", "36% / 30%", "Il reddito forfettario ha l'imposta sostitutiva, non l'IRPEF", "Di solito nessun vantaggio"]
