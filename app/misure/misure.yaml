      - titolo: "Detrazione per anno ed esempi di spesa (per unita' immobiliare)"
        colonne: ["Anno della spesa", "Aliquota impresa", "Detrazione massima (su 96.000 euro)", "Spesa 50.000 euro", "Spesa 96.000 euro", "Spesa 400.000 euro"]
        righe:
          - ["2024 (per confronto)", "50% (70-85% con riduzione delle classi di rischio)", "48.000 euro (fino a 81.600)", "25.000 euro", "48.000 euro", "48.000 euro (12%)"]
          - ["2025", "36%", "34.560 euro", "18.000 euro", "34.560 euro", "34.560 euro (8,6%)"]
          - ["2026", "36%", "34.560 euro", "18.000 euro (1.800 l'anno)", "34.560 euro (3.456 l'anno)", "34.560 euro (8,6%)"]
          - ["2027", "30%", "28.800 euro", "15.000 euro (1.500 l'anno)", "28.800 euro (2.880 l'anno)", "28.800 euro (7,2%)"]
        nota: >-
          Detrazione = aliquota x spesa, fino a 96.000 euro di spesa per unita' immobiliare (contando le spese gia'
          fatte per lo stesso intervento negli anni prima). 10 rate annuali uguali, usabili solo fino all'imposta
          lorda dell'anno. Il 50% (2026) e il 36% (2027) valgono solo per l'abitazione principale delle persone
          fisiche. Solo zone sismiche 1, 2 e 3.
      - titolo: "Cosa cambia per tipo di impresa e di immobile"
        colonne: ["Caso", "Aliquota 2026 / 2027", "Regole particolari", "In pratica"]
        righe:
          - ["Societa' di capitali in contabilita' ordinaria", "36% / 30%", "Conta la fine lavori; nessun obbligo di bonifico (risposta 46/2018)", "Rata usata per intero se l'IRES annua la supera"]
          - ["Impresa in contabilita' semplificata", "36% / 30%", "Conta il pagamento (cassa), con bonifico parlante", "Pagare entro il 31/12/2026 per avere il 36%"]
          - ["Societa' di persone (snc, sas)", "36% / 30%", "Detrazione ai soci per quote, nella loro IRPEF", "Possibile tetto art. 16-ter TUIR per soci con reddito oltre 75.000 euro (da verificare)"]
          - ["Ditta individuale e professionista", "36% / 30%", "IRPEF propria; professionisti: cassa e bonifico parlante", "Possibile tetto art. 16-ter TUIR sopra 75.000 euro (da verificare)"]
          - ["Societa' in perdita, forfettario, agricola a reddito agrario", "36% / 30%", "La quota oltre l'imposta si perde, senza riporto ne' rimborso", "Di solito poco o nessun vantaggio"]
          - ["Grande impresa", "36% / 30%", "Nessun limite di dimensione, non e' aiuto di Stato", "Ammessa; il tetto per unita' pesa molto sui grandi stabilimenti"]
          - ["Immobile strumentale (capannone, ufficio, negozio, stalla)", "36% / 30%", "Edificio adibito ad attivita' produttive in zona 1-3", "Il caso tipico; un tetto per ogni unita' catastale"]
          - ["Immobile merce (impresa edile o immobiliare)", "36% / 30%", "Ammesso (risoluzione 34/E/2020)", "In alternativa, se demolisce e ricostruisce e vende entro 30 mesi, il beneficio va agli acquirenti (sismabonus acquisti)"]
          - ["Immobile patrimonio, anche abitativo dato in affitto", "36% / 30%", "Ammesso (risoluzione 34/E/2020)", "Utile per le immobiliari di gestione"]
          - ["Impresa che compra un'unita' ricostruita antisismica (sismabonus acquisti)", "36% / 30% del prezzo", "Fino a 96.000 euro di prezzo; venditore impresa di costruzione, vendita entro 30 mesi dalla fine lavori; residenziale o no", "Fino a 34.560 euro sul prezzo di acquisto di un capannone o ufficio nuovo"]
          - ["Abitazione principale di una persona fisica", "50% / 36%", "Solo proprietario o titolare di diritto reale che ci abita", "Non riguarda l'impresa"]
          - ["Immobile in zona sismica 4", "0%", "Escluso", "Verificare la classificazione del comune"]
        nota: >-
          Il sismabonus non si somma con altre detrazioni sulla stessa spesa (ecobonus, bonus ristrutturazioni): in un
          cantiere misto si separano spese strutturali ed energetiche e ognuna ha il suo tetto.
    beneficio_stimato:
      percentuale_min: 36
      percentuale_max: 36
      nota: >-
        Per un'impresa 36% della spesa fino a 96.000 euro per unita' immobiliare (massimo 34.560 euro di
        detrazione), in 10 anni e solo con imposte capienti. Oltre il massimale la spesa non da' beneficio: su
        400.000 euro il beneficio effettivo e' l'8,6%. Nel 2027 30% (massimo 28.800 euro).
    come_si_ottiene: >-
      1) Verificare la zona sismica del comune (Protezione Civile o delibera regionale). 2) Progettista:
      classificazione del rischio prima e dopo (linee guida DM 58/2017) e asseverazione modello Allegato B
      (DM 329/2020), allegata alla SCIA o alla richiesta di permesso di costruire, comunque prima dell'inizio
      dei lavori (remissione in bonis ammessa solo in alcuni casi). 3) Pagamenti: imprese in ordinaria con
      qualsiasi mezzo tracciabile; semplificata, professionisti e privati con bonifico parlante. 4) Fine lavori:
      attestazioni di conformita' del direttore dei lavori e del collaudatore (modelli B-1 e B-2). 5) Detrazione
      in dichiarazione per 10 anni. Nessuna domanda ad enti, nessuna comunicazione ENEA.
    tempi: "Nessuna domanda: beneficio in 10 quote annuali dalla dichiarazione dell'anno della spesa (lavori finiti nel 2026: prima rata nella dichiarazione 2027)."
    cumulabilita:
      con_fondo_perduto: nei_limiti
      regola: >-
        Come l'ecobonus: con un contributo a fondo perduto (regionale o locale) la detrazione spetta in linea
        generale solo sulla spesa rimasta a carico, se il bando lo consente (da verificare caso per caso). Non
        si somma con altre detrazioni per la stessa spesa (ecobonus, bonus ristrutturazioni): in un cantiere
        misto spese strutturali ed energetiche separate. Il Conto Termico non copre lavori antisismici.
        Non richiama de minimis ne' GBER: detrazione generale. L'impresa che fa i lavori e i futuri acquirenti
        (sismabonus acquisti) non possono agevolare la stessa spesa due volte.
      riferimento: "Art. 16 DL 63/2013; prassi Agenzia Entrate (da verificare il riferimento puntuale)"
    attenzione: >-
      Solo zone sismiche 1, 2, 3 (verificare la classificazione del comune). Asseverazione del rischio
      sismico prima dell'inizio dei lavori, altrimenti la detrazione e' a rischio. Niente cessione del credito
      ne' sconto in fattura (art. 2 DL 11/2023), salvo titoli edilizi presentati prima del 17/2/2023 e alcuni
      immobili danneggiati dai terremoti in Abruzzo, Lazio, Marche e Umbria. Massimale per unita' immobiliare:
      su capannoni grandi il beneficio in percentuale e' molto piu' basso del 36%, e spezzare i lavori su piu'
      anni non raddoppia il tetto. Per le imprese in ordinaria conta la fine lavori: un cantiere finito nel 2027
      prende il 30%. Verificare con il tecnico se il lavoro rientra anche in un bando regionale per la
      sicurezza sismica delle imprese.
    esempi:
      - profilo: manifattura
        interesse: medio
        esempio: >-
          Capannone prefabbricato in zona sismica 2 (es. Emilia): adeguamento dei collegamenti tra travi e pilastri e
          della copertura per 400.000 euro. Detrazione 36% solo su 96.000 euro per unita' immobiliare: massimo 34.560 euro
          in 10 anni, circa il 9% della spesa (28.800 se i lavori finiscono nel 2027). Spesso rende di piu' un bando
          regionale per la sicurezza sismica, se c'e'.
      - profilo: logistica
        interesse: medio
        esempio: >-
          Tre magazzini su sei in zona sismica 2 o 3, ciascuno una unita' immobiliare: messa in sicurezza per 150.000 euro
          l'uno. Detrazione massima 34.560 euro per magazzino, 103.680 euro in tutto, in 10 anni. Le sedi in zona 4 restano
          fuori: verificare la classificazione di ogni comune.
      - profilo: ristorazione_ricettivo
        interesse: medio
        esempio: >-
          Hotel in un edificio storico in zona sismica 2: miglioramento sismico per 300.000 euro. Detrazione massima
          34.560 euro per unita' immobiliare (circa 11,5%), in 10 anni; se i lavori proseguono su piu' anni il massimale
          conta anche le spese gia' detratte. Serve l'asseverazione del rischio sismico prima dei lavori.
      - profilo: artigiano
        interesse: basso
        esempio: >-
          Laboratorio di proprieta' in zona sismica 3: rinforzo strutturale per 60.000 euro, detrazione 21.600 euro in
          10 anni con imposte capienti. Se la ditta e' in contabilita' semplificata conta la data del bonifico parlante.
          Utile solo se i lavori sono comunque necessari.
      - profilo: ufficio_servizi
        interesse: basso
        esempio: >-
          Ufficio in condominio: la quota dei lavori antisismici condominiali (es. 20.000 euro) da' 7.200 euro di
          detrazione in 10 anni. Solo per chi possiede o detiene l'immobile e ha imposte da pagare. Chi compra un
          ufficio in un edificio ricostruito antisismico da un costruttore entro 30 mesi puo' detrarre il 36% del
          prezzo fino a 96.000 euro (sismabonus acquisti).
      - profilo: negozio
        interesse: basso
        esempio: >-
          Negozio al piano terra di un edificio in zona sismica 1-3: quota dei lavori condominiali di 15.000 euro,
          detrazione di 5.400 euro in 10 anni. Niente in zona 4.
      - profilo: agricola
        interesse: basso
        esempio: >-
          Fienili, stalle o cantine in zona sismica 1-3 possono rientrare (edifici per attivita' agricole): 80.000 euro
          di rinforzo = 28.800 euro in 10 anni. Con il reddito agrario catastale il limite e' spesso la capienza d'imposta.
      - profilo: startup
        interesse: nullo
        esempio: >-
          Sede in affitto o in coworking e spesso in perdita: non ci sono lavori strutturali da fare ne' imposte da ridurre.
    fiscale: >-
      Detrazione dall'IRES o IRPEF lorda; non riduce l'IRAP. Non e' un contributo: nessun incasso da tassare.
      La quota che non trova capienza si perde (niente riporto ne' rimborso). Il costo dei lavori segue le
      regole ordinarie (di norma incrementa il fabbricato e si ammortizza, non la quota del terreno; sugli
      immobili merce aumenta il costo del bene); se la detrazione incida sulla deducibilita' del costo non e'
      chiarito da prassi specifica: da verificare con il commercialista. Anno della spesa: contabilita' ordinaria
      competenza, semplificata cassa (risposta AdE 46/2018). Esempio: srl in zona 2, 96.000 euro nel 2026: 3.456
      euro l'anno di IRES in meno per 10 anni; con IRES lorda di soli 2.000 euro in un anno, 1.456 euro di quella
      quota sono persi.
    fonte_verificata_il: "2026-10-09"
  - id: art_bonus
    nome: "Art Bonus (credito d'imposta per le donazioni alla cultura)"
    aggiunta_il: 2026-10-06
    tipo: credito_imposta
    ente: "Ministero della Cultura (portale artbonus.gov.it); Agenzia delle Entrate (utilizzo in F24)"
    norma: >-
      Art. 1 DL 31 maggio 2014 n. 83 (convertito dalla L. 106/2014), reso permanente dalla L. 28 dicembre
      2015 n. 208 (Legge di stabilita' 2016), con successive modifiche (donazioni ai concessionari o affidatari
      di beni culturali pubblici); circolare AdE 24/E del 31/7/2014; risoluzione AdE 116/E del 17/12/2014
      (codice tributo 6842); circolare AdE 34/E del 28/12/2023 (ammessi anche i forfettari).
    url_ufficiale: "https://artbonus.gov.it/beneficio-fiscale.html"
    in_vigore_dal: "2014-06-01"
    in_vigore_fino_al: null
    stato: aperto
    sintesi: >-
      Chi dona denaro a musei, biblioteche, archivi, monumenti e altri beni culturali pubblici, fondazioni
      lirico-sinfoniche, teatri e altri enti dello spettacolo ammessi recupera il 65% della donazione come
      credito d'imposta, in tre quote annuali uguali: la donazione costa davvero il 35%. Per le imprese il
      credito massimo e' il 5 per mille dei ricavi dell'anno (quindi donazioni utili fino a circa lo 0,77% dei
      ricavi); per persone fisiche, professionisti ed enti non commerciali il 15% del reddito imponibile.
      Le imprese lo usano in F24 (codice tributo 6842) dal periodo d'imposta successivo, anche se sono in
      perdita; il credito non e' tassato. Non e' un investimento dell'impresa: e' una donazione, quindi non si
      abbina ai bandi.
    a_chi_si_rivolge: >-
      Chiunque faccia donazioni in denaro ai beneficiari ammessi, senza limiti di forma o dimensione:
      titolari di reddito d'impresa (societa' di capitali, societa' di persone, ditte individuali,
      cooperative, imprenditori forfettari: circ. AdE 34/E/2023), persone fisiche (dipendenti, pensionati,
      professionisti, anche forfettari), enti non commerciali ed enti del Terzo settore. La dimensione
      dell'impresa, il settore e la zona (Sud, ZES) non contano: cambia solo il limite, che dipende da chi
      dona (5 per mille dei ricavi per chi ha reddito d'impresa, 15% del reddito imponibile per gli altri).
      Un ente non commerciale che dona nell'ambito della sua attivita' commerciale segue il limite delle
      imprese (portale artbonus.gov.it, FAQ sui limiti).
    soggetti_ammessi: [impresa, libero_professionista, persona_fisica, ente_terzo_settore]
    dimensioni_ammesse: []
    settori_esclusi: "Nessuno."
    investimenti_ammessi: >-
      Nessun investimento: erogazioni liberali in denaro (bonifico, carta, assegno; niente contanti) per
      a) manutenzione, protezione e restauro di beni culturali pubblici; b) sostegno di istituti e luoghi
      della cultura di appartenenza pubblica, fondazioni lirico-sinfoniche, teatri di tradizione, teatri
      nazionali e di rilevante interesse culturale, festival, imprese ed enti di produzione teatrale e di
      danza, circuiti di distribuzione, complessi strumentali, societa' concertistiche e corali, circhi e
      spettacoli viaggianti (secondo le condizioni di legge); c) realizzazione di nuove strutture, restauro
      e potenziamento di quelle esistenti di enti o istituzioni pubbliche dello spettacolo. Valgono anche le
      donazioni ai concessionari o affidatari di un bene culturale pubblico, ma solo per lavori di
      manutenzione, protezione e restauro di quel bene (FAQ artbonus.gov.it). Il beneficiario deve essere
      registrato sul portale artbonus.gov.it e comunicare ogni mese le donazioni ricevute. Enti ecclesiastici
      e privati: solo nei casi specifici indicati dal portale. Una proposta di legge (2026) per estenderlo a
      musei privati del Sistema museale nazionale, ETS e enti ecclesiastici non e' ancora legge. Non danno
      credito: donazioni in contanti o in natura (beni, servizi, ore di lavoro, software), a enti o
      interventi non pubblicati, sponsorizzazioni con ritorno pubblicitario, donazioni per acquistare beni
      culturali. Non finanzia software o digitalizzazione dell'impresa che dona.
    # Nessuna categoria di spesa: e' una donazione, non una spesa di investimento. Cosi' non compare mai
    # tra le misure "da sommare" ai bandi (cumulabili() richiede categorie in comune).
    categorie_spesa: []
    intensita: >-
      LA FORMULA. Credito = 65% della donazione, ma non piu' del limite di chi dona: per i titolari di reddito
      d'impresa il 5 per mille dei ricavi annui (ricavi degli artt. 85 e 57 TUIR, dell'anno della donazione);
      per persone fisiche ed enti non commerciali il 15% del reddito imponibile. Il limite riguarda il
      credito, non la donazione: la donazione massima che da' credito pieno e' limite / 0,65. Per un'impresa
      quindi donazione utile massima = ricavi x 0,005 / 0,65, cioe' circa lo 0,77% dei ricavi. La parte di
      donazione sopra questa soglia non da' credito (e non si puo' dedurre).

      ESEMPIO DEL PORTALE. Societa' con 20 milioni di ricavi: credito massimo 100.000 euro (5 per mille),
      donazioni utili fino a 153.846 euro (100.000 / 0,65).

      LE TRE QUOTE. Il credito si divide in tre quote annuali uguali. Imprese: in F24 (codice 6842), al
      massimo un terzo l'anno, dal primo giorno del periodo d'imposta successivo alla donazione; la quota non
      usata si riporta negli anni seguenti senza limiti di tempo. Persone fisiche ed enti non commerciali: in
      dichiarazione dei redditi, il primo terzo gia' in quella dell'anno della donazione, il resto nei due anni
      dopo, con riporto senza limiti di tempo. Esempio: srl con 3 milioni di ricavi che dona 15.000 euro a
      novembre 2026: limite 15.000 euro di credito, credito 9.750 euro, cioe' 3.250 euro l'anno in F24 nel
      2027, 2028 e 2029; costo vero della donazione 5.250 euro.

      NESSUNA DIFFERENZA PER DIMENSIONE O ZONA: stessa percentuale per micro, piccole, medie e grandi
      imprese, in tutta Italia. Il credito non e' tassato (vedi fiscale).
    tabella_intensita:
      - titolo: "Quanto si recupera: credito per livello di ricavi (imprese)"
        colonne: ["Ricavi annui", "Credito massimo (5 per mille)", "Donazione utile massima", "Quota annua in F24", "Esempio di donazione e credito"]
        righe:
          - ["200.000 euro", "1.000 euro", "1.538 euro", "333 euro", "1.000 euro donati: 650 euro di credito, 217 l'anno"]
          - ["500.000 euro", "2.500 euro", "3.846 euro", "833 euro", "3.000 euro donati: 1.950 euro di credito, 650 l'anno"]
          - ["1 milione", "5.000 euro", "7.692 euro", "1.667 euro", "5.000 euro donati: 3.250 euro di credito, 1.083 l'anno"]
          - ["2 milioni", "10.000 euro", "15.385 euro", "3.333 euro", "10.000 euro donati: 6.500 euro di credito, 2.167 l'anno"]
          - ["5 milioni", "25.000 euro", "38.462 euro", "8.333 euro", "30.000 euro donati: 19.500 euro di credito, 6.500 l'anno"]
          - ["20 milioni (esempio del portale)", "100.000 euro", "153.846 euro", "33.333 euro", "153.846 euro donati: 100.000 euro di credito"]
          - ["50 milioni", "250.000 euro", "384.615 euro", "83.333 euro", "100.000 euro donati: 65.000 euro di credito, 21.667 l'anno"]
        nota: >-
          Credito = 65% della donazione, nel limite del 5 per mille dei ricavi dell'anno; donazione utile
          massima = credito massimo / 0,65 (circa lo 0,77% dei ricavi). Oltre quella soglia la donazione non da'
          credito. Quote in F24 dal periodo d'imposta successivo alla donazione, un terzo l'anno, riporto senza
          limiti di tempo. In ogni caso la donazione costa davvero il 35% di quanto si dona.
      - titolo: "Cosa cambia secondo chi dona"
        colonne: ["Chi dona", "Limite del credito", "Come si usa", "In pratica"]
        righe:
          - ["Societa' di capitali (srl, spa, cooperative), di qualunque dimensione", "5 per mille dei ricavi", "F24, codice 6842, un terzo l'anno dal periodo successivo", "Si usa anche in perdita, contro IVA, ritenute e contributi in F24; nessun limite annuo di compensazione"]
          - ["Societa' di persone e ditte individuali (contabilita' ordinaria o semplificata)", "5 per mille dei ricavi", "F24, codice 6842 (titolari di reddito d'impresa)", "Come le societa': conta la dimensione dei ricavi, non il numero di addetti"]
          - ["Imprenditori forfettari", "Ammessi (circ. AdE 34/E/2023); 5 per mille dei ricavi secondo la prassi, da verificare", "F24 (quadro RU), da verificare", "Ammessi dal 2023; importi piccoli: con 60.000 euro di ricavi il credito massimo e' 300 euro"]
          - ["Professionisti (anche forfettari)", "15% del reddito imponibile (per i forfettari base esatta da verificare)", "Dichiarazione dei redditi, primo terzo nell'anno della donazione", "Limite di solito piu' largo che per le imprese: con 60.000 euro di reddito imponibile il credito massimo e' 9.000 euro"]
          - ["Persone fisiche (titolare o soci a titolo personale)", "15% del reddito imponibile", "Dichiarazione dei redditi, primo terzo nell'anno della donazione", "Il socio che dona in proprio usa il suo limite, non quello dell'impresa"]
          - ["Enti non commerciali ed ETS", "15% del reddito imponibile; 5 per mille dei ricavi se dona nell'attivita' commerciale", "Dichiarazione (F24 se attivita' commerciale)", "Utile alle fondazioni d'impresa che sostengono la cultura del territorio"]
          - ["Imprese agricole a reddito agrario (catastale)", "Da verificare con il commercialista", "Da verificare", "Caso non chiarito dalle fonti consultate"]
        nota: >-
          La dimensione dell'impresa (micro, piccola, media, grande), il settore e la zona (Sud, ZES) non
          cambiano nulla: stessa percentuale del 65% per tutti. Conta solo se chi dona ha reddito d'impresa
          (limite sui ricavi) o no (limite sul reddito imponibile). Fonte: artbonus.gov.it, pagina Benefici
          fiscali e FAQ sui limiti; circ. AdE 24/E/2014 e 34/E/2023.
    beneficio_stimato:
      percentuale_min: 65
      percentuale_max: 65
      nota: >-
        65% della donazione (non di un investimento), nel limite del 5 per mille dei ricavi per le imprese
        (donazioni utili fino a circa lo 0,77% dei ricavi): es. ricavi di 2 milioni, credito massimo 10.000
        euro, cioe' donazioni utili fino a circa 15.385 euro. Per persone fisiche e professionisti il limite
        e' il 15% del reddito imponibile.
    come_si_ottiene: >-
      1) Scegliere un beneficiario e un progetto registrati su artbonus.gov.it. 2) Donare con mezzi
      tracciabili (bonifico, carta, assegno) indicando la causale Art Bonus. 3) Conservare la ricevuta e il
      documento del pagamento, che devono mostrare il carattere di donazione e il beneficiario. 4) Imprese:
      indicare il credito in dichiarazione (quadro RU) e usarlo in F24 (codice tributo 6842), un terzo
      all'anno, dal primo giorno del periodo d'imposta successivo alla donazione. Professionisti e persone
      fisiche lo usano in dichiarazione, gia' in quella dell'anno della donazione. Nessuna domanda e nessuna
      graduatoria: il credito spetta per legge.
    tempi: "Nessuna domanda: per le imprese credito in tre quote annuali in F24, dal primo giorno del periodo d'imposta successivo alla donazione; per le persone fisiche in tre dichiarazioni, a partire da quella dell'anno della donazione."
    cumulabilita:
      con_fondo_perduto: si
      regola: >-
        Non riguarda le spese dei bandi: e' una donazione, non tocca i costi di un progetto agevolato.
        Sulla stessa donazione la legge disapplica la deduzione dell'art. 100 c. 2 lett. f) e g) TUIR (e la
        detrazione del 19% per le persone fisiche): niente doppio beneficio; altre deduzioni per erogazioni
        liberali sulla stessa somma (es. art. 100 lett. m): da valutare con il commercialista. La donazione
        non deve avere un ritorno per l'impresa (altrimenti e' una sponsorizzazione, con un trattamento
        fiscale diverso).
      riferimento: "Art. 1 DL 83/2014; circolare AdE 24/E/2014; artbonus.gov.it, pagina Benefici fiscali"
    attenzione: >-
      Solo donazioni in denaro e tracciabili; beneficiario e intervento devono essere tra quelli ammessi
      dalla legge e pubblicati sul portale. Limite del 5 per mille dei ricavi: oltre, la parte di donazione
      non da' credito. Ai concessionari o affidatari di beni pubblici solo per manutenzione, protezione e
      restauro. I beneficiari devono comunicare ogni mese al Ministero le donazioni ricevute e pubblicarne
      l'uso. Utile per clienti che fanno gia' mecenatismo; non e' un incentivo agli investimenti.
    esempi:
      - profilo: manifattura
        interesse: medio
        esempio: >-
          Ricavi di 20 milioni: credito massimo 100.000 euro (5 per mille), cioe' donazioni utili fino a circa
          153.800 euro. Donando 30.000 euro al restauro di un monumento del territorio il credito e' 19.500 euro in tre
          anni (6.500 l'anno in F24): costo reale 10.500 euro. Ha senso se l'impresa fa gia' mecenatismo; non deve
          esserci un ritorno pubblicitario.
      - profilo: logistica
        interesse: medio
        esempio: >-
          Ricavi di 30 milioni: tetto di 150.000 euro di credito (donazioni utili fino a circa 230.800 euro). Una
          donazione di 20.000 euro al teatro della citta' della sede principale vale 13.000 euro di credito in tre
          quote da circa 4.333 euro, da usare in F24. Non si abbina ai bandi: e' una scelta di legame con il territorio.
      - profilo: ristorazione_ricettivo
        interesse: basso
        esempio: >-
          Hotel con ricavi di 2 milioni: credito massimo 10.000 euro, donazioni utili fino a circa 15.400 euro.
          Es. 5.000 euro al museo cittadino: credito di 3.250 euro in tre anni (circa 1.083 l'anno). Senza ritorno
          pubblicitario diretto (altrimenti e' una sponsorizzazione).
      - profilo: ufficio_servizi
        interesse: basso
        esempio: >-
          Societa' di servizi con ricavi di 1 milione: credito massimo 5.000 euro, donazioni utili fino a circa
          7.700 euro. Es. 3.000 euro a una biblioteca pubblica: credito di 1.950 euro in tre anni. Uno studio
          professionale (non impresa) ha invece il limite del 15% del reddito imponibile del professionista e usa il
          credito in dichiarazione.
      - profilo: negozio
        interesse: basso
        esempio: >-
          Ricavi di 600.000 euro: credito massimo 3.000 euro, donazioni utili fino a circa 4.600 euro (es. 2.000 euro
          donati, 1.300 euro di credito in tre anni). Se il titolare dona a titolo personale usa il limite del 15% del
          suo reddito imponibile, spesso piu' largo. Scelta personale, non un incentivo.
      - profilo: artigiano
        interesse: basso
        esempio: >-
          Ricavi di 500.000 euro: credito massimo 2.500 euro, donazioni utili fino a circa 3.850 euro. Utile solo
          se il titolare vuole sostenere un bene culturale del posto.
      - profilo: agricola
        interesse: basso
        esempio: >-
          Una societa' agricola con ricavi di 1,5 milioni puo' recuperare fino a 7.500 euro di credito (donazioni
          utili fino a circa 11.500 euro). Per le imprese agricole a reddito catastale il limite applicabile (5 per
          mille dei ricavi o 15% del reddito imponibile) e' da verificare con il commercialista.
      - profilo: startup
        interesse: basso
        esempio: >-
          Con ricavi di 200.000 euro il tetto e' 1.000 euro di credito (donazioni utili fino a circa 1.540 euro): di
          fatto irrilevante. Il credito si usa in F24 anche in perdita, ma gli importi restano piccoli. Regalare
          software o servizi al museo non da' credito.
    fiscale: >-
      Il credito non e' tassato: non rileva ai fini IRES/IRPEF (comprese addizionali) ne' IRAP, e non conta per
      gli artt. 61 e 109 c. 5 TUIR (circ. AdE 24/E/2014). La donazione pero' non si deduce (disapplicata la
      deduzione art. 100 c. 2 lett. f e g TUIR). Nessun limite RU (art. 1 c. 53 L. 244/2007) ne' limite
      generale alle compensazioni (circ. AdE 34/E/2023). Esempio: srl con 3 milioni di ricavi dona 15.000 euro
      a novembre 2026: credito 9.750 euro, 3.250 l'anno in F24 dal 2027 al 2029; costo netto 5.250 euro (35%).
    fonte_verificata_il: "2026-10-09"
  - id: incentivi_assunzione_2026
    nome: "Incentivi all'assunzione 2026 (Bonus Giovani, Bonus Donne, Bonus ZES)"
    aggiunta_il: 2026-10-06
    tipo: decontribuzione
    ente: "INPS (domanda e controllo delle risorse), per conto del Ministero del Lavoro"
    norma: >-
      DL 30 aprile 2026 n. 62 ("decreto Lavoro 2026"), art. 1 (Bonus Donne), art. 2 (Bonus Giovani),
      art. 3 (Bonus ZES), art. 7 (trattamento economico minimo); convertito dalla L. 25 giugno 2026 n. 112
      (testo vigente degli artt. 1-3 verificato su Normattiva). Istruzioni INPS: circolari
      n. 55 (Giovani), n. 56 (ZES) e n. 57 (Donne) del 14/05/2026; domande aperte con i messaggi n. 1966,
      1968 e 1970 dell'11/06/2026. Aiuti in esenzione: Reg. UE 651/2014 (GBER), art. 32 (lavoratori
      svantaggiati e molto svantaggiati); categorie di svantaggio dal DM Lavoro 17/10/2017. Il Bonus Donne e'
      finanziato dal Programma nazionale Giovani, donne e lavoro 2021-2027 (FSE+).
    url_ufficiale: "https://www.inps.it/it/it/inps-comunica/notizie/dettaglio-news-page.news.2026.06.bonus-inps-2026-al-via-le-domande-per-giovani-donne-e-zes.html"
    in_vigore_dal: "2026-01-01"
    in_vigore_fino_al: "2026-12-31"
    stato: aperto
    sintesi: >-
      Chi assume a tempo indeterminato nel 2026 (dal 1/1 al 31/12) un giovane under 35, una donna o, al Sud,
      un disoccupato di lungo periodo, non paga i contributi INPS a suo carico (esonero del 100%, premi INAIL
      esclusi) fino a un tetto mensile per lavoratore: Giovani 500 euro (650 se il posto di lavoro e' in una
      regione ZES), Donne 650 euro (800 se la lavoratrice risiede in una regione ZES), ZES 650 euro (solo
      datori fino a 10 dipendenti). Dura 24 mesi per i lavoratori "molto svantaggiati" (senza lavoro da 2 anni,
      o da 1 anno con un'altra difficolta') e 12 mesi per gli "svantaggiati"; il Bonus ZES sempre 24 mesi.
      Su uno stipendio di 24.000 euro lordi si risparmiano da 6.000 a 14.400 euro per lavoratore. Valgono
      per tutti i datori privati, anche studi professionali ed enti; si chiedono all'INPS online, anche prima
      di assumere, fino a esaurimento dei fondi annuali.
    a_chi_si_rivolge: >-
      Datori di lavoro privati, anche non imprenditori (studi professionali, associazioni, fondazioni, ETS:
      le circolari INPS 55, 56 e 57, par. 2, li ammettono "a prescindere" dalla natura di imprenditore),
      compreso il settore agricolo; esclusa la pubblica amministrazione. Contano le assunzioni a tempo
      indeterminato, anche part-time (tetto ridotto in proporzione), dei soci lavoratori di cooperative e a
      scopo di somministrazione (il beneficio va all'utilizzatore). Esclusi: lavoro domestico, apprendistato,
      lavoro intermittente anche a tempo indeterminato, prestazioni occasionali, tempo determinato,
      trasformazioni di contratti a termine; i dirigenti sono esclusi nel Bonus ZES (per Giovani e Donne le
      circolari non li escludono).

      Bonus Giovani (art. 2): lavoratori che alla data dell'assunzione non hanno compiuto 35 anni e sono
      "molto svantaggiati" (24 mesi di esonero): senza un impiego regolarmente retribuito da almeno 24 mesi,
      oppure da almeno 12 mesi e in piu' senza diploma superiore (o diplomati da meno di 2 anni senza primo
      impiego), adulti che vivono soli con persone a carico, del genere sottorappresentato in professioni o
      settori con forte disparita' uomo-donna (DM 31/12/2025 n. 3795), o di una minoranza etnica; oppure
      "svantaggiati" (12 mesi): una sola di queste condizioni, o senza impiego regolare da almeno 6 mesi, o
      con eta' tra 15 e 24 anni. Nessun limite di dimensione del datore.

      Bonus Donne (art. 1): donne di qualsiasi eta', ovunque residenti. Molto svantaggiate (24 mesi): senza
      impiego regolarmente retribuito da almeno 24 mesi, o da almeno 12 mesi e in piu' una condizione tra
      15-24 anni, senza diploma, oltre 50 anni, vive sola con persone a carico, settore o professione con
      disparita' di genere, minoranza etnica. Svantaggiate (12 mesi): una sola di queste condizioni, o senza
      impiego regolare da almeno 6 mesi. Nessun limite di dimensione; vincoli del Programma nazionale Giovani,
      donne e lavoro 2021-2027 (fondi divisi per categoria di regione).

      Bonus ZES (art. 3): solo datori con al massimo 10 dipendenti nel mese dell'assunzione (contati al netto
      dei lavoratori per cui si chiede il bonus; le variazioni successive non contano), con il posto di lavoro
      effettivo in Abruzzo, Basilicata, Calabria, Campania, Marche, Molise, Puglia, Sicilia, Sardegna o Umbria
      (conta dove si lavora, non la sede legale ne' la residenza del lavoratore); lavoratori di almeno 35 anni
      disoccupati da almeno 24 mesi; personale non dirigente.

      "Senza impiego regolarmente retribuito" (DM 17/10/2017): nel periodo indicato nessun lavoro dipendente
      di almeno 6 mesi e nessuna collaborazione con reddito sopra la soglia esente da imposte.
    soggetti_ammessi: [impresa, libero_professionista, ente_terzo_settore]
    dimensioni_ammesse: []
    settori_esclusi: >-
      Nessun settore escluso in quanto tale; esclusi pubblica amministrazione, lavoro domestico, apprendistato,
      lavoro intermittente, dirigenti (nel Bonus ZES).
      Non spetta per lavoratori occupati in Paesi extra UE non convenzionati. In agricoltura ed edilizia l'esonero
      sostituisce (non si somma a) le riduzioni contributive di settore: va fatto il conto di cosa conviene.
    investimenti_ammessi: >-
      Nessun investimento: si agevola il costo dei contributi previdenziali a carico del datore di lavoro per le
      nuove assunzioni a tempo indeterminato fatte nel 2026. Non valgono le trasformazioni di contratti a termine
      (per i giovani c'e' una misura a parte, art. 4 DL 62/2026, per le trasformazioni dal 1/8 al 31/12/2026).
      Condizioni comuni: incremento occupazionale netto mensile in ULA rispetto alla media dei 12 mesi
      precedenti, calcolato sull'intera organizzazione (non sulla singola sede) e al netto dei cali nelle
      societa' controllate o collegate; non serve se il posto si e' liberato per dimissioni, invalidita',
      pensionamento, riduzione volontaria dell'orario o licenziamento per giusta causa; se in un mese
      l'incremento manca, si perde quel mese. Poi: DURC regolare, rispetto dei contratti collettivi, nessun
      licenziamento collettivo o per giustificato motivo oggettivo nella stessa unita' produttiva nei 6 mesi
      prima; il licenziamento per giustificato motivo oggettivo del lavoratore agevolato (o di uno con la stessa
      qualifica nella stessa unita') nei 6 mesi dopo comporta revoca e restituzione; trattamento economico non
      inferiore a quello dei contratti collettivi indicati dall'art. 7; principi generali dell'art. 31 D.Lgs.
      150/2015 (es. diritti di precedenza, assunzioni obbligatorie per legge o per cambio appalto escluse);
      impresa non in difficolta' e senza aiuti illegali da restituire. Non finanzia investimenti ne'
      software, ma vale per qualunque profilo assunto, compresi sviluppatori e tecnici digitali.
    categorie_spesa: [personale]
    intensita: >-
      LA FORMULA. Esonero mensile = il minore tra (a) i contributi previdenziali a carico del datore per quel
      lavoratore nel mese e (b) il tetto mensile del bonus, ridotto in proporzione se il lavoratore e' part-time
      (circolari INPS, par. 5). Risparmio totale = esonero mensile x mesi (12 o 24). Esempio: impiegato con
      24.000 euro lordi l'anno, cioe' 2.000 euro al mese medi (ratei di tredicesima compresi); contributi
      esonerabili circa 30%, cioe' 600 euro al mese; Bonus Giovani svantaggiato: tetto 500, quindi 500 x 12 =
      6.000 euro; se il posto di lavoro e' in Puglia (tetto 650) l'esonero copre tutti i 600 euro: 7.200 euro.
      Part-time al 50%: tetto 250 (Giovani) o 325 (Donne, ZES). Per i mesi iniziati o finiti a meta' il tetto
      si conta a giorni: 16,12 euro (500/31), 20,96 (650/31), 25,80 (800/31).

      COSA E' ESONERATO. 100% dei contributi previdenziali a carico del datore; restano da pagare i premi
      INAIL, il contributo al Fondo di Tesoreria per il TFR (dove dovuto), lo 0,30% per i fondi
      interprofessionali, i contributi ai fondi di solidarieta' bilaterali e i contributi di solidarieta'. La
      quota "esonerabile" e' quindi un po' piu' bassa dell'aliquota totale: il 30% usato negli esempi e'
      indicativo, quella vera dipende da contratto, settore e dimensione (da verificare nel cedolino).
      L'aliquota pensionistica del lavoratore non cambia.

      TETTI E DURATE. Bonus Giovani 500 euro al mese (650 se il posto di lavoro e' in una regione ZES; se il
      lavoratore viene trasferito fuori, dal mese dopo torna a 500), 24 mesi per i molto svantaggiati e 12 per
      gli svantaggiati. Bonus Donne 650 euro (800 se la lavoratrice risiede in una regione ZES alla data
      dell'assunzione, ovunque lavori), 24 o 12 mesi. Bonus ZES 650 euro per 24 mesi. Il periodo si
      sospende solo per maternita' obbligatoria. Se un precedente datore ha usato solo una parte del bonus, il
      nuovo datore prosegue per i mesi residui (solo se la nuova assunzione e' anch'essa del 2026).

      FONDI. Giovani 109,7 milioni nel 2026 (252,4 nel 2027, 135,4 nel 2028); Donne 26,5 milioni nel 2026
      (63,7 nel 2027, 51,3 nel 2028; 141,5 milioni in tutto, divisi 50,83% regioni piu' sviluppate, 7,04%
      Abruzzo-Marche-Umbria, 42,13% Sud); ZES 26 milioni nel 2026 (60 nel 2027, 34 nel 2028). L'INPS accoglie
      una domanda solo se c'e' copertura per tutti i mesi di esonero; quando i fondi finiscono non accoglie
      piu' domande.
