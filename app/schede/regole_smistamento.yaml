# Regole dello smistamento senza IA (python -m app.schede.smista).
#
# Ogni annuncio (titolo + riassunto) finisce in una di tre caselle:
#   rilevante      parla di aiuti alle imprese: contributi, voucher, incentivi, finanziamenti...
#   non_rilevante  parla chiaramente d'altro: concorsi, gare d'appalto vere, cimiteri, mense...
#   da_rivedere    tutto il resto: lo decidera' l'IA (Haiku) quando ci sara' la chiave API.
#
# Come si scrivono le parole:
#   - maiuscole, minuscole e accenti non contano ("Bonus bebè" = "bonus bebe");
#   - si cercano parole intere: "gara" non scatta dentro "garanzia";
#   - una frase ("fondo perduto") scatta solo con le parole in quell'ordine, spazi qualsiasi;
#   - l'asterisco in fondo vale "qualunque finale": "contribut*" prende contributo, contributi, contributiva;
#   - un gruppo con "con:" scatta solo se c'e' una delle "parole" E una delle parole di "con"
#     (es. "bando" da solo non basta, "bando" + "imprese" si').
#
# Come si decide, in quest'ordine:
#   1. c'e' una parola di "rilevante" e una di "contributi_non_per_imprese" (affitto, libri di testo...)
#      ma nessuna di "destinatari_imprese"                                   -> non_rilevante
#   2. c'e' una parola di "rilevante"                                        -> rilevante
#   3. c'e' una parola di "non_rilevante"                                    -> non_rilevante
#   4. altrimenti                                                            -> da_rivedere
# Quindi un segnale rilevante vince sempre sulle gare d'appalto: alcuni enti archiviano i contributi
# sotto "Bandi di gara" (regola di CLAUDE.md). Per lo stesso motivo "gara" e "appalto" non possono
# stare in "contributi_non_per_imprese": il programma si rifiuta di partire.
#
# Per aggiungere una parola basta una riga nel gruppo giusto; poi
#   python -m app.schede.smista --prova --rifai
# mostra, senza scrivere nulla, come cambierebbero le percentuali.

rilevante:
  - gruppo: contributi
    parole:
      - contribut*
      - fondo perduto
      - a fondo perduto
      - sovvenzion*
