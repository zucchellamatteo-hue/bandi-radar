  - gruppo: bando_o_misura_per_imprese
    parole: [bando, bandi, misura, misure, fondo, sostegno, avviso]
    con: [impres*, pmi, microimpres*, startup, start up, start-up, artigian*, esercizi commerciali,
          attivita commerciali, attivita produttive, filiere, agricoltori, imprenditor*]
  - gruppo: bando_su_temi_di_impresa
