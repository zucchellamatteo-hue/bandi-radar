# Controllo automatico (02/10/2026): a ogni pull request e a ogni modifica di main girano tutti i test, anche quelli
# sul database (con un Postgres di prova vuoto), e il controllo dei tipi e la build della plancia.
# Se qualcosa non va, la pull request lo mostra in rosso prima di unirla (= prima della produzione).
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: prova
          POSTGRES_DB: prova
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d prova" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: prova
      PGDATABASE: prova
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Registro delle fonti
        run: python -m app.fonti.verifica --solo-controllo
      - name: Test (anche sul database)
        run: python -m pytest -q -p no:cacheprovider tests

  plancia:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plancia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plancia/package-lock.json
      - run: npm ci
      - run: npm run build
