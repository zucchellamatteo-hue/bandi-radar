  ente: Camera di commercio di Torino
  tipo: camera
  territorio: PIE
  url: https://www.to.camcom.it/finanziamenti-bandi-e-contributi
  modalita: html
  feed_url: null
  piattaforma: drupal
  frequenza: settimanale
  stato: attiva
  verificato_il: '2026-09-25'
  note: 'Pagina "hub" testuale (Drupal 9), non un elenco strutturato: paragrafi con titolo per ogni misura, camerale
    e non (Unioncamere UNI/PdR 192, Transizione 5.0, Simest, Basket Bond Piemonte, Voucher digitalizzazione PMI
    2026, voucher cloud/cyber MIMIT...). Da osservare il testo intero e passare all''IA i paragrafi nuovi. Pagine
    collegate: /contributi (bandi formazione e orientamento), /bandi-e-incentivi-il-turismo (turismo), /contributi-promozione-economica.
    Nessun RSS (/rss.xml risponde 404). Non filtrare "Bandi di gara" (/bandi-di-gara sono appalti, da ignorare).
    25/09/2026: in modalita'' html si leggevano 0 elementi perche'' l''HTML del sito e'' malformato (menu account
    con "<div></nav></div>" dentro il menu della testata): il lettore vede tutta la pagina dentro il menu e la
    scarta. Corretto il lettore HTML (un <nav> si toglie solo se non contiene il contenuto): in modalita'' html
    si leggono 23 link. I titoli sono spesso il testo del link (es. "piano nazionale Transizione 5.0",
    "prorogato fino al 30/04/2027") o il titolo del riquadro ("Portale Agevolazioni"), non il nome della misura.
    Il link GSE contiene parametri di sessione e potrebbe risultare "nuovo" a ogni visita. /cameranews e
    /contributi-promozione-economica non hanno elenchi.

    '

