- id: incentivi_gov_open_data
  nome: incentivi.gov.it - Open data (registro incentivi)
  ente: Ministero delle Imprese e del Made in Italy (portale incentivi.gov.it)
  tipo: nazionale
  territorio: ITA
  url: https://www.incentivi.gov.it/it/open-data
  modalita: api
  feed_url: https://www.incentivi.gov.it/sites/default/files/open-data/
  piattaforma: drupal
  frequenza: giornaliera
  stato: da_verificare
  verificato_il: '2026-09-24'
  note: 'Non aperto da qui (connessione chiusa dal sito). Da ricerca web: la pagina open-data offre l''export dell''intero
    registro incentivi in CSV compresso e JSON, licenza IODL 2.0, con campi ID_Incentivo, Titolo, Descrizione, Data_apertura,
    Data_chiusura, Forma_agevolazione, Settore_Attivita, Codici_ATECO, ecc. Un file di esempio indicizzato dai motori:
    /sites/default/files/open-data/2025-4-5_opendata-export.csv (nome con data, quindi cambia a ogni export: il
    feed_url e'' la cartella, il file va scoperto dalla pagina). Da verificare dal server: nome del file corrente
    e frequenza di aggiornamento. Su dati.gov.it non risulta un dataset dedicato (ricerca "incentivi.gov.it" senza
    esito).

    '

