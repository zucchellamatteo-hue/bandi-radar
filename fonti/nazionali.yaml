    pensioni, contributi e prestazioni (rumore); con "incentiv" una decina all'anno, quasi tutti pertinenti
    (incentivi all'assunzione, autoimpiego, de minimis). Il filtro "o_esonero" (esoneri contributivi) e' un'alternativa
    da valutare con Matteo. Serve piu' per aggiornare le misure nazionali che come fonte di bandi.
  richiesta:
    url_modello: https://www.inps.it/it/it/inps-comunica/atti/circolari-messaggi-e-normativa/dettaglio.{selectors}.html

