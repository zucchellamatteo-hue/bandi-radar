- id: inps_circolari_incentivi
  nome: INPS - Circolari e messaggi sugli incentivi
  ente: Istituto Nazionale della Previdenza Sociale
  tipo: nazionale
  territorio: ITA
  url: https://www.inps.it/it/it/inps-comunica/atti/circolari-messaggi-e-normativa.html
  modalita: api
  feed_url: https://www.inps.it/content/scorporati/search/jcr:content.search.2f636f6e74656e742f64616d2f696e70732d736974652f69742f73636f72706f726174692f636972636f6c6172692d652d6d65737361676769.30.3135.67696f726e6f.44455343.636972636f6c6172692d652d6d65737361676769.6f5f696e63656e746976.json
  piattaforma: aem
  frequenza: settimanale
  stato: attiva
  verificato_il: '2026-10-06'
  note: >
    Aggiunta il 06/10 (Bonus giovani, donne e ZES delle circolari 55, 56 e 57 del 14/05/2026 mancavano). La pagina
    riempie l'elenco via JavaScript dall'API interna /content/scorporati/search/jcr:content.search.<parametri>.json,
    con i parametri scritti in esadecimale: cartella, pagina (0), quanti (15), ordine (giorno DESC), modello e il
