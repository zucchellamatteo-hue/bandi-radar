- id: incentivi_gov_ricerca
  nome: incentivi.gov.it - Catalogo incentivi (ricerca interna)
  ente: Ministero delle Imprese e del Made in Italy (portale incentivi.gov.it)
  tipo: nazionale
  territorio: ITA
  url: https://www.incentivi.gov.it/it/catalogo
  modalita: api
  feed_url: https://www.incentivi.gov.it/solr/coredrupal/select?q=*:*&fq=index_id:incentivi&sort=ds_last_update%20desc&rows=200&wt=json&fl=id:zs_nid,titolo:zs_title,url:zs_url,riassunto:zs_body,data:ds_last_update,apertura:zs_field_open_date,scadenza:zs_field_close_date,link_ente:zs_field_link,regioni:zm_field_regions_value,dimensioni:zm_field_dimensions_value,forma:zm_field_support_form_value,ambito:zm_field_scopes_value,soggetti:zm_field_subject_type_value,spese:zm_field_granted_costs_value,settori:zm_field_activity_sector_value,ateco:zs_field_ateco,costo_min:zs_field_cost_min,costo_max:zs_field_cost_max,dotazione:zs_field_budget_allocation,gestore:zs_field_subject_grant
  piattaforma: drupal
  frequenza: giornaliera
  stato: attiva
  verificato_il: '2026-09-24'
  note: >
    Verificata dal VPS il 24/09: la pagina "Cerca incentivi" interroga un motore Solr interno
    (/solr/coredrupal/select, non vietato da robots.txt) con l'intero catalogo: 5.904 misure nazionali,
    regionali e locali. Si chiedono le 200 aggiornate piu' di recente (sort=ds_last_update desc); con fl=
    i campi vengono rinominati (alias) nei nomi che il lettore generico conosce: titolo, url, data
    (apertura), scadenza (chiusura), piu' dimensioni d'impresa, forma di agevolazione, spese ammesse,
    ATECO, regioni, dotazione, che restano nei dati grezzi per le schede. Circa 1 MB per lettura.
    Il 27/09 (valutazione dell'efficacia): /it/cerca-incentivi risponde 404, la pagina del catalogo e'
    /it/catalogo. "data" e' l'ultimo aggiornamento della scheda (ds_last_update), "apertura" la data di
    apertura (prima era "data": una data futura sembrava una pubblicazione). La scorta legge in una sola
    richiesta tutte le 5.909 misure (3,9 MB, meno di un secondo) e tiene quelle senza chiusura o con
    chiusura da oggi in poi: 823 al 27/09 (618 con scadenza futura, 205 senza). I campi zs_ sono testo e
    Solr non li filtra per data: il filtro lo fa la raccolta.
  pagina_ufficiale:                    # la scheda del catalogo rimanda al sito dell'ente
    campo: link_ente
  scorta:
    url: https://www.incentivi.gov.it/solr/coredrupal/select?q=*:*&fq=index_id:incentivi&rows=10000&wt=json&fl=id:zs_nid,titolo:zs_title,url:zs_url,riassunto:zs_body,data:ds_last_update,apertura:zs_field_open_date,scadenza:zs_field_close_date,link_ente:zs_field_link,regioni:zm_field_regions_value,dimensioni:zm_field_dimensions_value,forma:zm_field_support_form_value,ambito:zm_field_scopes_value,soggetti:zm_field_subject_type_value,spese:zm_field_granted_costs_value,settori:zm_field_activity_sector_value,ateco:zs_field_ateco,costo_min:zs_field_cost_min,costo_max:zs_field_cost_max,dotazione:zs_field_budget_allocation,gestore:zs_field_subject_grant
    scadenza: scadenza
    frequenza: settimanale

