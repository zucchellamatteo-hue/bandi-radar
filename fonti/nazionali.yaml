- id: ue_funding_tenders_api
  nome: Portale Funding & Tenders UE - API di ricerca (SEDIA)
  ente: Commissione europea
  tipo: ue
  territorio: UE
  url: https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/topic-search
  modalita: api
  feed_url: https://api.tech.ec.europa.eu/search-api/prod/rest/search?apiKey=SEDIA&text=***&pageSize=50&pageNumber=1
  piattaforma: sedia
  frequenza: giornaliera
  stato: attiva
  verificato_il: '2026-09-24'
  note: 'Verificata con esito 200. Chiamata: POST multipart/form-data con parte "query" (JSON, content-type application/json
    obbligatorio: senza dichiararlo il server risponde 500) e opzionali "languages" (["en"]) e "sort" ({"field":"startDate","order":"DESC"}).
    Query minima per topic e bandi aperti o in apertura: {"bool":{"must":[{"terms":{"type":["1","2"]}},{"terms":{"status":["31094501","31094502"]}}]}}
    (status 31094501 = forthcoming, 31094502 = open, 31094503 = closed). Risposta JSON con totalResults (1088 topic
    aperti/in apertura al 24/09/2026) e per ogni risultato metadata.identifier, title, callIdentifier, callTitle,
    status, startDate, deadlineDate, deadlineModel, frameworkProgramme, programmePeriod e url della scheda. GET
    non ammesso (405). Il portale HTML e'' un''app JavaScript: serve solo come riferimento umano.

    '

