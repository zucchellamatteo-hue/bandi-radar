- id: ministero_turismo_strumenti
  nome: Ministero del Turismo - Strumenti di sostegno
  ente: Ministero del Turismo
  tipo: nazionale
  territorio: ITA
  url: https://www.ministeroturismo.gov.it/strumenti-di-sostegno/
  modalita: rss
  feed_url: https://www.ministeroturismo.gov.it/feed/
  piattaforma: wordpress
  frequenza: giornaliera
  stato: attiva
  verificato_il: '2026-09-25'
  note: >
    La pagina risponde 200 (118 KB) ma il sito e' protetto da un bot manager Radware: la home ha rimandato a
    una pagina di controllo e nel HTML della sezione non compaiono link leggibili (probabile caricamento via
    JavaScript). Dalla home risultano le sezioni /fondo-per-il-turismo-sostenibile/ (avvisi pubblici n. 1, 2,
    3 ed edizione 2024), /fondo-unico-nazionale-per-il-turismo/, /strumenti-di-sostegno/fondo-accessibilita-
    turistica/. Il feed /feed/ (200, 10 voci) e' quasi solo rassegna stampa: non usarlo come elenco bandi. Da
    riprovare dal server con browser senza interfaccia. Dal VPS il 24/09: bot manager Radware; con richiesta
    semplice 118 KB senza testo, col browser una volta la pagina completa (senza elenco leggibile) e una volta
    la pagina di controllo. Bloccata anche dal VPS il 24/09.
    Dal VPS il 25/09: robots.txt permette tutto; Radware serve normalmente al nostro User-Agent il feed
    generale /feed/ (10 voci, circa 5 giorni) e la sitemap, mentre la pagina, l'API wp-json e il feed di
    categoria /category/avvisi/feed/ ricevono la pagina di controllo o un captcha (non insistere). Il feed
    generale mescola rassegna stampa e comunicati, ma contiene anche gli avvisi con categoria "Avvisi
    pubblici" (es. 23/09/2026 "Staff House, Titolo III: secondo elenco", 21/09 consultazioni AIR/VIR): si
    usa quello, lettura giornaliera perche' 10 voci coprono pochi giorni, e lo smistamento scarta la
    rassegna stampa. incentivi.gov.it ha 5 misure del Ministero del Turismo (Staff house Titolo II 2026).
  scorta:                              # 27/09: il feed ha 10 articoli (pochi giorni); la sitemap dei post ha tutti gli articoli recenti
    url: https://www.ministeroturismo.gov.it/sitemap_index.xml
    modalita: sitemap

- id: mase_bandi_avvisi
  nome: MASE - Bandi e avvisi
  ente: Ministero dell'Ambiente e della Sicurezza Energetica
  tipo: nazionale
  territorio: ITA
  url: https://www.mase.gov.it/portale/bandi-e-avvisi
  modalita: html
  feed_url: null
  piattaforma: liferay
  frequenza: settimanale
  stato: attiva
  verificato_il: '2026-09-24'
  note: 'Akamai blocca gli User-Agent non da browser: si usa un UA da browser con in coda il nostro nome e contatto.
    L''elenco (15 link /portale/-/<slug>) e'' gia'' nell''HTML. Verificato il 24/09 dal cloud, da confermare dal
    server.

    Dal 06/10 la scorta legge l''elenco a 30 per pagina (?delta=30&start=1,2,...; circa 37 pagine in tutto, dal
    2022): 4 pagine arrivano a maggio 2025. Elenco misto (bandi, decreti, gare, interpelli): niente scadenze nei
    dati, lo smistamento scarta il resto. Liferay aggiunge a ogni link ?p_l_back_url=<pagina di provenienza>, che il
    lettore toglie. Il decreto "hard-to-abate" (DD 173/2026) non e'' in questo elenco.'
  richiesta:
    intestazioni:
      User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36
        BandiRadar/0.1 (+https://finanzagevolata.qiaro.it)
  scorta:
    url: https://www.mase.gov.it/portale/bandi-e-avvisi?delta=30
    parametro: start
    inizio: 1
    passo: 1
    pagine: 4

